<style>

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<style>
#cl-bar{position:fixed;right:10px;bottom:10px;z-index:60;background:var(--surface,#fff);border:1px solid var(--line,#ddd);border-radius:999px;padding:6px 12px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;gap:8px;align-items:center}

<script>
(function(){
const APP_URL='https://script.google.com/macros/s/AKfycbwFChTuoFMYvY45n7mffKezzBJP34WWOaf4v9Vfaonbm34Z083W38xE6WFnUoCtvwCV/exec';
const KEY='usn-cloud',QKEY='usn-cloud-q';
let C={url:APP_URL,pass:''};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){C.pass=s.pass||'';if(s.url&&!APP_URL)C.url=s.url}}catch(e){}
let Q={};try{Q=JSON.parse(localStorage.getItem(QKEY)||'{}')||{}}catch(e){Q={}}
const D={};const L={};let since=0,sending=false,lastErr='';
const saveQ=()=>{try{localStorage.setItem(QKEY,JSON.stringify(Q))}catch(e){}};
const call=async body=>{const r=await fetch(C.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,pass:C.pass})});const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j};
const live=c=>Object.entries(D[c]||{}).filter(([,d])=>!d._del);
const fire=c=>(L[c]||[]).forEach(f=>f());
const bar=document.createElement('div');bar.id='cl-bar';
const setBar=()=>{const n=Object.keys(Q).length;bar.className=lastErr?'err':(n||sending)?'busy':'';
  bar.innerHTML=`<span class="d"></span><span>${lastErr?'未送信 '+n+'件（通信できません）':n?'送信中…':'共有データに保存済み'}</span><button type="button" id="cl-re">更新</button><button type="button" id="cl-out">接続先</button>`;
  bar.querySelector('#cl-re').onclick=()=>{pull();flush()};
  bar.querySelector('#cl-out').onclick=()=>{if(Object.keys(Q).length){alertBox('まだ送信していない記録があります。通信できる状態で「更新」を押してから変更してください。');return}showForm('合言葉や接続先を入れ直します。')};};
function alertBox(m){bar.querySelector('span:nth-child(2)').textContent=m;setTimeout(setBar,4000)}
function apply(docs){const touched=new Set();
  docs.forEach(x=>{const k=x.col+'/'+x.id;if(Q[k])return;const cur=(D[x.col]||{})[x.id];if(cur&&Number(cur._u||0)>Number(x.doc._u||0))return;(D[x.col]=D[x.col]||{})[x.id]=x.doc;touched.add(x.col)});
  touched.forEach(fire)}
async function pull(){try{const j=await call({op:'get',since:since?since-120000:0});apply(j.docs||[]);since=j.now||Date.now();lastErr=''}catch(e){lastErr=String(e.message||e)}setBar()}
async function flush(){if(sending)return;const items=Object.entries(Q);if(!items.length){setBar();return}
  sending=true;setBar();
  try{await call({op:'put',docs:items.map(([k,doc])=>{const i=k.indexOf('/');return {col:k.slice(0,i),id:k.slice(i+1),doc}})});
    items.forEach(([k,doc])=>{if(Q[k]&&Q[k]._u===doc._u)delete Q[k]});saveQ();lastErr=''}
  catch(e){lastErr=String(e.message||e)}
  sending=false;setBar();if(!lastErr&&Object.keys(Q).length)flush()}
function write(c,id,doc){doc._u=Math.max(Date.now(),Number(((D[c]||{})[id]||{})._u||0)+1);(D[c]=D[c]||{})[id]=doc;Q[c+'/'+id]=doc;saveQ();fire(c);flush()}
const docRef=(c,id)=>({id,
  set:async d=>{write(c,id,JSON.parse(JSON.stringify(d)))},
  delete:async()=>{write(c,id,{_del:true})},
  onSnapshot:nx=>{const f=()=>{const d=(D[c]||{})[id];const ok=!!d&&!d._del;nx({exists:ok,data:()=>d})};(L[c]=L[c]||[]).push(f);f();return()=>{}}});
const db={collection:c=>({doc:id=>docRef(c,id||Date.now().toString(36)+Math.random().toString(36).slice(2,7)),
  onSnapshot:nx=>{const f=()=>{const docs=live(c).map(([id,d])=>({id,exists:true,data:()=>d}));nx({docs,size:docs.length,empty:!docs.length})};(L[c]=L[c]||[]).push(f);f();return()=>{}}}),
  doc:p=>{const i=p.indexOf('/');return docRef(p.slice(0,i),p.slice(i+1))}};
const downloads={save:async({filename,data})=>{const b=new Blob(['﻿'+data],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}};
let resolveDb;const dbReady=new Promise(r=>resolveDb=r);
function showForm(msg){
  const ov=document.createElement('div');ov.id='cl-ov';
  ov.innerHTML=`<form><h2>共有データにつなぐ</h2><p>${msg||'みんなで同じデータを使うため、最初に一度だけ合言葉を入れてください。このパソコン・スマホに記憶されます。'}</p>
  ${APP_URL?'':'<label>保存先のURL（…/exec）<input name="u" required placeholder="https://script.google.com/macros/s/…/exec"></label>'}
  <label>合言葉<input name="p" type="password" required autocomplete="current-password"></label><div class="e"></div><button>つなぐ</button></form>`;
  document.body.appendChild(ov);const f=ov.querySelector('form');
  if(!APP_URL&&C.url)f.u.value=C.url;
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;b.textContent='確認しています…';
    const prev={...C};C={url:APP_URL||f.u.value.trim(),pass:f.p.value};
    try{const j=await call({op:'get',since:0});
      Object.keys(D).forEach(k=>delete D[k]);since=0;apply(j.docs||[]);since=j.now||Date.now();lastErr='';
      try{localStorage.setItem(KEY,JSON.stringify(C))}catch(err){}
      ov.remove();Object.keys(L).forEach(fire);start()}
    catch(err){C=prev;f.querySelector('.e').textContent=String(err.message).includes('wrong pass')?'合言葉が違います。':'つながりませんでした。URLと通信状態を確認してください。';b.disabled=false;b.textContent='つなぐ'}};}
let started=false;
function start(){if(!document.body.contains(bar))document.body.appendChild(bar);setBar();resolveDb(db);flush();
  if(started)return;started=true;
  setInterval(()=>{if(!document.hidden){pull();flush()}},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull();flush()}});
  window.addEventListener('beforeunload',e=>{if(Object.keys(Q).length){e.preventDefault();e.returnValue=''}});}
async function boot(){
  if(!C.url||!C.pass){showForm();return}
  try{const j=await call({op:'get',since:0});apply(j.docs||[]);since=j.now||Date.now();start()}
  catch(e){if(String(e.message).includes('wrong pass')){showForm('合言葉が変わったようです。新しい合言葉を入れてください。');return}
    lastErr=String(e.message||e);start()}}
window.claude={use:async n=>n==='db'?dbReady:n==='downloads'?downloads:null};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtD=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;
const TODAY=fmtD(new Date());
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const x=parseD(s);x.setDate(x.getDate()+n);return fmtD(x)};
const dayDiff=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const ym=d=>d?String(d).slice(0,7):'';
const monthAdd=(M,n)=>{let [y,m]=M.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${pad(m)}`};
const monthEnd=M=>{const [y,m]=M.split('-').map(Number);return fmtD(new Date(y,m,0))};
const jpM=M=>{const [y,m]=M.split('-').map(Number);return `${y}年${m}月`};
const jpD=d=>d?`${Number(d.slice(5,7))}/${Number(d.slice(8,10))}`:'—';

async function save(col,id,data){
  if(!db){toast('保存できません（共有データに接続していません）');return false}
  const clean={};for(const [k,v] of Object.entries(data)) if(v!==undefined) clean[k]=v;

  try{await db.collection(col).doc(id||newId()).set(clean);return true}
  catch(e){toast(e.code==='invalid_argument'?'この画面では書き込みの権限がありません':'保存に失敗しました。もう一度お試しください');return false}

/* ---------- calculations ---------- */
function breedStats(m){
  const recs=S.ai.filter(r=>ym(r.date)===m);
  const judged=recs.filter(r=>r.result==='受胎'||r.result==='不受胎');
  const ok=judged.filter(r=>r.result==='受胎');
  const fy=S.ai.filter(r=>inFY(r.date,m)&&(r.result==='受胎'||r.result==='不受胎'));
  const by=meth=>{const j=judged.filter(r=>meth==='AI'?r.method==='AI':r.method!=='AI');return {n:j.length,rate:pct(j.filter(r=>r.result==='受胎').length,j.length)}};
  return {count:recs.length,judged:judged.length,pending:recs.length-judged.length,rate:pct(ok.length,judged.length),
    fyRate:pct(fy.filter(r=>r.result==='受胎').length,fy.length),fyN:fy.length,ai:by('AI'),et:by('ET')}}
function opuStats(m){
  const mo=S.opu.filter(r=>ym(r.date)===m), fy=S.opu.filter(r=>inFY(r.date,m));
  const s=a=>({collected:sum(a.map(r=>r.collected)),cultured:sum(a.map(r=>r.cultured)),produced:sum(a.map(r=>r.produced)),freshET:sum(a.map(r=>r.freshET)),frozen:sum(a.map(r=>r.frozen)),n:a.length});
  return {mo:s(mo),fy:s(fy)}}
function dueList(){
  return S.ai.filter(r=>r.result==='受胎').map(r=>{const due=addDays(r.date,GEST);
    const c=S.calving.find(c=>c.damId===r.cowId&&Math.abs(dayDiff(due,c.date))<=30);
    return {...r,due,calved:c||null}}).sort((a,b)=>a.due<b.due?-1:1)}
function calvingStats(m){
  const dl=dueList();const end=m===ym(TODAY)?TODAY:monthEnd(m);
  const dueFY=dl.filter(r=>inFY(r.due,m)&&r.due<=end);
  const done=dueFY.filter(r=>r.calved);
  const mo=S.calving.filter(c=>ym(c.date)===m);
  return {mo:mo.length,live:mo.filter(c=>c.status!=='死産').length,male:mo.filter(c=>c.sex==='雄').length,female:mo.filter(c=>c.sex==='雌').length,
    avgW:avg(mo.map(c=>num(c.weight))),rate:pct(done.length,dueFY.length),dueN:dueFY.length,doneN:done.length,
    next:dl.filter(r=>!r.calved&&r.due>=addDays(TODAY,-20)&&r.due<=addDays(TODAY,60))}}
function semenStats(m){
  return S.semen.map(s=>{const uses=S.ai.filter(r=>r.method==='AI'&&r.semenId===s.id);
    const j=uses.filter(r=>inFY(r.date,m)&&(r.result==='受胎'||r.result==='不受胎'));
    const stock=(num(s.received)||0)-uses.length;
    return {...s,used:uses.length,usedMo:uses.filter(r=>ym(r.date)===m).length,stock,low:stock<=(num(s.minStock)??cfg().targets.semenMin),
      rate:pct(j.filter(r=>r.result==='受胎').length,j.length),rateN:j.length}}).sort((a,b)=>a.stock-b.stock)}
function growStats(m,farm){
  const all=S.cattle.filter(c=>c.farm===farm&&c.kind!=='繁殖');
  const shipped=all.filter(c=>c.status==='出荷'&&ym(c.shipDate)===m);
  const fyS=fyStartM(m)+'-01', end=monthEnd(m);
  const atStart=all.filter(c=>c.introDate&&c.introDate<fyS&&!((c.status==='出荷'&&c.shipDate<fyS)||(c.status==='死亡'&&c.deathDate<fyS))).length;
  const intro=all.filter(c=>inFY(c.introDate,m)).length;
  const deaths=all.filter(c=>c.status==='死亡'&&inFY(c.deathDate,m)).length;
  const head=all.filter(c=>c.introDate&&c.introDate<=end&&!((c.status==='出荷'&&c.shipDate<=end)||(c.status==='死亡'&&c.deathDate<=end))).length;
  return {shipped:shipped.length,weight:avg(shipped.map(c=>num(c.shipWeight))),
    age:avg(shipped.filter(c=>c.birthDate).map(c=>dayDiff(c.birthDate,c.shipDate))),
    dg:avg(shipped.filter(c=>c.introWeight&&c.shipWeight&&c.introDate).map(c=>(c.shipWeight-c.introWeight)/Math.max(1,dayDiff(c.introDate,c.shipDate)))),
    deaths,deathsMo:all.filter(c=>c.status==='死亡'&&ym(c.deathDate)===m).length,base:atStart+intro,mortality:pct(deaths,atStart+intro),head,intro}}
function carcassStats(m){
  const row=a=>({n:a.length,w:avg(a.map(r=>num(r.weight))),hi:pct(a.filter(r=>/^[AB][45]$/.test(r.grade||'')).length,a.length),
    price:avg(a.map(r=>num(r.price))),sales:sum(a.map(r=>(num(r.weight)||0)*(num(r.price)||0))),
    received:sum(a.map(r=>r.received)),recN:a.filter(r=>num(r.received)!=null).length,
    deduct:sum(a.filter(r=>num(r.received)!=null).map(r=>(num(r.weight)||0)*(num(r.price)||0)-num(r.received)))});
  const mo=S.carcass.filter(r=>ym(r.date)===m), fy=S.carcass.filter(r=>inFY(r.date,m));
  return {mo:row(mo),fy:row(fy),barns:cfg().barns.map(b=>({barn:b,mo:row(mo.filter(r=>r.barn===b)),fy:row(fy.filter(r=>r.barn===b))}))}}
function stockStats(){
  const open=new Set(S.orders.filter(o=>o.status!=='入荷済').map(o=>o.itemId));
  const need=S.items.filter(i=>num(i.stock)!=null&&num(i.stock)<=num(i.reorderPoint));
  const last=S.items.map(i=>i.countedAt).filter(Boolean).sort().pop()||null;
  return {need,needNew:need.filter(i=>!open.has(i.id)),open,last,stale:!last||dayDiff(last.slice(0,10),TODAY)>7}}
function invStats(m){
  const mo=S.invoices.filter(r=>ym(r.date)===m);
  const cats={};mo.forEach(r=>{const c=normCat(r.category||'雑費');cats[c]=(cats[c]||0)+(num(r.total)||0)});
  return {n:mo.length,total:sum(mo.map(r=>r.total)),unchecked:mo.filter(r=>r.checked!=='yes').length,cats}}

function buildReport(m){
  const T=cfg().targets, b=breedStats(m), o=opuStats(m), c=calvingStats(m), sm=semenStats(m), ca=carcassStats(m), st=stockStats(), iv=invStats(m);
  const pace=monthsIn(m)/12;
  const K=[];
  const add=(g,name,v,unit,t,dir,fmt,tl)=>K.push({g,name,v,unit,t,dir,fmt:fmt||f1,tl,state:judge(v,t,dir)});
  add('繁殖','受胎率（今月）',b.rate,'%',T.conception,'up');
  add('繁殖','受胎率（年度累計）',b.fyRate,'%',T.conception,'up');
  add('繁殖','培養卵数（年度累計）',o.fy.cultured,'個',T.cultured*pace,'up',f0,`年${f0(T.cultured)}・今月時点${f0(T.cultured*pace)}`);
  add('繁殖','生産個数（年度累計）',o.fy.produced,'個',T.produced*pace,'up',f0,`年${f0(T.produced)}・今月時点${f0(T.produced*pace)}`);
  add('繁殖','新鮮卵移植個数（年度累計）',o.fy.freshET,'個',T.freshET*pace,'up',f0,`年${f0(T.freshET)}・今月時点${f0(T.freshET*pace)}`);
  add('繁殖','分娩率（年度累計）',c.rate,'%',T.calvingRate,'up');
  cfg().farms.forEach(f=>{const g=growStats(m,f),t=T.growing[f]||GDEF;
    add('育成・'+f,'出荷牛の平均体重',g.weight,'kg',t.shipWeight,'up');
    add('育成・'+f,'出荷牛の平均日齢',g.age,'日',t.shipAge,'down',f0);
    add('育成・'+f,'DG（1日の増体）',g.dg,'kg',t.dg,'up',f2);
    add('育成・'+f,'導入からの死亡率（年度）',g.mortality,'%',t.mortality,'down')});
  add('枝肉','平均枝肉重量（今月）',ca.mo.w,'kg',T.carcassWeight,'up');
  ca.barns.forEach(x=>{if(x.mo.n) add('枝肉',`${x.barn}の平均枝肉重量`,x.mo.w,'kg',T.carcassWeight,'up')});
  // checks
  const C=[];
  const stale=S.ai.filter(r=>r.result==='未判定'&&dayDiff(r.date,TODAY)>=40);
  C.push(stale.length?{s:'warn',t:`妊娠鑑定の結果が未入力：${stale.length}頭（授精から40日以上）`}:{s:'good',t:'妊娠鑑定の結果はすべて入っています'});
  C.push(st.stale?{s:'warn',t:`棚卸が1週間以上ありません（最終：${st.last?jpD(st.last.slice(0,10)):'未実施'}）`}:{s:'good',t:`棚卸は最新です（最終：${jpD(st.last.slice(0,10))}）`});
  C.push(st.needNew.length?{s:'bad',t:`発注が必要な品目：${st.needNew.map(i=>i.name).join('、')}`}:{s:'good',t:'発注が必要な品目はありません'});
  const lowS=sm.filter(s=>s.low);
  C.push(lowS.length?{s:'bad',t:`精液の在庫が少ない：${lowS.map(s=>`${s.bull} 残${s.stock}本`).join('、')}`}:{s:'good',t:'精液の在庫は足りています'});
  C.push(iv.unchecked?{s:'warn',t:`内容を確認していない請求書：${iv.unchecked}件`}:{s:'good',t:iv.n?'今月の請求書はすべて確認済みです':'今月の請求書はまだありません'});
  {const F=feedCalc(m);if(F.entered<cfg().farms.length)C.push({s:'warn',t:`月末の飼料在庫が未入力：${F.rows.filter(r=>r.close==null).map(r=>r.b).join('、')}`})}
  {const nr=S.carcass.filter(r=>ym(r.date)===m&&num(r.received)==null);if(nr.length)C.push({s:'warn',t:`枝肉の入金額が未入力：${nr.length}頭`})}
  const noW=S.cattle.filter(x=>x.status==='出荷'&&ym(x.shipDate)===m&&!x.shipWeight);
  if(noW.length) C.push({s:'warn',t:`出荷体重が未入力：${noW.length}頭`});
  const soon=c.next.filter(r=>r.due>=TODAY&&r.due<=addDays(TODAY,14));
  if(soon.length) C.push({s:'warn',t:`2週間以内に分娩予定：${soon.map(r=>`${r.cowId}（${jpD(r.due)}）`).join('、')}`});
  return {m,K,C,b,o,c,sm,ca,st,iv}}

function reportText(R){
  const lines=[`【${jpM(R.m)} 月次報告】神戸うすなが牧場`,''];
  let g='';R.K.forEach(k=>{if(k.g!==g){g=k.g;lines.push(`■ ${g}`)}
    lines.push(`・${k.name}：${k.fmt(k.v)}${k.v==null?'':k.unit}（目標 ${k.tl||(k.t==null?'—':k.fmt(k.t)+k.unit)}）… ${{good:'達成',warn:'あと少し',bad:'未達',none:'データなし'}[k.state]}`)});
  lines.push('',`■ 経費（請求書）`,`・合計 ${yen(R.iv.total)}（${R.iv.n}件）`);
  Object.entries(R.iv.cats).forEach(([c,v])=>lines.push(`　${c} ${yen(v)}`));
  lines.push(`■ 枝肉売上（今月）${yen(R.ca.mo.sales)}（${R.ca.mo.n}頭）`+(R.ca.mo.recN?`　入金額 ${yen(R.ca.mo.received)}（預託など差引 ${yen(R.ca.mo.deduct)}）`:''));
  {const inc=S.income.filter(r=>ym(r.date)===R.m);if(inc.length)lines.push(`■ 雑収入など（今月）${yen(sum(inc.map(r=>r.amount)))}（${inc.length}件）`)}
  {const F=feedCalc(R.m);lines.push(`■ 飼料（今月）請求書 ${yen(F.buy)}／実際に使った額 ${F.used==null?'在庫未入力':yen(F.used)}`);F.rows.forEach(r=>{if(r.used!=null)lines.push(`　${r.b} ${yen(r.used)}${r.per!=null?`（1頭1日 ${f0(r.per)}円）`:''}`)})}
  lines.push('','■ 確認事項');R.C.filter(c=>c.s!=='good').forEach(c=>lines.push('・'+c.t));
  const rep=S.reports.find(r=>r.id===R.m);if(rep&&rep.comment){lines.push('','■ 所見',rep.comment)}
  return lines.join('\n')}

const V={};
function feedCalc(m){ // 実際に使った飼料費＝前月末の在庫＋当月の飼料費（請求書）−当月末の在庫
  const bc=barnCost(m+'-01',monthEnd(m));const cur=(S.feedstock.find(d=>d.id===m)||{}).amounts||{},prev=(S.feedstock.find(d=>d.id===monthAdd(m,-1))||{}).amounts||{};
  const rows=cfg().farms.map(b=>{const x=bc[b]||{cats:{},hd:0};const buy=x.cats['飼料費']||0;const open=num(prev[b]),close=num(cur[b]);
    const used=close==null?null:(open||0)+buy-close;return {b,hd:x.hd,buy,open,close,used,per:used!=null&&x.hd?used/x.hd:null}});
  const done=rows.filter(r=>r.close!=null);
  return {rows,entered:done.length,buy:sum(rows.map(r=>r.buy)),open:sum(rows.map(r=>r.open||0)),close:sum(done.map(r=>r.close)),used:done.length?sum(done.map(r=>r.used)):null,hd:sum(done.map(r=>r.hd))}}

/* ---------- photo reading (AI) ---------- */
async function photoRead(kind){
  const lim=await sample.limits().catch(()=>null);
  if(!lim||!lim.images){toast('この画面では写真の読み取りが使えません');return}
  openModal(`<h2>${kind==='invoices'?'請求書':'分娩記録の紙'}を写真で読む</h2>
    <div class="fld"><label for="ph">写真を選ぶ（${kind==='invoices'?'1枚':'最大'+lim.images.maxCount+'枚'}）</label><input type="file" id="ph" accept="${lim.images.mediaTypes.join(',')}" ${kind==='calving'?'multiple':''}></div>
    <div class="ai-out" id="phOut"><span class="muted">写真を選ぶと読み取りを始めます。</span></div>
    <div class="sheet-f"><button class="btn" id="phX">やめる</button></div>`);
  let ctl=null;
  $('#phX').onclick=()=>{ctl&&ctl.abort();closeModal()};
  $('#ph').onchange=async e=>{
    const files=[...e.target.files].slice(0,lim.images.maxCount);if(!files.length)return;
    const out=$('#phOut');out.textContent='読み取っています…（30秒〜1分ほどかかります）';ctl=new AbortController();
    const yr=M.slice(0,4);
    const prompt=kind==='invoices'
      ?`この画像は牧場に届いた請求書です。次の形のJSONオブジェクトだけを返してください。\n{"vendor":"請求元の会社名","addressee":"請求書の宛名（会社名・個人名）","taxRate":"10%・8%・非課税・10%と8%が混在 のどれか","date":"YYYY-MM-DD（請求日）","total":税込の合計金額（数値）,"tax":消費税額（数値、書かれていなければnull）,"category":"${catOrder().join('・')} のうち最も合うもの","lines":[{"name":"品名","qty":数量,"amount":金額}]}\n読めない項目はnullにしてください。金額は数字だけ（円やカンマは付けない）。`
      :`この画像は牛の分娩の手書き記録です。書かれている子牛1頭ごとに1つのオブジェクトにして、JSON配列だけを返してください。\n[{"date":"YYYY-MM-DD（分娩日）","damId":"母牛の番号","calfId":"子牛の番号（なければnull）","sex":"雌 または 雄","weight":生時体重kg（数値、なければnull）,"status":"正常・難産・死産 のどれか（書かれていなければ正常）","note":"備考（なければ空文字）"}]\n年が書かれていない日付は${yr}年とします。読めない項目はnullにしてください。`;
    try{
      const data=await sample.json(prompt,{images:files,signal:ctl.signal,onText:()=>{out.textContent='読み取っています…'}});
      if(kind==='invoices'){
        if(!data||typeof data!=='object'||Array.isArray(data))throw {code:'invalid_json'};
        const lines=Array.isArray(data.lines)?data.lines:[];
        const own=cfg().owners.find(o=>data.addressee&&String(data.addressee).includes(o))||'';

/* ---------- 牛の在庫・会計 ---------- */
let OWN='';
const exitOf=c=>c.status==='出荷'?c.shipDate:c.status==='死亡'?c.deathDate:null;
const aliveOn=(c,d)=>c.introDate&&c.introDate<=d&&!(exitOf(c)&&exitOf(c)<=d);
function daysIn(c,from,to){if(!c.introDate)return 0;const s=c.introDate>from?c.introDate:from;const ex=exitOf(c);let e=to;if(ex&&ex<=to)e=addDays(ex,-1);return e<s?0:dayDiff(s,e)+1}
const ownOK=(r,o)=>!o||r.owner===o;
const CLASSES=['直接変動費','間接変動費','固定費','その他'];
const catList=()=>(cfg().categories&&cfg().categories.length?cfg().categories:DEF.categories);
const normCat=c=>((cfg().catAlias||DEF.catAlias)[c])||c;
const costClass=c=>(catList().find(x=>x.name===normCat(c))||{}).cls||'固定費';
const catOrder=()=>catList().map(x=>x.name);
const CLS_KEY={'直接変動費':'direct','間接変動費':'indirect','固定費':'fixed'};
const invBarn=r=>r.barn||((cfg().addrBarn||{})[r.addressee])||'';
function barnCost(from,to){ // 牛舎ごとの経費と延べ頭日（使用頭数×対象日数）
  const barns=cfg().farms,res={};barns.forEach(b=>res[b]={hd:0,direct:0,indirect:0,fixed:0,cats:{}});
  S.cattle.forEach(c=>{const r=res[c.farm];if(r)r.hd+=daysIn(c,from,to)});
  const hdAll=sum(barns.map(b=>res[b].hd));const cc={};res.__cc=cc;res.__hdAll=hdAll;
  S.invoices.filter(r=>r.date>=from&&r.date<=to).forEach(r=>{const amt=num(r.total)||0,cat=normCat(r.category||'雑費'),k=CLS_KEY[costClass(cat)];if(!k)return;
    const eb=invBarn(r);
    if(eb&&(cfg().costCenters||[]).includes(eb)){const x=cc[eb]=cc[eb]||{direct:0,indirect:0,fixed:0,cats:{}};x.cats[cat]=(x.cats[cat]||0)+amt;x[k]+=amt;return}
    const tg=eb&&res[eb]?[[eb,1]]:barns.map(b=>[b,hdAll?res[b].hd/hdAll:1/barns.length]);
    tg.forEach(([b,w])=>{const x=res[b];x.cats[cat]=(x.cats[cat]||0)+amt*w;x[k]+=amt*w})});
  barns.forEach(b=>{const x=res[b],per=v=>x.hd?v/x.hd:null;x.dPer=per(x.direct);x.iPer=per(x.indirect);x.vPer=per(x.direct+x.indirect);x.fPer=per(x.fixed);x.total=x.direct+x.indirect+x.fixed;x.mgmt=per(x.total)});
  return res}
function costPool(from,to,o){ // 所有者の費用＝各牛舎の費用×（その所有者の頭日÷牛舎の頭日）
  const bc=barnCost(from,to),cats={};let hd=0;
  cfg().farms.forEach(b=>{const x=bc[b];const ohd=o?sum(S.cattle.filter(c=>c.farm===b&&c.owner===o).map(c=>daysIn(c,from,to))):x.hd;hd+=ohd;
    const w=x.hd?ohd/x.hd:(o?0:1);Object.entries(x.cats).forEach(([k,v])=>cats[k]=(cats[k]||0)+v*w)});
  const wc=o?(bc.__hdAll?hd/bc.__hdAll:0):1;Object.values(bc.__cc).forEach(x=>Object.entries(x.cats).forEach(([k,v])=>cats[k]=(cats[k]||0)+v*wc));
  return {cats,total:sum(Object.values(cats)),hd,bc}}
function depOf(c,asOf){const p=num(c.introPrice)||0;if(!p||!c.introDate)return {acc:0,book:0,mo:0};
  const life=(num(cfg().usefulLife)||6)*12;const [y1,m1]=c.introDate.split('-').map(Number),[y2,m2]=asOf.split('-').map(Number);
  const n=Math.max(0,Math.min(life,(y2-y1)*12+(m2-m1)+1));const per=p/life;const acc=Math.min(p-1,per*n);
  return {acc,book:p-acc,mo:n>0&&n<=life?per:0}}
function assetCalc(m,o){
  const ms=m+'-01',me=monthEnd(m),fs=fyStartM(m)+'-01';
  const mo=costPool(ms,me,o),fy=costPool(fs,me,o);
  const setD=num(cfg().dailyCost);
  const dMo=setD??(mo.hd?mo.total/mo.hd:null), dFy=setD??(fy.hd?fy.total/fy.hd:null);
  const herd=S.cattle.filter(c=>ownOK(c,o));
  const rows=['育成','肥育','繁殖'].map(k=>{const a=herd.filter(c=>(c.kind||'育成')===k);
    const start=a.filter(c=>c.introDate&&c.introDate<ms&&!(exitOf(c)&&exitOf(c)<ms)).length;
    const inn=a.filter(c=>ym(c.introDate)===m).length,ship=a.filter(c=>c.status==='出荷'&&ym(c.shipDate)===m).length,dead=a.filter(c=>c.status==='死亡'&&ym(c.deathDate)===m).length;
    return {k,start,inn,ship,dead,end:start+inn-ship-dead}});
  const alive=herd.filter(c=>aliveOn(c,me));
  const perDay=c=>setD??(fy.bc[c.farm]&&fy.bc[c.farm].mgmt)??dFy??0;
  const stock=alive.filter(c=>c.kind!=='繁殖').map(c=>{const d=dayDiff(c.introDate,me)+1;const p=num(c.introPrice)||0,pd=perDay(c);return {c,d,p,pd,cost:pd*d,val:p+pd*d}}).sort((a,b)=>b.val-a.val);
  const breed=alive.filter(c=>c.kind==='繁殖').map(c=>({c,...depOf(c,m)}));
  const byOwner=cfg().owners.map(ow=>{const al=S.cattle.filter(c=>c.owner===ow&&aliveOn(c,me));
    return {ow,n:al.length,val:sum(al.filter(c=>c.kind!=='繁殖').map(c=>(num(c.introPrice)||0)+perDay(c)*(dayDiff(c.introDate,me)+1))),book:sum(al.filter(c=>c.kind==='繁殖').map(c=>depOf(c,m).book))}});
  // 損益（今月・年度累計）
  const pl=(from,to,pool)=>{const car=S.carcass.filter(r=>ownOK(r,o)&&r.date>=from&&r.date<=to);const sh=herd.filter(c=>c.status==='出荷'&&c.shipDate>=from&&c.shipDate<=to);
    const salesC=sum(car.map(r=>(num(r.weight)||0)*(num(r.price)||0))),salesS=sum(sh.map(c=>num(c.shipPrice)||0));
    let dep=0;const [fy1,fm1]=from.split('-').map(Number),[ty,tm]=to.split('-').map(Number);let k=`${fy1}-${pad(fm1)}`;const last=`${ty}-${pad(tm)}`;
    while(k<=last){dep+=sum(herd.filter(c=>c.kind==='繁殖'&&c.introDate&&ym(c.introDate)<=k&&!(exitOf(c)&&ym(exitOf(c))<k)).map(c=>depOf(c,k).mo));k=monthAdd(k,1)}
    const misc=sum(S.income.filter(r=>ownOK(r,o)&&r.date>=from&&r.date<=to).map(r=>r.amount));
    const exp=pool.total+dep;return {salesC,salesS,sales:salesC+salesS,misc,cats:pool.cats,dep,exp,profit:salesC+salesS+misc-exp}};
  return {rows,alive,stock,breed,byOwner,mo,fy,dMo,dFy,setD,plMo:pl(ms,me,mo),plFy:pl(fs,me,fy),
    stockVal:sum(stock.map(x=>x.val)),bookVal:sum(breed.map(x=>x.book))}}
function finText(A,m,o){const L=[`【${jpM(m)} 牛の在庫・会計（試算）】${o||'全体'}`,'','■ 損益計算書（今月／年度累計）'];
  const r=(n,a,b)=>L.push(`${n}：${yen(a)}／${yen(b)}`);
  r('売上高',A.plMo.sales,A.plFy.sales);r('　枝肉売上',A.plMo.salesC,A.plFy.salesC);r('　出荷販売額',A.plMo.salesS,A.plFy.salesS);r('雑収入など',A.plMo.misc,A.plFy.misc);
  catOrder().forEach(c=>{if(A.plMo.cats[c]||A.plFy.cats[c])r('　'+c,A.plMo.cats[c]||0,A.plFy.cats[c]||0)});
  r('　減価償却費（繁殖牛）',A.plMo.dep,A.plFy.dep);r('費用合計',A.plMo.exp,A.plFy.exp);r('差引損益',A.plMo.profit,A.plFy.profit);
  L.push('',`■ 貸借対照表（牛の部分・${jpD(monthEnd(m))}時点）`,`棚卸資産（育成・肥育牛 ${A.stock.length}頭）：${yen(A.stockVal)}`,`固定資産（繁殖牛 ${A.breed.length}頭・簿価）：${yen(A.bookVal)}`,`飼育管理費（全体平均）：${A.dFy==null?'—':f0(A.dFy)+'円/頭日'}`);
  return L.join('\n')}
function barnTable(bc,label){const bs=cfg().farms;const tot={hd:0,direct:0,indirect:0,fixed:0};bs.forEach(b=>{['hd','direct','indirect','fixed'].forEach(k=>tot[k]+=bc[b][k])});

  return `<div class="kg-h">${esc(label)}</div>`+table(['牛舎',{t:'延べ頭日',n:1},{t:'直接変動費',n:1},{t:'間接変動費',n:1},{t:'変動費',n:1},{t:'固定費',n:1},{t:'飼育管理費',n:1},{t:'経費合計',n:1}],rows)}

    const pr=(n,a,b)=>rows.push(['損益計算書',n,Math.round(a),Math.round(b)]);
    pr('枝肉売上',A.plMo.salesC,A.plFy.salesC);pr('出荷販売額',A.plMo.salesS,A.plFy.salesS);pr('雑収入など',A.plMo.misc,A.plFy.misc);
    catOrder().forEach(c=>{if(A.plMo.cats[c]||A.plFy.cats[c])pr(c,A.plMo.cats[c]||0,A.plFy.cats[c]||0)});
    pr('減価償却費（繁殖牛）',A.plMo.dep,A.plFy.dep);pr('差引損益',A.plMo.profit,A.plFy.profit);
    rows.push(['貸借対照表','棚卸資産（育成・肥育牛）',Math.round(A.stockVal),'']);rows.push(['貸借対照表','繁殖牛（簿価）',Math.round(A.bookVal),'']);
    cfg().farms.forEach(b=>{const m=A.mo.bc[b],f=A.fy.bc[b];[['直接変動費','dPer'],['間接変動費','iPer'],['変動費','vPer'],['固定費','fPer'],['飼育管理費','mgmt']].forEach(([n,k])=>rows.push(['1頭1日コスト',`${b} ${n}`,m[k]==null?'':Math.round(m[k]),f[k]==null?'':Math.round(f[k])]))});
    A.stock.forEach(x=>rows.push(['個体別資産価値',x.c.earTag,Math.round(x.val),x.c.owner||'']));
    const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
    try{await downloads.save({filename:`牛の在庫と損益_${OWN||'全体'}_${M}.csv`,data:csv});toast('保存しました')}catch(e){if(e.code!=='declined')toast('保存できませんでした')}}};

let catSeq=0;
const catRowHtml=(x,i)=>{const id='c'+(catSeq++);return `<tr data-cat="${id}"><td><input id="cn_${id}" value="${esc(x.name)}" style="width:100%;min-width:9em;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface)"></td><td><select id="cc_${id}" style="border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface)">${CLASSES.map(c=>`<option${x.cls===c?' selected':''}>${c}</option>`).join('')}</select></td><td><button class="btn sm dng" data-catdel="${id}">削除</button></td></tr>`};
V.goals=()=>{
  const c=cfg(),T=c.targets;const hasSample=COLS.some(k=>S[k].some(r=>r.sample));
  const inp=(id,l,v,step)=>`<div class="fld"><label for="${id}">${l}</label><input id="${id}" type="number" inputmode="decimal" step="${step||'any'}" value="${v??''}"></div>`;
  return `
  <h1 class="pg">目標・設定</h1>
  <section class="sec"><div class="sec-h"><h2>繁殖・枝肉の目標</h2><span class="sub">年間の数は、月次報告で「今月時点の目安」に割り戻して比べます</span></div>
    <div class="form">${inp('t_conception','受胎率（%）',T.conception)}${inp('t_calvingRate','分娩率（%）',T.calvingRate)}${inp('t_cultured','培養卵数（年間・個）',T.cultured)}${inp('t_produced','生産個数（年間・個）',T.produced)}${inp('t_freshET','新鮮卵移植個数（年間・個）',T.freshET)}${inp('t_carcassWeight','平均枝肉重量（kg）',T.carcassWeight)}${inp('t_semenMin','精液の発注点（本・標準）',T.semenMin)}</div></section>
  <section class="sec"><div class="sec-h"><h2>育成の目標（牛舎ごと）</h2></div>
    ${c.farms.map(f=>{const t=T.growing[f]||GDEF;return `<div class="kg-h">${esc(f)}</div><div class="form">${inp(`g_${f}_shipWeight`,'出荷時の平均体重（kg）',t.shipWeight)}${inp(`g_${f}_shipAge`,'出荷時の平均日齢（日・以下）',t.shipAge)}${inp(`g_${f}_dg`,'DG（kg/日）',t.dg)}${inp(`g_${f}_mortality`,'死亡率（%・以下）',t.mortality)}</div>`}).join('')}</section>
  <section class="sec"><div class="sec-h"><h2>勘定科目</h2><span class="sub">請求書の「費目」に出てくる一覧です。区分で1頭1日コストの分け方が決まります（「その他」は経費に入れません）</span><button class="btn" id="catAdd">＋ 科目を追加</button></div>
    <div class="tbl"><table><thead><tr><th>科目名</th><th>区分</th><th></th></tr></thead><tbody id="catRows">${catList().map((x,i)=>catRowHtml(x,i)).join('')}</tbody></table></div>
    <p class="sub" style="margin:0">科目名を変えると、その名前で入力した過去の請求書は「固定費」扱いになります。名前を変えるときは、新しい名前で追加してから古い科目を消してください。</p></section>
  <section class="sec"><div class="sec-h"><h2>基本の設定</h2></div>
    <div class="form"><div class="fld"><label for="s_fy">年度の始まりの月</label><select id="s_fy">${Array.from({length:12},(_,i)=>`<option value="${i+1}"${c.fyStart===i+1?' selected':''}>${i+1}月</option>`).join('')}</select></div>
    <div class="fld"><label for="s_farms">牛舎（読点で区切る）</label><input id="s_farms" value="${esc(c.farms.join('、'))}"></div>
    <div class="fld"><label for="s_office">証明書に載せる事業所名</label><input id="s_office" value="${esc(c.office)}"></div>
    <div class="fld"><label for="s_owners">牛の所有者・請求書の宛名（読点で区切る）</label><input id="s_owners" value="${esc(c.owners.join('、'))}"></div>
    ${c.owners.map(o=>`<div class="fld"><label for="ab_${esc(o)}">「${esc(o)}」宛ての請求書の牛舎（請求書入力のときの標準。入力時に変えられます）</label><select id="ab_${esc(o)}" data-ab="${esc(o)}"><option value="">決めない（頭数×日数で按分）</option>${c.barns.map(b=>`<option${(c.addrBarn||{})[o]===b?' selected':''}>${esc(b)}</option>`).join('')}</select></div>`).join('')}
    <div class="fld"><label for="s_life">繁殖牛の耐用年数（年）</label><input id="s_life" type="number" inputmode="decimal" value="${c.usefulLife??''}"></div>
    <div class="fld"><label for="s_daily">1頭1日コストを固定する（円・空欄なら牛舎ごとに自動計算）</label><input id="s_daily" type="number" inputmode="decimal" value="${c.dailyCost??''}"></div></div>
    <div class="row"><button class="btn pri" id="saveGoals">目標・勘定科目・設定を保存</button></div></section>
  ${hasSample?`<section class="sec"><div class="sec-h"><h2>サンプルデータ</h2></div><p class="sub" style="margin:0">今入っている記録の多くは、使い方を見るためのサンプルです。本番の入力を始める前に消してください（目標・設定は残ります）。</p><div class="row"><button class="btn dng" id="delSample">サンプルデータを全部消す</button></div></section>`:''}`};
V.goals.bind=()=>{
  const bindCatDel=()=>document.querySelectorAll('[data-catdel]').forEach(b=>b.onclick=()=>{const tr=document.querySelector(`[data-cat="${b.dataset.catdel}"]`);if(tr)tr.remove()});
  bindCatDel();
  $('#catAdd').onclick=()=>{$('#catRows').insertAdjacentHTML('beforeend',catRowHtml({name:'',cls:'固定費'}));bindCatDel();const rows=$('#catRows').querySelectorAll('input');rows[rows.length-1].focus()};
  $('#saveGoals').onclick=async()=>{const c=cfg();const g=id=>num(document.getElementById(id).value);
    const categories=[...document.querySelectorAll('[data-cat]')].map(tr=>{const id=tr.dataset.cat;return {name:document.getElementById('cn_'+id).value.trim(),cls:document.getElementById('cc_'+id).value}}).filter(x=>x.name);
    const dup=categories.map(x=>x.name).find((n,i,a)=>a.indexOf(n)!==i);if(dup){toast(`「${dup}」が2つあります。どちらかを消してください`);return}
    const split=s=>s.split(/[、,，\s]+/).map(x=>x.trim()).filter(Boolean);
    const farms=split($('#s_farms').value);
    const growing={};farms.forEach(f=>{const el=k=>document.getElementById(`g_${f}_${k}`);growing[f]=el('shipWeight')?{shipWeight:num(el('shipWeight').value),shipAge:num(el('shipAge').value),dg:num(el('dg').value),mortality:num(el('mortality').value)}:{...GDEF}});
    const owners=split($('#s_owners').value);
    const s={fyStart:Number($('#s_fy').value),farms:farms.length?farms:c.farms,barns:farms.length?farms:c.barns,office:$('#s_office').value.trim()||c.office,
      categories:categories.length?categories:catList(),owners:owners.length?owners:c.owners,addrBarn:Object.fromEntries([...document.querySelectorAll('[data-ab]')].filter(e=>e.value).map(e=>[e.dataset.ab,e.value])),usefulLife:num($('#s_life').value)||c.usefulLife,dailyCost:num($('#s_daily').value),
      targets:{conception:g('t_conception'),calvingRate:g('t_calvingRate'),cultured:g('t_cultured'),produced:g('t_produced'),freshET:g('t_freshET'),carcassWeight:g('t_carcassWeight'),semenMin:g('t_semenMin'),growing}};
    if(await save('settings','main',s))toast('保存しました')};
  const ds=$('#delSample');if(ds)ds.onclick=async()=>{if(!ds.dataset.sure){ds.dataset.sure=1;ds.textContent='本当に消す（元に戻せません）';return}
    ds.disabled=true;let n=0;for(const k of COLS)for(const r of S[k].filter(r=>r.sample)){if(await del(k,r.id))n++;if(n%20===0)ds.textContent=`消しています… ${n}件`}
    toast(`サンプルを${n}件消しました`)}};

/* ---------- render ---------- */
function bindCommon(){
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm(b.dataset.add));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=S[b.dataset.edit].find(x=>x.id===b.dataset.id);if(r)openForm(b.dataset.edit,r)});
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'));
  $('#mPick').value=M;
  if(!loaded){$('#view').innerHTML=dbState==='none'
    ?`<div class="empty">共有データに接続できませんでした。通信状態を確認して、ページを開き直してください。</div>`
    :`<div class="empty">データを読み込んでいます…</div>`;return}
  const hasSample=COLS.some(k=>S[k].some(r=>r.sample));
  const y=window.scrollY;
  $('#view').innerHTML=(hasSample?`<div class="banner"><b>サンプル表示中</b><span>いま入っている記録は使い方を見るためのサンプルです。本番を始めるときは「目標・設定」から消せます。</span></div>`:'')+V[tab]();
  bindCommon();V[tab].bind&&V[tab].bind();
  window.scrollTo(0,y);
}
let rT=null;function schedule(){clearTimeout(rT);rT=setTimeout(render,60)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;try{localStorage.setItem('usn-tab',tab)}catch(err){}window.scrollTo(0,0);render()});
$('#mPrev').onclick=()=>{M=monthAdd(M,-1);render()};
$('#mNext').onclick=()=>{M=monthAdd(M,1);render()};
$('#mPick').onchange=e=>{if(e.target.value){M=e.target.value;render()}};

/* ---------- boot ---------- */
render();
(async()=>{
  if(!window.claude||!claude.use){dbState='none';render();return}
  [sample,downloads]=await Promise.all([claude.use('sample').catch(()=>null),claude.use('downloads').catch(()=>null)]);
  db=await claude.use('db').catch(()=>null);
  if(!db){dbState='none';render();return}
  let pending=COLS.length+1;const done=()=>{if(--pending===0){loaded=true}schedule()};
  COLS.forEach(c=>{let first=true;db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));if(first){first=false;done()}else schedule()},
    err=>{if(first){first=false;done()}})});
  let f1st=true;db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?s.data():null;if(f1st){f1st=false;done()}else schedule()},()=>{if(f1st){f1st=false;done()}});
})();
</script>
</body></html>
