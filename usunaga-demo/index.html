h2{font-size:17px;margin:0;text-wrap:balance}

.sub{color:var(--muted);font-size:13px}

  if(f.t==='select') inner=`<select id="${id}" name="${f.k}">${f.opts.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}"${String(ov)===String(v)?' selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else if(f.t==='textarea') inner=`<textarea id="${id}" name="${f.k}" rows="3">${esc(v)}</textarea>`;
  else inner=`<input id="${id}" name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?`inputmode="decimal" step="${f.step||'any'}"`:''} value="${esc(v)}"${f.req?' required':''}>`;
  return `<div class="fld${f.full?' full':''}"><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${inner}</div>`}
function openForm(col,rec,extra){
  const def=FORMS[col];const fs=def.fields();const r=rec||{};
  openModal(`<h2>${esc(def.title)}${rec&&rec.id?'を直す':'を追加'}</h2>${extra&&extra.head||''}

  <div class="sheet-f">${rec&&rec.id?`<button class="btn dng dl" id="fDel">削除</button>`:''}<button class="btn" id="fCancel">やめる</button><button class="btn pri" id="fSave">保存</button></div>`);
  $('#fCancel').onclick=closeModal;
  if($('#fDel')) $('#fDel').onclick=async e=>{const b=e.currentTarget;if(b.dataset.sure){if(await del(col,rec.id)){closeModal();toast('削除しました')}}else{b.dataset.sure=1;b.textContent='本当に削除する'}};
  $('#fSave').onclick=async()=>{
    const out={...(rec||{})};delete out.id;
    for(const f of fs){const el=document.getElementById('f_'+f.k);let v=el.value.trim();

      out[f.k]=f.t==='number'?num(v):v}
    if(extra&&extra.merge) Object.assign(out,extra.merge);
    delete out.sample;
    $('#fSave').disabled=true;
    if(await save(col,rec&&rec.id,out)){closeModal();toast('保存しました')}else $('#fSave').disabled=false};
}

/* ---------- calculations ---------- */
function breedStats(m){
  const recs=S.ai.filter(r=>ym(r.date)===m);
  const judged=recs.filter(r=>r.result==='受胎'||r.result==='不受胎');
  const ok=judged.filter(r=>r.result==='受胎');
  const fy=S.ai.filter(r=>inFY(r.date,m)&&(r.result==='受胎'||r.result==='不受胎'));
  const by=meth=>{const j=judged.filter(r=>meth==='AI'?r.method==='AI':r.method!=='AI');return {n:j.length,rate:pct(j.filter(r=>r.result==='受胎').length,j.length)}};
  return {count:recs.length,judged:judged.length,pending:recs.length-judged.length,rate:pct(ok.length,judged.length),
    fyRate:pct(fy.filter(r=>r.result==='受胎').length,fy.length),fyN:fy.length,ai:by('AI'),et:by('ET')}}
function opuStats(m){
  const mo=S.opu.filter(r=>ym(r.date)===m), fy=S.opu.filter(r=>inFY(r.date,m));
  const s=a=>({collected:sum(a.map(r=>r.collected)),cultured:sum(a.map(r=>r.cultured)),produced:sum(a.map(r=>r.produced)),freshET:sum(a.map(r=>r.freshET)),frozen:sum(a.map(r=>r.frozen)),n:a.length});
  return {mo:s(mo),fy:s(fy)}}
function dueList(){
  return S.ai.filter(r=>r.result==='受胎').map(r=>{const due=addDays(r.date,GEST);
    const c=S.calving.find(c=>c.damId===r.cowId&&Math.abs(dayDiff(due,c.date))<=30);
    return {...r,due,calved:c||null}}).sort((a,b)=>a.due<b.due?-1:1)}
function calvingStats(m){
  const dl=dueList();const end=m===ym(TODAY)?TODAY:monthEnd(m);
  const dueFY=dl.filter(r=>inFY(r.due,m)&&r.due<=end);
  const done=dueFY.filter(r=>r.calved);
  const mo=S.calving.filter(c=>ym(c.date)===m);
  return {mo:mo.length,live:mo.filter(c=>c.status!=='死産').length,male:mo.filter(c=>c.sex==='雄').length,female:mo.filter(c=>c.sex==='雌').length,
    avgW:avg(mo.map(c=>num(c.weight))),rate:pct(done.length,dueFY.length),dueN:dueFY.length,doneN:done.length,
    next:dl.filter(r=>!r.calved&&r.due>=addDays(TODAY,-20)&&r.due<=addDays(TODAY,60))}}
function semenStats(m){
  return S.semen.map(s=>{const uses=S.ai.filter(r=>r.method==='AI'&&r.semenId===s.id);
    const j=uses.filter(r=>inFY(r.date,m)&&(r.result==='受胎'||r.result==='不受胎'));
    const stock=(num(s.received)||0)-uses.length;
    return {...s,used:uses.length,usedMo:uses.filter(r=>ym(r.date)===m).length,stock,low:stock<=(num(s.minStock)??cfg().targets.semenMin),
      rate:pct(j.filter(r=>r.result==='受胎').length,j.length),rateN:j.length}}).sort((a,b)=>a.stock-b.stock)}
function growStats(m,farm){
  const all=S.cattle.filter(c=>c.farm===farm&&c.kind!=='繁殖');
  const shipped=all.filter(c=>c.status==='出荷'&&ym(c.shipDate)===m);
  const fyS=fyStartM(m)+'-01', end=monthEnd(m);
  const atStart=all.filter(c=>c.introDate&&c.introDate<fyS&&!((c.status==='出荷'&&c.shipDate<fyS)||(c.status==='死亡'&&c.deathDate<fyS))).length;
  const intro=all.filter(c=>inFY(c.introDate,m)).length;
  const deaths=all.filter(c=>c.status==='死亡'&&inFY(c.deathDate,m)).length;
  const head=all.filter(c=>c.introDate&&c.introDate<=end&&!((c.status==='出荷'&&c.shipDate<=end)||(c.status==='死亡'&&c.deathDate<=end))).length;
  return {shipped:shipped.length,weight:avg(shipped.map(c=>num(c.shipWeight))),
    age:avg(shipped.filter(c=>c.birthDate).map(c=>dayDiff(c.birthDate,c.shipDate))),
    dg:avg(shipped.filter(c=>c.introWeight&&c.shipWeight&&c.introDate).map(c=>(c.shipWeight-c.introWeight)/Math.max(1,dayDiff(c.introDate,c.shipDate)))),
    deaths,deathsMo:all.filter(c=>c.status==='死亡'&&ym(c.deathDate)===m).length,base:atStart+intro,mortality:pct(deaths,atStart+intro),head,intro}}
function carcassStats(m){
  const row=a=>({n:a.length,w:avg(a.map(r=>num(r.weight))),hi:pct(a.filter(r=>/^[AB][45]$/.test(r.grade||'')).length,a.length),
    price:avg(a.map(r=>num(r.price))),sales:sum(a.map(r=>(num(r.weight)||0)*(num(r.price)||0)))});
  const mo=S.carcass.filter(r=>ym(r.date)===m), fy=S.carcass.filter(r=>inFY(r.date,m));
  return {mo:row(mo),fy:row(fy),barns:cfg().barns.map(b=>({barn:b,mo:row(mo.filter(r=>r.barn===b)),fy:row(fy.filter(r=>r.barn===b))}))}}
function stockStats(){
  const open=new Set(S.orders.filter(o=>o.status!=='入荷済').map(o=>o.itemId));
  const need=S.items.filter(i=>num(i.stock)!=null&&num(i.stock)<=num(i.reorderPoint));
  const last=S.items.map(i=>i.countedAt).filter(Boolean).sort().pop()||null;
  return {need,needNew:need.filter(i=>!open.has(i.id)),open,last,stale:!last||dayDiff(last.slice(0,10),TODAY)>7}}
function invStats(m){
  const mo=S.invoices.filter(r=>ym(r.date)===m);
  const cats={};mo.forEach(r=>{const c=r.category||'その他';cats[c]=(cats[c]||0)+(num(r.total)||0)});
  return {n:mo.length,total:sum(mo.map(r=>r.total)),unchecked:mo.filter(r=>r.checked!=='yes').length,cats}}

function buildReport(m){
  const T=cfg().targets, b=breedStats(m), o=opuStats(m), c=calvingStats(m), sm=semenStats(m), ca=carcassStats(m), st=stockStats(), iv=invStats(m);
  const pace=monthsIn(m)/12;
  const K=[];
  const add=(g,name,v,unit,t,dir,fmt,tl)=>K.push({g,name,v,unit,t,dir,fmt:fmt||f1,tl,state:judge(v,t,dir)});
  add('繁殖','受胎率（今月）',b.rate,'%',T.conception,'up');
  add('繁殖','受胎率（年度累計）',b.fyRate,'%',T.conception,'up');
  add('繁殖','培養卵数（年度累計）',o.fy.cultured,'個',T.cultured*pace,'up',f0,`年${f0(T.cultured)}・今月時点${f0(T.cultured*pace)}`);
  add('繁殖','生産個数（年度累計）',o.fy.produced,'個',T.produced*pace,'up',f0,`年${f0(T.produced)}・今月時点${f0(T.produced*pace)}`);
  add('繁殖','新鮮卵移植個数（年度累計）',o.fy.freshET,'個',T.freshET*pace,'up',f0,`年${f0(T.freshET)}・今月時点${f0(T.freshET*pace)}`);
  add('繁殖','分娩率（年度累計）',c.rate,'%',T.calvingRate,'up');
  cfg().farms.forEach(f=>{const g=growStats(m,f),t=T.growing[f]||{};
    add('育成・'+f,'出荷牛の平均体重',g.weight,'kg',t.shipWeight,'up');
    add('育成・'+f,'出荷牛の平均日齢',g.age,'日',t.shipAge,'down',f0);
    add('育成・'+f,'DG（1日の増体）',g.dg,'kg',t.dg,'up',f2);
    add('育成・'+f,'導入からの死亡率（年度）',g.mortality,'%',t.mortality,'down')});
  add('枝肉','平均枝肉重量（今月）',ca.mo.w,'kg',T.carcassWeight,'up');
  ca.barns.forEach(x=>{if(x.mo.n) add('枝肉',`${x.barn}の平均枝肉重量`,x.mo.w,'kg',T.carcassWeight,'up')});
  // checks
  const C=[];
  const stale=S.ai.filter(r=>r.result==='未判定'&&dayDiff(r.date,TODAY)>=40);
  C.push(stale.length?{s:'warn',t:`妊娠鑑定の結果が未入力：${stale.length}頭（授精から40日以上）`}:{s:'good',t:'妊娠鑑定の結果はすべて入っています'});
  C.push(st.stale?{s:'warn',t:`棚卸が1週間以上ありません（最終：${st.last?jpD(st.last.slice(0,10)):'未実施'}）`}:{s:'good',t:`棚卸は最新です（最終：${jpD(st.last.slice(0,10))}）`});
  C.push(st.needNew.length?{s:'bad',t:`発注が必要な品目：${st.needNew.map(i=>i.name).join('、')}`}:{s:'good',t:'発注が必要な品目はありません'});
  const lowS=sm.filter(s=>s.low);
  C.push(lowS.length?{s:'bad',t:`精液の在庫が少ない：${lowS.map(s=>`${s.bull} 残${s.stock}本`).join('、')}`}:{s:'good',t:'精液の在庫は足りています'});
  C.push(iv.unchecked?{s:'warn',t:`内容を確認していない請求書：${iv.unchecked}件`}:{s:'good',t:iv.n?'今月の請求書はすべて確認済みです':'今月の請求書はまだありません'});
  const noW=S.cattle.filter(x=>x.status==='出荷'&&ym(x.shipDate)===m&&!x.shipWeight);
  if(noW.length) C.push({s:'warn',t:`出荷体重が未入力：${noW.length}頭`});
  const soon=c.next.filter(r=>r.due>=TODAY&&r.due<=addDays(TODAY,14));
  if(soon.length) C.push({s:'warn',t:`2週間以内に分娩予定：${soon.map(r=>`${r.cowId}（${jpD(r.due)}）`).join('、')}`});
  return {m,K,C,b,o,c,sm,ca,st,iv}}

function reportText(R){
  const lines=[`【${jpM(R.m)} 月次報告】神戸うすなが牧場`,''];
  let g='';R.K.forEach(k=>{if(k.g!==g){g=k.g;lines.push(`■ ${g}`)}
    lines.push(`・${k.name}：${k.fmt(k.v)}${k.v==null?'':k.unit}（目標 ${k.tl||(k.t==null?'—':k.fmt(k.t)+k.unit)}）… ${{good:'達成',warn:'あと少し',bad:'未達',none:'データなし'}[k.state]}`)});
  lines.push('',`■ 経費（請求書）`,`・合計 ${yen(R.iv.total)}（${R.iv.n}件）`);
  Object.entries(R.iv.cats).forEach(([c,v])=>lines.push(`　${c} ${yen(v)}`));
  lines.push(`■ 枝肉売上（今月）${yen(R.ca.mo.sales)}（${R.ca.mo.n}頭）`);
  lines.push('','■ 確認事項');R.C.filter(c=>c.s!=='good').forEach(c=>lines.push('・'+c.t));
  const rep=S.reports.find(r=>r.id===R.m);if(rep&&rep.comment){lines.push('','■ 所見',rep.comment)}
  return lines.join('\n')}

async function photoRead(kind){
  const lim=await sample.limits().catch(()=>null);
  if(!lim||!lim.images){toast('この画面では写真の読み取りが使えません');return}

/* ---------- 牛の在庫・会計 ---------- */
let OWN='';
const exitOf=c=>c.status==='出荷'?c.shipDate:c.status==='死亡'?c.deathDate:null;
const aliveOn=(c,d)=>c.introDate&&c.introDate<=d&&!(exitOf(c)&&exitOf(c)<=d);
function daysIn(c,from,to){if(!c.introDate)return 0;const s=c.introDate>from?c.introDate:from;const ex=exitOf(c);let e=to;if(ex&&ex<=to)e=addDays(ex,-1);return e<s?0:dayDiff(s,e)+1}
const ownOK=(r,o)=>!o||r.owner===o;
function costPool(from,to,o){ // 期間の経費：その法人の経費＋共通経費を延べ飼養日数で按分
  const inv=S.invoices.filter(r=>r.date>=from&&r.date<=to);
  const hdAll=sum(S.cattle.map(c=>daysIn(c,from,to)));const hdO=o?sum(S.cattle.filter(c=>c.owner===o).map(c=>daysIn(c,from,to))):hdAll;
  const share=hdAll?hdO/hdAll:0;const cats={};
  inv.forEach(r=>{const w=!o?1:r.owner===o?1:!r.owner?share:0;if(!w)return;const k=r.category||'その他';cats[k]=(cats[k]||0)+(num(r.total)||0)*w});
  return {cats,total:sum(Object.values(cats)),hd:hdO}}
function depOf(c,asOf){const p=num(c.introPrice)||0;if(!p||!c.introDate)return {acc:0,book:0,mo:0};
  const life=(num(cfg().usefulLife)||6)*12;const [y1,m1]=c.introDate.split('-').map(Number),[y2,m2]=asOf.split('-').map(Number);
  const n=Math.max(0,Math.min(life,(y2-y1)*12+(m2-m1)+1));const per=p/life;const acc=Math.min(p-1,per*n);
  return {acc,book:p-acc,mo:n>0&&n<=life?per:0}}
function assetCalc(m,o){
  const ms=m+'-01',me=monthEnd(m),fs=fyStartM(m)+'-01';
  const mo=costPool(ms,me,o),fy=costPool(fs,me,o);
  const setD=num(cfg().dailyCost);
  const dMo=setD??(mo.hd?mo.total/mo.hd:null), dFy=setD??(fy.hd?fy.total/fy.hd:null);
  const herd=S.cattle.filter(c=>ownOK(c,o));
  const rows=['育成','肥育','繁殖'].map(k=>{const a=herd.filter(c=>(c.kind||'育成')===k);
    const start=a.filter(c=>c.introDate&&c.introDate<ms&&!(exitOf(c)&&exitOf(c)<ms)).length;
    const inn=a.filter(c=>ym(c.introDate)===m).length,ship=a.filter(c=>c.status==='出荷'&&ym(c.shipDate)===m).length,dead=a.filter(c=>c.status==='死亡'&&ym(c.deathDate)===m).length;
    return {k,start,inn,ship,dead,end:start+inn-ship-dead}});
  const alive=herd.filter(c=>aliveOn(c,me));
  const stock=alive.filter(c=>c.kind!=='繁殖').map(c=>{const d=dayDiff(c.introDate,me)+1;const p=num(c.introPrice)||0;return {c,d,p,cost:(dFy||0)*d,val:p+(dFy||0)*d}}).sort((a,b)=>b.val-a.val);
  const breed=alive.filter(c=>c.kind==='繁殖').map(c=>({c,...depOf(c,m)}));
  const byOwner=cfg().owners.map(ow=>{const al=S.cattle.filter(c=>c.owner===ow&&aliveOn(c,me));const f=costPool(fs,me,ow);const dd=setD??(f.hd?f.total/f.hd:0);
    return {ow,n:al.length,val:sum(al.filter(c=>c.kind!=='繁殖').map(c=>(num(c.introPrice)||0)+dd*(dayDiff(c.introDate,me)+1))),book:sum(al.filter(c=>c.kind==='繁殖').map(c=>depOf(c,m).book))}});
  // 損益（今月・年度累計）
  const pl=(from,to,pool)=>{const car=S.carcass.filter(r=>ownOK(r,o)&&r.date>=from&&r.date<=to);const sh=herd.filter(c=>c.status==='出荷'&&c.shipDate>=from&&c.shipDate<=to);
    const salesC=sum(car.map(r=>(num(r.weight)||0)*(num(r.price)||0))),salesS=sum(sh.map(c=>num(c.shipPrice)||0));
    let dep=0;const [fy1,fm1]=from.split('-').map(Number),[ty,tm]=to.split('-').map(Number);let k=`${fy1}-${pad(fm1)}`;const last=`${ty}-${pad(tm)}`;
    while(k<=last){dep+=sum(herd.filter(c=>c.kind==='繁殖'&&c.introDate&&ym(c.introDate)<=k&&!(exitOf(c)&&ym(exitOf(c))<k)).map(c=>depOf(c,k).mo));k=monthAdd(k,1)}
    const exp=pool.total+dep;return {salesC,salesS,sales:salesC+salesS,cats:pool.cats,dep,exp,profit:salesC+salesS-exp}};
  return {rows,alive,stock,breed,byOwner,mo,fy,dMo,dFy,setD,plMo:pl(ms,me,mo),plFy:pl(fs,me,fy),
    stockVal:sum(stock.map(x=>x.val)),bookVal:sum(breed.map(x=>x.book))}}
const CAT_ORDER=['飼料費','診療費','薬品費','繁殖費','資材費','燃料費','修繕費','その他'];
function finText(A,m,o){const L=[`【${jpM(m)} 牛の在庫・会計（試算）】${o||'全体'}`,'','■ 損益計算書（今月／年度累計）'];
  const r=(n,a,b)=>L.push(`${n}：${yen(a)}／${yen(b)}`);
  r('売上高',A.plMo.sales,A.plFy.sales);r('　枝肉売上',A.plMo.salesC,A.plFy.salesC);r('　出荷販売額',A.plMo.salesS,A.plFy.salesS);
  CAT_ORDER.forEach(c=>{if(A.plMo.cats[c]||A.plFy.cats[c])r('　'+c,A.plMo.cats[c]||0,A.plFy.cats[c]||0)});
  r('　減価償却費（繁殖牛）',A.plMo.dep,A.plFy.dep);r('費用合計',A.plMo.exp,A.plFy.exp);r('差引損益',A.plMo.profit,A.plFy.profit);
  L.push('',`■ 貸借対照表（牛の部分・${jpD(monthEnd(m))}時点）`,`棚卸資産（育成・肥育牛 ${A.stock.length}頭）：${yen(A.stockVal)}`,`固定資産（繁殖牛 ${A.breed.length}頭・簿価）：${yen(A.bookVal)}`,`1日あたりコスト：${A.dFy==null?'—':f0(A.dFy)+'円'}`);
  return L.join('\n')}

  <h1 class="pg">目標・設定</h1>
  <section class="sec"><div class="sec-h"><h2>繁殖・枝肉の目標</h2><span class="sub">年間の数は、月次報告で「今月時点の目安」に割り戻して比べます</span></div>
    <div class="form">${inp('t_conception','受胎率（%）',T.conception)}${inp('t_calvingRate','分娩率（%）',T.calvingRate)}${inp('t_cultured','培養卵数（年間・個）',T.cultured)}${inp('t_produced','生産個数（年間・個）',T.produced)}${inp('t_freshET','新鮮卵移植個数（年間・個）',T.freshET)}${inp('t_carcassWeight','平均枝肉重量（kg）',T.carcassWeight)}${inp('t_semenMin','精液の発注点（本・標準）',T.semenMin)}</div></section>
  <section class="sec"><div class="sec-h"><h2>育成の目標（農場ごと）</h2></div>
    ${c.farms.map(f=>{const t=T.growing[f]||{};return `<div class="kg-h">${esc(f)}農場</div><div class="form">${inp(`g_${f}_shipWeight`,'出荷時の平均体重（kg）',t.shipWeight)}${inp(`g_${f}_shipAge`,'出荷時の平均日齢（日・以下）',t.shipAge)}${inp(`g_${f}_dg`,'DG（kg/日）',t.dg)}${inp(`g_${f}_mortality`,'死亡率（%・以下）',t.mortality)}</div>`}).join('')}</section>
  <section class="sec"><div class="sec-h"><h2>基本の設定</h2></div>
    <div class="form"><div class="fld"><label for="s_fy">年度の始まりの月</label><select id="s_fy">${Array.from({length:12},(_,i)=>`<option value="${i+1}"${c.fyStart===i+1?' selected':''}>${i+1}月</option>`).join('')}</select></div>
    <div class="fld"><label for="s_farms">育成の農場（読点で区切る）</label><input id="s_farms" value="${esc(c.farms.join('、'))}"></div>
    <div class="fld"><label for="s_barns">牛舎（読点で区切る）</label><input id="s_barns" value="${esc(c.barns.join('、'))}"></div>
    <div class="fld"><label for="s_office">証明書に載せる事業所名</label><input id="s_office" value="${esc(c.office)}"></div>
    <div class="fld"><label for="s_owners">牛の所有者（法人・個人、読点で区切る）</label><input id="s_owners" value="${esc(c.owners.join('、'))}"></div>
    <div class="fld"><label for="s_life">繁殖牛の耐用年数（年）</label><input id="s_life" type="number" inputmode="decimal" value="${c.usefulLife??''}"></div>
    <div class="fld"><label for="s_daily">1日あたりコスト（円・空欄なら経費から自動計算）</label><input id="s_daily" type="number" inputmode="decimal" value="${c.dailyCost??''}"></div></div>
    <div class="row"><button class="btn pri" id="saveGoals">目標と設定を保存</button></div></section>
  ${false?`<section class="sec"><div class="sec-h"><h2>サンプルデータ</h2></div><p class="sub" style="margin:0">今入っている記録の多くは、使い方を見るためのサンプルです。本番の入力を始める前に消してください（目標・設定は残ります）。</p><div class="row"><button class="btn dng" id="delSample">サンプルデータを全部消す</button></div></section>`:''}`};
V.goals.bind=()=>{
  $('#saveGoals').onclick=async()=>{const c=cfg();const g=id=>num(document.getElementById(id).value);
    const split=s=>s.split(/[、,，\s]+/).map(x=>x.trim()).filter(Boolean);
    const farms=split($('#s_farms').value),barns=split($('#s_barns').value);
    const growing={};farms.forEach(f=>{const el=k=>document.getElementById(`g_${f}_${k}`);growing[f]=el('shipWeight')?{shipWeight:num(el('shipWeight').value),shipAge:num(el('shipAge').value),dg:num(el('dg').value),mortality:num(el('mortality').value)}:{...DEF.targets.growing['平野']}});
    const owners=split($('#s_owners').value);
    const s={fyStart:Number($('#s_fy').value),farms:farms.length?farms:c.farms,barns:barns.length?barns:c.barns,office:$('#s_office').value.trim()||c.office,
      owners:owners.length?owners:c.owners,usefulLife:num($('#s_life').value)||c.usefulLife,dailyCost:num($('#s_daily').value),
      targets:{conception:g('t_conception'),calvingRate:g('t_calvingRate'),cultured:g('t_cultured'),produced:g('t_produced'),freshET:g('t_freshET'),carcassWeight:g('t_carcassWeight'),semenMin:g('t_semenMin'),growing}};
    if(await save('settings','main',s))toast('保存しました')};
  const ds=$('#delSample');if(ds)ds.onclick=async()=>{if(!ds.dataset.sure){ds.dataset.sure=1;ds.textContent='本当に消す（元に戻せません）';return}
    ds.disabled=true;let n=0;for(const k of COLS)for(const r of S[k].filter(r=>r.sample)){if(await del(k,r.id))n++;if(n%20===0)ds.textContent=`消しています… ${n}件`}
    toast(`サンプルを${n}件消しました`)}};

/* ---------- render ---------- */
function bindCommon(){
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm(b.dataset.add));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=S[b.dataset.edit].find(x=>x.id===b.dataset.id);if(r)openForm(b.dataset.edit,r)});
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'));
  $('#mPick').value=M;
  if(!loaded){$('#view').innerHTML=dbState==='none'
    ?`<div class="empty">共有データに接続できませんでした。claude.ai でこのページを開き直してください。</div>`
    :`<div class="empty">データを読み込んでいます…</div>`;return}
  const hasSample=COLS.some(k=>S[k].some(r=>r.sample));
  const y=window.scrollY;
  $('#view').innerHTML=`<div class="banner"><b>デモ版</b><span>見ていただくためのサンプルです。入力や変更は画面を閉じると元に戻ります。請求書・分娩記録の写真のAI読み取りと、AIの所見は本番版で使えます。</span></div>`+V[tab]();
  bindCommon();V[tab].bind&&V[tab].bind();
  window.scrollTo(0,y);
}
let rT=null;function schedule(){clearTimeout(rT);rT=setTimeout(render,60)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;try{localStorage.setItem('usn-tab',tab)}catch(err){}window.scrollTo(0,0);render()});
$('#mPrev').onclick=()=>{M=monthAdd(M,-1);render()};
$('#mNext').onclick=()=>{M=monthAdd(M,1);render()};
$('#mPick').onchange=e=>{if(e.target.value){M=e.target.value;render()}};

/* ---------- boot ---------- */
render();
(async()=>{
  if(!window.claude||!claude.use){dbState='none';render();return}
  [sample,downloads]=await Promise.all([claude.use('sample').catch(()=>null),claude.use('downloads').catch(()=>null)]);
  db=await claude.use('db').catch(()=>null);
  if(!db){dbState='none';render();return}
  let pending=COLS.length+1;const done=()=>{if(--pending===0){loaded=true}schedule()};
  COLS.forEach(c=>{let first=true;db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));if(first){first=false;done()}else schedule()},
    err=>{if(first){first=false;done()}})});
  let f1st=true;db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?s.data():null;if(f1st){f1st=false;done()}else schedule()},()=>{if(f1st){f1st=false;done()}});
})();
</script>
</body></html>
