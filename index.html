<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>NATURE KOBE ご注文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1d4a38;--g2:#2b6650;--gl:#e7efe9;--gold:#a8843a;--goldl:#f5eedf;--bg:#f5f3ee;--card:#fff;--ink:#1d2320;--mut:#6a716c;--line:#e2ddd2;--red:#b23b2c;--redl:#fbecea;--amb:#9a6a12;--ambl:#fdf3dd;--blue:#2a5b86;--bluel:#e8f0f8;--ok:#2d7a4c;--okl:#e6f3eb}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--g2)}
.serif{font-family:'Noto Serif JP',serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.wide{max-width:1100px}
/* header */
.brand{background:var(--g);color:#fff;padding:18px 0 16px;text-align:center}
.brand .logo{font-family:'Noto Serif JP',serif;letter-spacing:.28em;font-size:20px;font-weight:700}
.brand .logo span{color:#d9bd7c}
body.net{--g:#1b2d5c;--g2:#2a3f7a;--gl:#e6ebf5;--gold:#4a5f94;--goldl:#e9edf6;--blue:#1b2d5c;--bluel:#e6ebf5}
body.net .netbar{background:#0f1c3d;color:#fff;text-align:center;font-weight:700;padding:8px 10px;letter-spacing:.08em;font-size:14px}
body.net .brand{background:#1b2d5c}
body.net .brand .logo span{color:#c9d6f2}
body.net .btn.pri{background:#1b2d5c;border-color:#1b2d5c}
body.net .wrap h1{color:#1b2d5c}
.brand .sub{font-size:12px;opacity:.8;letter-spacing:.1em;margin-top:2px}
.topbar{background:var(--g);color:#fff;position:sticky;top:0;z-index:20}
.topbar .tin{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1100px;margin:0 auto}
.topbar .logo{font-family:'Noto Serif JP',serif;letter-spacing:.2em;font-weight:700;font-size:15px;white-space:nowrap}
.topbar .logo span{color:#d9bd7c}
.topbar .ttl{font-size:13px;opacity:.85}
.topbar .sp{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px;max-width:1100px;margin:0 auto;scrollbar-width:none}
.tabs button{background:none;border:0;color:#cfe0d6;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
.tabs button.on{color:#fff;border-bottom-color:#d9bd7c;font-weight:700}
/* card etc */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
h1{font-size:20px;margin:18px 0 4px}
h2{font-size:17px;margin:20px 0 8px}
h3{font-size:15px;margin:0 0 8px;color:var(--g)}
.mut{color:var(--mut)}
.sm{font-size:13px}
.xs{font-size:12px}
.b{font-weight:700}
.row{display:flex;gap:8px;align-items:center}
.row.wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{text-align:right}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;min-height:44px;font-weight:500;font-size:15px}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--red);border-color:#e7c2bc}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:transparent;color:var(--g2)}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#eee;color:#444;white-space:nowrap;line-height:1.7}
.c-受付{background:var(--bluel);color:var(--blue)}
.c-発注済{background:var(--ambl);color:var(--amb)}
.c-発送済{background:var(--okl);color:var(--ok)}
.c-キャンセル{background:#eee;color:#888;text-decoration:line-through}
.c-paid{background:var(--okl);color:var(--ok)}
.c-unpaid{background:var(--redl);color:var(--red)}
.c-warn{background:var(--ambl);color:var(--amb);font-weight:700}
.c-gray{background:#f0eee9;color:#6a716c}
label.f{display:block;margin:12px 0 4px;font-size:14px;font-weight:500}
label.f .req{color:#fff;background:var(--red);font-size:11px;padding:0 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
label.f .opt{color:var(--mut);font-size:12px;margin-left:6px;font-weight:400}
.in,select.in,textarea.in{width:100%;border:1px solid #cfc9bc;border-radius:10px;padding:10px 12px;background:#fff;min-height:46px;font-size:16px}
textarea.in{min-height:80px;resize:vertical}
.in:focus{outline:2px solid var(--g2);outline-offset:0;border-color:var(--g2)}
.in.err{border-color:var(--red);background:#fff8f7}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:120px;border:1.5px solid #cfc9bc;border-radius:10px;padding:11px 12px;display:flex;gap:8px;align-items:center;background:#fff;cursor:pointer;min-height:48px}
.seg label.on{border-color:var(--g);background:var(--gl);font-weight:700}
.seg input{accent-color:var(--g);width:18px;height:18px}
.tog{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--g)}
.hint{font-size:13px;color:var(--mut);margin:4px 0 0}
.errbox{background:var(--redl);color:var(--red);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.warnbox{background:var(--ambl);color:#6d4a07;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.okbox{background:var(--okl);color:#1f5a37;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}
/* customer */
.steps{display:flex;gap:6px;margin:14px 0 4px}
.steps div{flex:1;text-align:center;font-size:12px;color:var(--mut);padding-bottom:6px;border-bottom:3px solid var(--line)}
.steps div.on{color:var(--g);border-color:var(--g);font-weight:700}
.steps div.done{color:var(--g2);border-color:#9fbfae}
.cat{margin:18px 0}
.cat>h3{font-family:'Noto Serif JP',serif;font-size:16px;border-left:4px solid var(--gold);padding-left:8px;margin-bottom:6px}
.prod{background:#fff;border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.prod.has{border-color:#9fbfae;box-shadow:0 0 0 1px #9fbfae}
.prow{display:flex;align-items:center;gap:10px;padding:12px 14px}
.prow .nm{font-weight:700}
.pimg{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;cursor:zoom-in;background:#eee}
.pview{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.pview img{max-width:100%;max-height:85vh;border-radius:10px}
.pview .cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#fff;font-size:14px}
.prow .pr{font-size:14px;color:var(--mut)}
.prow .pr b{color:var(--ink);font-weight:500}
.var{font-size:11px;color:var(--amb);background:var(--ambl);padding:1px 6px;border-radius:4px;margin-left:4px;white-space:nowrap}
.line{display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px dashed var(--line);background:#fbfaf6;flex-wrap:wrap}
.line select,.line input{border:1px solid #cfc9bc;border-radius:8px;padding:6px 8px;min-height:40px;background:#fff;font-size:16px}
.line input.g{width:88px}
.stepper{display:inline-flex;align-items:center;border:1px solid #cfc9bc;border-radius:8px;overflow:hidden;background:#fff}
.stepper button{border:0;background:#f3f1ec;width:38px;height:40px;font-size:20px;line-height:1}
.stepper span{min-width:36px;text-align:center;font-weight:700}
.line .amt{margin-left:auto;font-weight:700;min-width:80px;text-align:right}
.line .del{border:0;background:none;color:var(--mut);font-size:13px;padding:6px}
.addmore{display:block;width:100%;border:0;border-top:1px dashed var(--line);background:#fbfaf6;color:var(--g2);padding:8px;font-size:14px}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:10;margin-top:20px}
.bar .in2{display:flex;align-items:center;gap:12px}
.bar .tot{font-size:22px;font-weight:700}
.bar .tot small{font-size:12px;font-weight:400;color:var(--mut)}
.summary td{padding:5px 0;vertical-align:top}
.summary{width:100%;border-collapse:collapse;font-size:15px}
.summary tr.t td{border-top:1px solid var(--line);padding-top:8px}
.summary tr.g td{font-size:18px;font-weight:700}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:15px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;word-break:break-all}
/* admin */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .l{font-size:12px;color:var(--mut)}
.stat .v{font-size:19px;font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.filters select{max-width:100%;text-overflow:ellipsis}
.filters select,.filters input{border:1px solid #cfc9bc;border-radius:10px;padding:8px 10px;min-height:42px;background:#fff;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;margin:10px 0 40px}
.ocard{min-width:0;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:block}
.ocard:hover{border-color:#9fbfae}
.ocard .top{display:flex;align-items:baseline;gap:8px}
.ocard .nm{font-weight:700;font-size:16px}
.ocard .tt{margin-left:auto;font-weight:700;font-size:16px}
.ocard .meta{font-size:12px;color:var(--mut);margin:2px 0 6px}
.ocard .chipsr{display:flex;gap:4px;flex-wrap:wrap}
.ocard .items{font-size:12px;color:var(--mut);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocard.cancel{opacity:.55}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(20,28,24,.45);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(760px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column}
.sheet .hd{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .hd .t{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .bd{padding:4px 16px 24px;flex:1}
.sheet .ft{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap}
.itm{border-top:1px solid var(--line);padding:10px 0}
.itm select,.itm input{border:1px solid #cfc9bc;border-radius:8px;padding:6px 8px;min-height:40px;background:#fff;font-size:15px;min-width:0}
.itm .r1{display:flex;gap:6px}.itm .r1 select{flex:1}
.itm .r2{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.itm .r2 input{width:80px}.itm .r2 .amt{margin-left:auto;font-weight:700}
.itm .lb{font-size:12px;color:var(--mut)}
.it-table{width:100%;border-collapse:collapse;font-size:14px}
.it-table th{font-size:12px;color:var(--mut);font-weight:500;text-align:left;padding:4px}
.it-table td{padding:4px;vertical-align:middle;border-top:1px solid var(--line)}
.it-table input,.it-table select{width:100%;border:1px solid #cfc9bc;border-radius:8px;padding:6px;min-height:38px;background:#fff;font-size:15px}
.it-table .w-g{width:78px}.it-table .w-c{width:58px}.it-table .w-p{width:92px}.it-table .w-a{width:88px;text-align:right;font-weight:700}
.x{border:0;background:none;color:var(--mut);font-size:18px;padding:4px 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.agg{width:100%;border-collapse:collapse;font-size:14px}
.agg th,.agg td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.agg th{font-size:12px;color:var(--mut);font-weight:500}
.agg td.n{text-align:right;font-weight:700;white-space:nowrap}
.plist .pi{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.plist .pi input{width:22px;height:22px;accent-color:var(--g);margin-top:2px}
.store{font-weight:700;padding:2px 10px;border-radius:6px;font-size:14px}
.store.冷凍{background:#e3eefa;color:#1f4f82}
.store.冷蔵{background:#e7f5ec;color:#246b41}
.store.none{background:var(--redl);color:var(--red)}
.qr{display:flex;justify-content:center;padding:10px;background:#fff}
.urlbox{font-size:13px;background:#f3f1ec;border-radius:8px;padding:8px 10px;word-break:break-all;margin:6px 0}
.ptable input{width:100%;border:1px solid #cfc9bc;border-radius:8px;padding:6px;min-height:38px;font-size:15px}
.ptable td{padding:4px}
/* toast */
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2320;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:.95}
#toast.err{background:var(--red)}
.loading{padding:60px 0;text-align:center;color:var(--mut)}
.demo{background:#6d4a07;color:#fff;font-size:12px;text-align:center;padding:4px}
/* print */
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block}
  body{background:#fff}
  @page{size:A4;margin:14mm}
}
.rc{font-family:'Noto Serif JP',serif;color:#111;max-width:180mm;margin:0 auto;page-break-after:always}
.rc h1{text-align:center;font-size:30px;letter-spacing:.6em;margin:0 0 18px;padding-left:.6em}
.rc .no{display:flex;justify-content:space-between;font-size:13px;margin-bottom:22px}
.rc .to{font-size:22px;border-bottom:1px solid #111;padding-bottom:4px;display:inline-block;min-width:60%;margin-bottom:24px}
.rc .amt{font-size:30px;text-align:center;background:#f4f1ea;border:1px solid #111;padding:14px;margin:0 0 10px;letter-spacing:.05em}
.rc .tadashi{font-size:15px;margin:14px 0 4px}
.rc .bd2{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;gap:20px}
.rc table{border-collapse:collapse;font-size:13px}
.rc table td{border:1px solid #111;padding:5px 10px}
.rc .iss{font-size:14px;text-align:right;line-height:1.7}
.rc .iss b{font-size:17px}
.pk{font-family:'Noto Sans JP',sans-serif;font-size:12px;color:#111}
.pk h1{font-size:18px;margin:0 0 8px}
.pk table{width:100%;border-collapse:collapse;margin-bottom:14px}
.pk th,.pk td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .olist{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .kv{grid-template-columns:92px 1fr}
  .hide-sm{display:none}
  .it-table .w-p{width:76px}
}
</style>
</head>

<script>
/* ===== 設定：GASのウェブアプリURL ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyb0FqyJm6nmEuCcrbT5idhrX2Uq6jwxrMnl9gjKZ1Bqe_1L0Zy37wxHkO7-ZushUoW/exec';

/* ===== 共通 ===== */
const DEMO = !!window.__DEMO;
const $ = (s, r = document) => r.querySelector(s);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = n => '¥' + Math.round(+n || 0).toLocaleString('ja-JP');
const gl = g => { g = +g || 0; return g >= 1000 ? (+(g / 1000).toFixed(2)) + 'kg' : g + 'g'; };
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const jdate = s => { if (!s) return ''; const m = String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? `${+m[1]}年${+m[2]}月${+m[3]}日` : s; };
const mdw = s => { const m = String(s || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if (!m) return s || ''; const d = new Date(+m[1], +m[2] - 1, +m[3]); return `${+m[2]}月${+m[3]}日（${'日月火水木金土'[d.getDay()]}）`; };
const _mem = {};
const ls = { get(k) { try { const v = localStorage.getItem(k); if (v != null) return v; } catch (e) {} return k in _mem ? _mem[k] : null; }, set(k, v) { _mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { delete _mem[k]; try { localStorage.removeItem(k); } catch (e) {} } };
const baseUrl = () => location.origin + location.pathname;
let toastT;
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', err ? 4200 : 2200); }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast((label || '') + 'コピーしました'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast((label || '') + 'コピーしました'); } catch (e2) { toast('コピーできませんでした', true); } ta.remove(); }
}
async function api(action, data) {
  data = Object.assign({ action }, data || {});
  if (DEMO) return await demoApi(action, data);
  if (!API_URL) throw new Error('API_URLが設定されていません');
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'エラーが発生しました');
  return j;
}
/* 金額計算（GASと同じ） */
const markupPrice = (base, m) => { m = +m || 0; return m ? Math.ceil(base * (1 + m / 100) / 100) * 100 : base; };
const baseOf = it => it.basePrice !== '' && it.basePrice != null ? +it.basePrice : (it.unitPrice !== '' && it.unitPrice != null ? +it.unitPrice : 0);
function computeOrder(o, S, prods, trust) {
  const pm = {}; (prods || []).forEach(p => pm[p.id] = p);
  const m = +o.markup || 0;
  let sub = 0, back = 0;
  o.items = (o.items || []).filter(it => +it.g > 0 && +it.count > 0 && (trust || pm[it.pid])).map(it => {
    const p = pm[it.pid];
    const base = trust && it.basePrice !== '' && it.basePrice != null ? +it.basePrice
      : trust && it.unitPrice !== '' && it.unitPrice != null ? +it.unitPrice : (p ? p.price : 0);
    const unit = markupPrice(base, m);
    const amount = Math.round(unit * (+it.g) * (+it.count) / 1000);
    sub += amount;
    back += amount - Math.round(base * (+it.g) * (+it.count) / 1000);
    return { pid: String(it.pid || ''), name: p ? (p.cat + ' ' + p.name) : String(it.name || ''), basePrice: base, unitPrice: unit, variable: p ? p.variable : !!it.variable, g: +it.g, count: +it.count, amount, note: String(it.note || '') };
  });
  o.extras = (trust ? (o.extras || []) : []).filter(x => x && String(x.name || '').trim()).map(x => ({ name: String(x.name), amount: +x.amount || 0, note: String(x.note || '') }));
  o.extras.forEach(x => sub += x.amount);
  o.subtotal = sub;
  o.markup = m;
  o.back = back;
  o.shipping = trust && o.shipping !== '' && o.shipping != null ? +o.shipping : (+S.shippingFee || 0);
  o.taxRate = trust && o.taxRate !== '' && o.taxRate != null ? +o.taxRate : (+S.taxRate || 10);

  const legacy = trust && (o.shipTaxRate === '' || o.shipTaxRate == null) && o.createdAt && String(o.createdAt) < '2026-10-18 09';

  o.taxFood = Math.floor(sub * o.taxRate / 100);
  o.taxShip = Math.floor(o.shipping * o.shipTaxRate / 100);

  o.total = sub + o.shipping + o.tax;

}

function parseExtras(s){
  return String(s || '').split(/[,，]/).map(t => t.trim()).filter(Boolean).map(t => {
    const [n, p, c] = t.split(':').map(x => (x || '').trim());

}

// 注文ひとつの原価（円）と、原価が不明な商品の有無
function orderCostOf(o){
  let cost = 0, unknown = false;
  (o.items || []).forEach(i => {
    // 販売会ごとの追加商品は、注文に原価（cost）が入っている。それ以外は商品の原価表を使う
    const p = i.cost != null && i.cost !== '' ? +i.cost : COST_PER_KG[i.name];
    if (p == null || p === '' || isNaN(p)) { unknown = true; return; }
    cost += (+i.g || 0) * (+i.count || 0) / 1000 * p;
  });
  return { cost: Math.round(cost), unknown };
}

const STATUSES = ['受付', '発注済', '発送済', 'キャンセル'];
const CARRIERS = ['ヤマト運輸', '佐川急便', '日本郵便', 'その他'];
function trackUrl(carrier, no) {
  const n = String(no || '').replace(/[^0-9A-Za-z]/g, '');
  if (!n) return '';
  if (carrier === 'ヤマト運輸') return 'https://jizen.kuronekoyamato.co.jp/jizen/servlet/crjz.b.NQ0010?id=' + n;
  if (carrier === '佐川急便') return 'https://k2k.sagawa-exp.co.jp/p/web/okurijosearch.do?okurijoNo=' + n;
  if (carrier === '日本郵便') return 'https://trackings.post.japanpost.jp/services/srv/search/direct?reqCodeNo1=' + n + '&locale=ja';
  return '';
}
function aggregate(orders) {
  const m = {};
  orders.forEach(o => (o.items || []).forEach(i => {
    const k = i.name; m[k] = m[k] || { name: k, total: 0, packs: {} };
    m[k].total += i.g * i.count; m[k].packs[i.g] = (m[k].packs[i.g] || 0) + i.count;
  }));
  return Object.values(m).map(x => Object.assign(x, { packStr: Object.keys(x.packs).sort((a, b) => a - b).map(g => `${gl(g)}×${x.packs[g]}`).join('、') }));
}
function aggTable(orders) {
  const a = aggregate(orders);
  const ex = []; orders.forEach(o => (o.extras || []).forEach(x => ex.push(x.name + '（' + o.name + '様）')));
  return `<table class="agg"><tr><th>商品</th><th>パック内訳</th><th class="right">合計</th></tr>${a.map(x => `<tr><td>${h(x.name)}</td><td>${h(x.packStr)}</td><td class="n">${gl(x.total)}</td></tr>`).join('')}</table>${ex.length ? `<p class="sm">その他：${h(ex.join('／'))}</p>` : ''}`;
}
function shipName(o) { return o.shipTo && o.shipTo.on ? (o.shipTo.name || '（お名前未記入）') : o.name; }
function shipAddr(o) { return o.shipTo && o.shipTo.on ? `〒${o.shipTo.zip || ''} ${o.shipTo.address || ''}` : `〒${o.zip || '（未記入）'} ${o.address || ''}`; }
function shipTel(o) { return o.shipTo && o.shipTo.on ? (o.shipTo.phone || o.phone) : o.phone; }

const Admin = {

      `<div class="tabs">${tabs.map(t => `<button class="${A.tab === t[0] ? 'on' : ''}" onclick="Admin.tab('${t[0]}')">${t[1]}</button>`).join('')}</div>`) +
      `<div class="wrap wide">${body}</div>`;
  },
  evName(id) { const e = this.A.events.find(x => x.id === id); return e ? e.name : id; },
  evSelect(val, onchange, withAll) {
    return `<select onchange="${onchange}">${withAll ? `<option value="all" ${val === 'all' ? 'selected' : ''}>すべてのイベント</option>` : ''}${this.A.events.map(e => `<option value="${h(e.id)}" ${val === e.id ? 'selected' : ''}>${h(e.date)} ${h(e.name)}</option>`).join('')}</select>`;
  },
  filtered() {
    const A = this.A, q = A.q.trim();
    return A.orders.filter(o => (A.ev === 'all' || o.eventId === A.ev)).filter(o => {
      if (A.st === 'all') return o.status !== 'キャンセル';
      if (A.st === '未入金') return !o.paid && o.status !== 'キャンセル';
      if (A.st === '要確認') return !!(o.checks || '').trim() && o.status !== 'キャンセル';
      if (A.st === 'メール未') return o.status !== 'キャンセル' && (!o.email || !(o.mail && o.mail.confirm));
      return o.status === A.st;
    }).filter(o => !q || [o.id, o.name, o.phone, o.email, o.address, o.memo].join(' ').includes(q))
      .sort((a, b) => (a.id < b.id ? -1 : 1));

    const sum = k => base.reduce((a, o) => a + (+o[k] || 0), 0);

    const costTotal = costs.reduce((a, c) => a + c.cost, 0);
    const costUnknownCount = costs.filter(c => c.unknown).length;

    const gross = sum('subtotal') - sum('back') - costTotal;
    const cnt = st => st === 'all' ? base.length : st === '未入金' ? base.filter(o => !o.paid).length : st === '要確認' ? base.filter(o => (o.checks || '').trim()).length : st === 'メール未' ? base.filter(o => !o.email || !(o.mail && o.mail.confirm)).length : A.orders.filter(o => (A.ev === 'all' || o.eventId === A.ev) && o.status === st).length;
    const chips = ['all', '受付', '発注済', '発送済', '未入金', '要確認', 'メール未', 'キャンセル'];
    return `<div class="filters">${this.evSelect(A.ev, "Admin.A.ev=this.value;Admin.render()", true)}<input type="search" placeholder="名前・電話・番号で検索" value="${h(A.q)}" oninput="Admin.A.q=this.value;Admin.refreshList()" style="flex:1;min-width:180px"></div>

      <div class="chips">${chips.map(c => `<button class="${A.st === c ? 'on' : ''}" onclick="Admin.A.st='${c}';Admin.render()">${c === 'all' ? 'すべて' : c === 'メール未' ? '確認メール未送信' : c} ${cnt(c)}</button>`).join('')}</div>
      <div class="olist" id="olist">${this.cards(list)}</div>`;

  cards(list) {

    if (this._adding) return; this._adding = true;
    const b = $('#nev-btn'); if (b) { b.disabled = true; b.textContent = '作成中…'; }
    try { await this.saveEvent({ name, date: $('#nev-date').value, venue: $('#nev-venue').value.trim(), partner: $('#nev-partner').value.trim(), markup: Math.max(0, +$('#nev-markup').value || 0), perks: $('#nev-perks').value.trim(), extras: parseExtras($('#nev-extras').value), open: true }); } finally { this._adding = false; }
  },
  confirmBox(title, msg, okLabel, onOk) {
    this._onOk = onOk;
    openSheet(`<div class="hd"><button class="x" onclick="closeSheet()">✕</button><div class="t">${h(title)}</div></div><div class="bd"><div class="card"><p style="margin:0;white-space:pre-wrap">${h(msg)}</p><p class="hint">削除すると元に戻せません。</p></div></div>
      <div class="ft"><button class="btn danger" style="flex:1" id="okbtn" onclick="Admin._doOk()">${h(okLabel)}</button><button class="btn" onclick="closeSheet()">やめる</button></div>`);
  },
  async _doOk() { const b = $('#okbtn'); if (b) { b.disabled = true; b.textContent = '削除中…'; } try { await this._onOk(); } catch (e) { toast(e.message, true); if (b) { b.disabled = false; b.textContent = '削除する'; } } },
  askDelEvent(id) {
    const e = this.A.events.find(x => x.id === id), n = this.A.orders.filter(o => o.eventId === id).length;
    this.confirmBox('イベントを削除', `「${e.name}」（${e.date}）を削除します。` + (n ? `\nこのイベントの注文 ${n}件 も一緒に削除されます。` : '\nこのイベントに注文はありません。'), '削除する', async () => {
      const r = await api('deleteEvent', { pass: this.pass(), id });
      this.A.events = r.events; this.A.orders = r.orders;
      if (this.A.ev === id) this.A.ev = 'all'; if (this.A.hEv === id) this.A.hEv = null;
      closeSheet(); toast('削除しました'); this.render();
    });
  },
  askDelOrder() {
    const E = this.E;
    this.confirmBox('注文を削除', `${E.id}　${E.name} 様（${yen(this.calcE().total)}）の注文を削除します。\n取り消しの場合は「キャンセル」にする方法もあります（記録が残ります）。`, '削除する', async () => {
      await api('deleteOrder', { pass: this.pass(), id: E.id });
      this.A.orders = this.A.orders.filter(o => o.id !== E.id);
      closeSheet(); toast('削除しました'); this.render();
    });
  },
  toggleEvent(id) { const e = clone(this.A.events.find(x => x.id === id)); e.open = !e.open; this.saveEvent(e); },
  editEvent(id) {
    const e = this.A.events.find(x => x.id === id);
    openSheet(`<div class="hd"><button class="x" onclick="closeSheet()">✕</button><div class="t">イベントを変更</div></div><div class="bd"><div class="card">
      <label class="f">イベント名</label><input class="in" id="ee-name" value="${h(e.name)}"><label class="f">日付</label><input class="in" id="ee-date" type="date" value="${h(e.date)}"><label class="f">会場</label><input class="in" id="ee-venue" value="${h(e.venue)}">
      <div class="g2"><div><label class="f">販売店（バック先）</label><input class="in" id="ee-partner" value="${h(e.partner || '')}"></div><div><label class="f">上乗せ率（%）</label><input class="in" id="ee-markup" type="number" inputmode="numeric" value="${h(+e.markup || 0)}" oninput="Admin.markupPreview('ee')"></div></div>
      <label class="f">購入特典（税抜お肉代：特典額）</label><input class="in" id="ee-perks" value="${h(e.perks || '')}" placeholder="例）13000:2000,26000:4000,39000:6000,50000:10000">
      <label class="f">この販売会だけの追加商品<span class="opt">名前:税抜単価(円/kg):原価(円/kg) をカンマ区切り</span></label><input class="in" id="ee-extras" value="${h(extrasText(e.extras))}" placeholder="例）テール:12000:9000,タン:6000:4000">
      <p class="hint" id="ee-prev"></p><p class="hint">上乗せ率の変更は、これから入る注文に反映されます（すでに入っている注文の金額は変わりません）。</p></div></div>
      <div class="ft"><button class="btn pri" style="flex:1" onclick="Admin.saveEvent(Object.assign({},Admin.A.events.find(x=>x.id==='${h(id)}'),{name:$('#ee-name').value,date:$('#ee-date').value,venue:$('#ee-venue').value,partner:$('#ee-partner').value.trim(),markup:Math.max(0,+$('#ee-markup').value||0),perks:$('#ee-perks').value.trim(),extras:parseExtras($('#ee-extras').value)}));closeSheet()">保存</button></div>`);
    this.markupPreview('ee');
  },
  markupPreview(pre) {
    const m = Math.max(0, +($('#' + pre + '-markup') || {}).value || 0), el = $('#' + pre + '-prev'); if (!el) return;
    if (!m) { el.textContent = '0%なら元の価格のまま表示されます。'; return; }
    el.innerHTML = '表示価格の例（税抜/kg）：' + this.A.products.filter(p => p.active !== false).slice(0, 4).map(p => `${h(p.cat)} ${h(p.name)} ${yen(p.price)}→<b>${yen(markupPrice(p.price, m))}</b>`).join('、') + ' …';
  },
  copyBack(id) {
    const e = this.A.events.find(x => x.id === id), n = this.A.orders.filter(o => o.eventId === id && o.status !== 'キャンセル');
    const bk = n.reduce((a, o) => a + (+o.back || 0), 0), sb = n.reduce((a, o) => a + o.subtotal, 0), paid = n.filter(o => o.paid);
    const t = `【販売店バック明細】\n${e.name}（${jdate(e.date)}）\n販売店：${e.partner || ''}\n上乗せ率：${+e.markup}%\n\n注文：${n.length}件（うち入金済 ${paid.length}件）\n売上（税抜）：${yen(sb)}\nバック額（税抜）：${yen(bk)}\n　うち入金済分：${yen(paid.reduce((a, o) => a + (+o.back || 0), 0))}\n\n内訳\n` + n.map(o => `・${o.id} ${o.name}様　売上${yen(o.subtotal)}　バック${yen(o.back || 0)}${o.paid ? '' : '（未入金）'}`).join('\n');
    copy(t, 'バック明細を');
  },
  qr(id) {
    const e = this.A.events.find(x => x.id === id), url = baseUrl() + '?e=' + encodeURIComponent(id);
    openSheet(`<div class="hd"><button class="x" onclick="closeSheet()">✕</button><div class="t">QRコード</div></div><div class="bd" style="text-align:center">
      <div class="card"><div class="logo serif" style="letter-spacing:.25em;color:var(--g);font-weight:700">NATURE KOBE</div><p class="b" style="margin:6px 0">${h(e.name)}</p><p class="sm">スマホで読み取って、そのままご注文いただけます</p>
      <div class="qr" id="qrbox">QRを作成中…</div><div class="urlbox">${h(url)}</div></div>
      <button class="btn" onclick="Admin.printQr()">QRを印刷・PDF</button></div>`);
    const draw = () => { $('#qrbox').innerHTML = ''; new QRCode($('#qrbox'), { text: url, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M }); };
    if (window.QRCode) return draw();
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = draw; s.onerror = () => { $('#qrbox').textContent = 'QRを作成できませんでした（URLをコピーしてQR作成サービスをご利用ください）'; };
    document.head.appendChild(s);
  },
  printQr() { $('#print').innerHTML = `<div style="text-align:center;font-family:'Noto Serif JP',serif;padding-top:30mm">${$('#sheet .bd .card').innerHTML}</div>`; setTimeout(() => window.print(), 50); },
  /* ---- 商品・設定 ---- */
  renderSettings() {
    const A = this.A, S = A.settings;
    this._P = this._P || clone(A.products);
    const P = this._P;
    const sf = (k, label, ph, ta) => `<label class="f">${label}</label>${ta ? `<textarea class="in" oninput="Admin.A.settings['${k}']=this.value" placeholder="${h(ph || '')}">${h(S[k] || '')}</textarea>` : `<input class="in" value="${h(S[k] || '')}" placeholder="${h(ph || '')}" oninput="Admin.A.settings['${k}']=this.value">`}`;
    return `<div class="card"><h3>商品と価格（税抜・1kgあたり）</h3><p class="sm mut">変更はこれからの注文に反映されます（すでに入った注文の金額は変わりません）。</p>
      <div style="overflow-x:auto"><table class="ptable" style="width:100%;min-width:560px"><tr class="xs mut"><td>区分</td><td>商品名</td><td>単価/kg</td><td>価格変動〜</td><td>販売中</td><td></td></tr>
      ${P.map((p, i) => `<tr><td style="width:110px"><input value="${h(p.cat)}" oninput="Admin._P[${i}].cat=this.value"></td><td><input value="${h(p.name)}" oninput="Admin._P[${i}].name=this.value"></td><td style="width:110px"><input type="number" value="${h(p.price)}" oninput="Admin._P[${i}].price=+this.value"></td>
        <td style="width:80px;text-align:center"><input type="checkbox" style="width:20px;height:20px;min-height:0" ${p.variable ? 'checked' : ''} onchange="Admin._P[${i}].variable=this.checked"></td><td style="width:70px;text-align:center"><input type="checkbox" style="width:20px;height:20px;min-height:0" ${p.active !== false ? 'checked' : ''} onchange="Admin._P[${i}].active=this.checked"></td>
        <td style="width:96px;white-space:nowrap"><button class="x" onclick="Admin.mvP(${i},-1)">↑</button><button class="x" onclick="Admin.mvP(${i},1)">↓</button></td></tr>`).join('')}</table></div>
      <div class="row wrapf" style="margin-top:8px"><button class="btn sm" onclick="Admin._P.push({id:'',cat:'その他',name:'',price:0,variable:false,active:true});Admin.render()">＋ 商品を追加</button><span class="grow"></span><button class="btn pri" onclick="Admin.saveProducts()">商品を保存</button></div>
      <p class="hint">販売をやめる商品は「販売中」のチェックを外してください（過去の注文のために残ります）。</p></div>
      <div class="card"><h3>販売者・お支払い・メール</h3>
      <div class="g2"><div>${sf('taxRate', 'お肉の消費税率（%）')}</div><div>${sf('shipTaxRate', '送料の消費税率（%）')}</div></div><div class="g2"><div>${sf('shippingFee', '送料（税抜・1注文あたり、無料は0）')}</div><div></div></div><div style="margin-top:8px">${sf('bankInfo', '振込先（ネット販売の振込案内・督促メールに使用。改行可）', '例）○○銀行 ○○支店 普通 1234567 ナチュール神戸', true)}</div>
      ${sf('sellerName', '販売者名（領収書・メールに表示）')}${sf('sellerAddress', '販売者の住所（領収書に表示）')}
      <div class="g2"><div>${sf('sellerTel', '電話番号')}</div><div>${sf('sellerEmail', 'メールアドレス')}</div></div>
      ${sf('deliveryNote', '発送の目安（注文画面・メールに表示）')}
      ${sf('processorName', '加工元（注文画面・メールに表示）', '例）神戸うすなが牧場')}
      ${sf('shopName', '精肉店名（発注文の宛名）')}
      ${sf('mailSignature', 'メールの署名（空欄なら販売者名・住所・電話で作成）', '', true)}
      <p><button class="btn pri" onclick="Admin.saveSettings()">設定を保存</button></p></div>
      <div class="card"><h3>LINE通知</h3><p class="hint">注文が入るとLINEグループに通知します。トークンは保存後、画面には表示されません。</p><input class="in" id="line-token" type="password" autocomplete="off" placeholder="チャネルアクセストークン（長期）"><p><button class="btn pri" onclick="Admin.saveLine()">LINE設定を保存</button> <button class="btn" onclick="Admin.testLine()">テスト送信</button></p></div>
      <div class="card"><h3>ログイン</h3><button class="btn" onclick="Admin.logout()">この端末からログアウト</button></div>`;
  },
  mvP(i, d) { const P = this._P, j = i + d; if (j < 0 || j >= P.length) return; [P[i], P[j]] = [P[j], P[i]]; this.render(); },
  async saveProducts() {
    try { const r = await api('saveProducts', { pass: this.pass(), products: this._P.filter(p => p.name.trim()) }); this.A.products = r.products; this._P = clone(r.products); toast('商品を保存しました'); this.render(); }
    catch (e) { toast(e.message, true); }
  },
  async saveLine() {
    const token = ($('#line-token').value || '').trim();
    if (!token) { toast('トークンを入力してください', true); return; }
    try { const r = await api('setLine', { pass: this.pass(), token }); $('#line-token').value = ''; toast(r.groupSet ? 'LINE設定を保存しました（グループ登録済み）' : 'LINE設定を保存しました（グループはまだ未登録です）'); }
    catch (e) { toast(e.message, true); }
  },
  async testLine() {
    try { const r = await api('testLine', { pass: this.pass() }); toast(r.sent ? 'グループにテストを送信しました' : 'テスト送信できませんでした：' + (r.reason || '')); }
    catch (e) { toast(e.message, true); }
  },
  async saveSettings() {
    try { const r = await api('saveSettings', { pass: this.pass(), settings: this.A.settings }); this.A.settings = r.settings; toast('設定を保存しました'); }
    catch (e) { toast(e.message, true); }
  }
};

/* ===================================================================
   精肉店の発送画面
   =================================================================== */
const Shop = {
  D: null,
  pass() { return ls.get('nk-shop-pass') || ''; },
  async init() {
    if (!this.pass()) return this.login();
    $('#app').innerHTML = brandBar('発送管理') + '<div class="loading">読み込み中…</div>';
    try {
      const r = await api('shop', { pass: this.pass() });
      this.D = Object.assign(this.D || { f: '未発送', ev: 'all' }, { orders: r.orders, events: r.events, settings: r.settings || {} });
      this.render();
    } catch (e) { ls.del('nk-shop-pass'); this.login(e.message); }
  },
  login(err) {
    $('#app').innerHTML = brandBar('発送管理') + `<div class="wrap" style="max-width:420px"><div class="card"><h3>精肉店用ログイン</h3>
      ${err ? `<div class="errbox">${h(err)}</div>` : ''}<label class="f">パスワード</label><input class="in" id="pw" type="password" onkeydown="if(event.key==='Enter')Shop.doLogin()">
      <p><button class="btn pri block" onclick="Shop.doLogin()">ログイン</button></p>${DEMO ? '<p class="hint">デモのパスワード：demo-shop（先に管理画面で「発注済」にした注文が表示されます）</p>' : ''}</div></div>`;
  },
  doLogin() { ls.set('nk-shop-pass', $('#pw').value.trim()); this.init(); },
  render() {
    const D = this.D;
    const inEv = D.orders.filter(o => D.ev === 'all' || o.eventId === D.ev);
    const pending = inEv.filter(o => o.status === '発注済');
    const list = inEv.filter(o => D.f === 'すべて' || (D.f === '未発送' ? o.status === '発注済' : o.status === '発送済')).sort((a, b) => a.id < b.id ? -1 : 1);
    const evName = id => (D.events.find(e => e.id === id) || {}).name || '';
    $('#app').innerHTML = brandBar('発送管理' + (D.settings.shopName ? '（' + D.settings.shopName + '）' : ''), `<button class="btn sm" onclick="Shop.init()">更新</button>`) + `
    <div class="wrap wide">
      <div class="filters"><select onchange="Shop.D.ev=this.value;Shop.render()"><option value="all">すべてのイベント</option>${D.events.map(e => `<option value="${h(e.id)}" ${D.ev === e.id ? 'selected' : ''}>${h(e.date)} ${h(e.name)}</option>`).join('')}</select></div>
      <div class="chips" style="margin-top:8px">${['未発送', '発送済', 'すべて'].map(f => `<button class="${D.f === f ? 'on' : ''}" onclick="Shop.D.f='${f}';Shop.render()">${f} ${f === '未発送' ? pending.length : f === '発送済' ? inEv.length - pending.length : inEv.length}</button>`).join('')}</div>
      ${pending.length ? `<details class="card" ${D.f === '未発送' ? 'open' : ''}><summary class="b" style="cursor:pointer">未発送の合計（${pending.length}件）</summary>${aggTable(pending)}</details>` : ''}
      <p class="sm mut">発送したら「発送日」と「伝票番号」を入れて「発送完了」を押してください。確認画面のあと、お客様に発送のお知らせメールが届きます。</p>
      ${list.length ? list.map(o => this.card(o, evName(o.eventId))).join('') : '<p class="mut">該当する注文はありません</p>'}
    </div>`;
  },
  card(o, evn) {
    return `<div class="card" id="sc-${o.id}"><div class="row wrapf"><b style="font-size:17px">${h(shipName(o))} 様</b><span class="store ${o.storage || 'none'}">${h(o.storage || '保存状態 未定')}</span><span class="chip c-${o.status}">${o.status === '発注済' ? '未発送' : '発送済'}</span>${o.shipMailSent ? '<span class="chip c-paid">発送メール送信済</span>' : ''}</div>
      <div class="xs mut">${h(o.id)}　${h(evn)}${o.shipTo && o.shipTo.on ? `　（ご注文者：${h(o.name)} 様）` : ''}</div>
      <div style="margin:8px 0" class="sm">${h(shipAddr(o))}<br>TEL ${h(shipTel(o) || '（なし）')}</div>
      <table class="agg">${o.items.map(i => `<tr><td>${h(i.name)}${i.note ? `<div class="xs mut">${h(i.note)}</div>` : ''}</td><td class="n">${gl(i.g)} × ${i.count}</td></tr>`).join('')}${(o.extras || []).map(x => `<tr><td colspan="2">${h(x.name)}</td></tr>`).join('')}</table>
      ${o.note ? `<div class="warnbox">備考：${h(o.note)}</div>` : ''}
      <div class="g2" style="margin-top:6px"><div><label class="f">発送日</label><input class="in" type="date" id="sd-${o.id}" value="${h(o.shipDate)}"></div>
      <div><label class="f">配送業者</label><select class="in" id="sca-${o.id}">${CARRIERS.map(c => `<option ${(o.carrier || 'ヤマト運輸') === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div></div>
      <label class="f">伝票番号</label><input class="in" id="st-${o.id}" inputmode="numeric" value="${h(o.tracking)}" placeholder="例）1234-5678-9012">
      <p><button class="btn ${o.status === '発送済' ? '' : 'pri'} block" onclick="Shop.save('${o.id}')">${o.status === '発送済' ? '修正して保存' : '発送完了'}</button></p>
      ${o.status === '発送済' && o.hasEmail && !o.shipMailSent ? `<p><button class="btn gold block" onclick="Shop.mail('${o.id}')">お客様に発送メールを送る</button></p>` : ''}
      ${!o.hasEmail ? '<p class="xs mut">この注文はメールアドレスがないため、お客様への連絡はNATURE KOBEから行います。</p>' : ''}</div>`;
  },
  mail(id) { mailFlow({ pass: this.pass(), id, kind: 'ship', onSent: o => { const i = this.D.orders.findIndex(x => x.id === id); this.D.orders[i] = o; this.render(); } }); },
  async save(id) {
    const shipDate = $('#sd-' + id).value, carrier = $('#sca-' + id).value, tracking = $('#st-' + id).value.trim();
    if (!shipDate || !tracking) { toast('発送日と伝票番号を入力してください', true); return; }
    try {
      const r = await api('shopUpdate', { pass: this.pass(), id, shipDate, carrier, tracking });
      const i = this.D.orders.findIndex(o => o.id === id); this.D.orders[i] = r.order;
      toast('保存しました'); this.render();
      if (r.order.hasEmail && !r.order.shipMailSent) this.mail(id);
    } catch (e) { toast(e.message, true); }
  }
};

route();
</script>
