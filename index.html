*{box-sizing:border-box}

.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* header */

body.net{--g:#1b2d5c;--g2:#2a3f7a;--gl:#e6ebf5;--gold:#4a5f94;--goldl:#e9edf6;--blue:#1b2d5c;--bluel:#e6ebf5}

.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:10;margin-top:20px}

.ov{position:fixed;inset:0;background:rgba(20,28,24,.45);z-index:50;display:flex;justify-content:flex-end}

.qr{display:flex;justify-content:center;padding:10px;background:#fff}

<body>

<script>
/* ===== 設定：GASのウェブアプリURL ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyb0FqyJm6nmEuCcrbT5idhrX2Uq6jwxrMnl9gjKZ1Bqe_1L0Zy37wxHkO7-ZushUoW/exec';

/* ===== 共通 ===== */
const DEMO = !!window.__DEMO;
const $ = (s, r = document) => r.querySelector(s);
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = n => '¥' + Math.round(+n || 0).toLocaleString('ja-JP');
const gl = g => { g = +g || 0; return g >= 1000 ? (+(g / 1000).toFixed(2)) + 'kg' : g + 'g'; };
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const jdate = s => { if (!s) return ''; const m = String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? `${+m[1]}年${+m[2]}月${+m[3]}日` : s; };
const mdw = s => { const m = String(s || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if (!m) return s || ''; const d = new Date(+m[1], +m[2] - 1, +m[3]); return `${+m[2]}月${+m[3]}日（${'日月火水木金土'[d.getDay()]}）`; };
const _mem = {};
const ls = { get(k) { try { const v = localStorage.getItem(k); if (v != null) return v; } catch (e) {} return k in _mem ? _mem[k] : null; }, set(k, v) { _mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { delete _mem[k]; try { localStorage.removeItem(k); } catch (e) {} } };
const baseUrl = () => location.origin + location.pathname;
let toastT;
function toast(msg, err) { const t = $('#toast'); t.textContent = (typeof I18N !== 'undefined' && I18N.t(msg)) || msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', err ? 4200 : 2200); }
async function copy(text, label) {
  try { await navigator.clipboard.writeText(text); toast((label || '') + 'コピーしました'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast((label || '') + 'コピーしました'); } catch (e2) { toast('コピーできませんでした', true); } ta.remove(); }
}
async function api(action, data) {
  data = Object.assign({ action }, data || {});
  if (DEMO) return await demoApi(action, data);
  if (!API_URL) throw new Error('API_URLが設定されていません');
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'エラーが発生しました');
  return j;
}
/* 金額計算（GASと同じ） */
const markupPrice = (base, m) => { m = +m || 0; return m ? Math.ceil(base * (1 + m / 100) / 100) * 100 : base; };
const baseOf = it => it.basePrice !== '' && it.basePrice != null ? +it.basePrice : (it.unitPrice !== '' && it.unitPrice != null ? +it.unitPrice : 0);
function computeOrder(o, S, prods, trust) {
  const pm = {}; (prods || []).forEach(p => pm[p.id] = p);
  const m = +o.markup || 0;
  let sub = 0, back = 0;
  o.items = (o.items || []).filter(it => +it.g > 0 && +it.count > 0 && (trust || pm[it.pid])).map(it => {
    const p = pm[it.pid];
    const base = trust && it.basePrice !== '' && it.basePrice != null ? +it.basePrice
      : trust && it.unitPrice !== '' && it.unitPrice != null ? +it.unitPrice : (p ? p.price : 0);
    const unit = markupPrice(base, m);
    const amount = Math.round(unit * (+it.g) * (+it.count) / 1000);
    sub += amount;
    back += amount - Math.round(base * (+it.g) * (+it.count) / 1000);
    return { pid: String(it.pid || ''), name: p ? (p.cat + ' ' + p.name) : String(it.name || ''), basePrice: base, unitPrice: unit, variable: p ? p.variable : !!it.variable, g: +it.g, count: +it.count, amount, note: String(it.note || '') };
  });
  o.extras = (trust ? (o.extras || []) : []).filter(x => x && String(x.name || '').trim()).map(x => ({ name: String(x.name), amount: +x.amount || 0, note: String(x.note || '') }));
  o.extras.forEach(x => sub += x.amount);
  o.subtotal = sub;
  o.markup = m;
  o.back = back;
  o.shipping = trust && o.shipping !== '' && o.shipping != null ? +o.shipping : (+S.shippingFee || 0);
  o.taxRate = trust && o.taxRate !== '' && o.taxRate != null ? +o.taxRate : (+S.taxRate || 10);
  /* 軽減税率：お肉は taxRate（8%）、送料は shipTaxRate（10%）。旧データ（shipTaxRate なし）は従来どおり同じ税率 */
  const legacy = trust && (o.shipTaxRate === '' || o.shipTaxRate == null) && o.createdAt && String(o.createdAt) < '2026-10-18 09';
  o.shipTaxRate = trust && o.shipTaxRate !== '' && o.shipTaxRate != null ? +o.shipTaxRate : legacy ? o.taxRate : (+S.shipTaxRate || 10);
  o.taxFood = Math.floor(sub * o.taxRate / 100);
  o.taxShip = Math.floor(o.shipping * o.shipTaxRate / 100);
  o.tax = o.taxFood + o.taxShip;
  o.total = sub + o.shipping + o.tax;
  return o;
}
const lineAmt = (price, g, count) => Math.round((+price || 0) * (+g || 0) * (+count || 0) / 1000);
function zipLookup(zip, cb) {
  const z = String(zip || '').replace(/[^0-9]/g, '');
  if (z.length !== 7) { toast('郵便番号は7桁で入力してください', true); return; }
  const name = 'zipcb' + Date.now();
  const s = document.createElement('script');
  const timer = setTimeout(() => { cleanup(); toast('住所を取得できませんでした。手入力してください', true); }, 6000);
  function cleanup() { clearTimeout(timer); delete window[name]; s.remove(); }
  window[name] = r => { cleanup(); if (r && r.results && r.results[0]) { const a = r.results[0]; cb(a.address1 + a.address2 + a.address3); } else toast('該当する住所が見つかりません', true); };
  s.src = 'https://zipcloud.ibsnet.co.jp/api/search?zipcode=' + z + '&callback=' + name;
  s.onerror = () => { cleanup(); toast('住所を取得できませんでした。手入力してください', true); };
  document.body.appendChild(s);
}
function openSheet(html) { $('#sheet').innerHTML = html; $('#ov').hidden = false; document.body.style.overflow = 'hidden'; $('#sheet').scrollTop = 0; }
function closeSheet() { $('#ov').hidden = true; document.body.style.overflow = ''; }
function brandBar(title, right, tabs) {
  return `${DEMO ? '<div class="demo">プレビュー（デモデータ）：ここでの操作は保存されません</div>' : ''}<div class="topbar"><div class="tin"><div class="logo">NATURE <span>KOBE</span></div><div class="ttl">${h(title)}</div><div class="sp"></div>${right || ''}</div>${tabs || ''}</div>`;
}
/* 量の選択肢：全商品300gパック単位（多い場合は個数で調整） */
const isCut = p => false;
const gOpts = p => { const a = []; for (let g = 300; g <= 3000; g += 100) a.push(g); return a; }; // 100g単位（300g以上）
const gOk = (p, g) => g >= 300 && g % 100 === 0;
const MIN_PACK = 300;
/* 商品写真（写真がある商品だけ表示。タップで拡大） */
const PHOTOS = { 's-aka': 'img/s-aka.jpg?v=3', 's-shimo': 'img/s-shimo.jpg?v=2', 'st-aka': 'img/st-aka.jpg?v=2', 'st-shimo': 'img/st-shimo.jpg?v=2', 'o-kiri': 'img/o-kiri.jpg?v=2' };
function showPhoto(pid) {

  const d = document.createElement('div'); d.className = 'pview'; d.onclick = () => d.remove();
  d.innerHTML = `<img src="${PHOTOS[pid]}" alt=""><div class="cap">${p ? h(p.cat + ' ' + p.name) : ''}　（タップで閉じる）<br><span style="font-size:12px;opacity:.8">※写真はイメージです</span></div>`;
  document.body.appendChild(d);
}
/* 購入特典：「13000:2000,26000:4000」→ [{min:13000,val:2000},...] */
const parsePerks = s => String(s || '').split(/[,、\s]+/).map(x => x.split(/[:：]/)).filter(x => +x[0] > 0).map(x => ({ min: +x[0], val: +x[1] || 0 })).sort((a, b) => a.min - b.min);
const perkFor = (perks, sub) => { let cur = null, next = null; perks.forEach(p => { if (sub >= p.min) cur = p; else if (!next) next = p; }); return { cur, next }; };
const perkText = (perks, sub) => { if (!perks.length) return ''; const { cur, next } = perkFor(perks, sub); return (cur ? `🍷 ${yen(cur.val)}相当のワイン特典の対象です` : '') + (next ? `${cur ? '（' : '🍷 '}あと ${yen(next.min - sub)} で ${yen(next.val)}相当のワイン${cur ? '）' : ''}` : ''); };

const PAYMENTS = ['現金', 'クレジットカード', '振込'];
// 原価（碓永さん側の請求書 2026-10-14・9/27奈良販売会の単価・税抜・円/kg）。商品名（カテゴリ＋名前）ごとに設定で計算
const COST_PER_KG = {
  // 2回目以降（10/25〜）の原価（梅本さん・円/kg・税抜）
  'スライス 赤身': 8000, 'スライス 霜降り': 28000,
  '焼き肉 赤身（特上）': 16000, '焼き肉 赤身（上）': 15000, '焼き肉 赤身（並）': 10000,
  '焼き肉 霜降り（特上）': 20000, '焼き肉 霜降り（上）': 16000, '焼き肉 霜降り（並）': 10000,
  'ステーキ 赤身': 16000, 'ステーキ 霜降り': 28000,
  'その他 切り落とし': 5500, 'その他 スジ肉': 2200
};
// 販売会ごとの原価（上の表と違うものだけ、またはその販売会の全部）。ここに無い販売会は COST_PER_KG を使う
// 販売会ごとの送料の原価（碓永さん請求書の送料・税抜）
const SHIP_COST_BY_EVENT = { 'e20260927': 15390 };
const COST_BY_EVENT = {
  // 9/27奈良販売会（1回目・碓永さん請求書 INV-0000002882 の単価）
  'e20260927': {
    'スライス 赤身': 8000, 'スライス 霜降り': 28000,
    '焼き肉 赤身（特上）': 16000, '焼き肉 赤身（上）': 12000, '焼き肉 赤身（並）': 9000,
    '焼き肉 霜降り（特上）': 20000, '焼き肉 霜降り（上）': 15000, '焼き肉 霜降り（並）': 9000,
    'ステーキ 赤身': 16000, 'ステーキ 霜降り': 28000,
    'その他 切り落とし': 5500, 'その他 スジ肉': 2200, 'その他 テール': 3500
  }
};
// 販売会の追加商品の入力欄（名前:税抜単価:原価 のカンマ区切り）⇄ データ
function parseExtras(s){
  return String(s || '').split(/[,，]/).map(t => t.trim()).filter(Boolean).map(t => {
    const [n, p, c] = t.split(':').map(x => (x || '').trim());
    return { name: n, price: +p || 0, cost: +c || 0 };
  }).filter(x => x.name && x.price > 0);
}
function extrasText(list){ return (list || []).map(x => `${x.name}:${x.price}:${x.cost || 0}`).join(','); }
// 注文ひとつの原価（円）と、原価が不明な商品の有無
function orderCostOf(o){
  let cost = 0, unknown = false;
  (o.items || []).forEach(i => {
    // 販売会ごとの追加商品は、注文に原価（cost）が入っている。それ以外は商品の原価表を使う
    const table = COST_BY_EVENT[o.eventId] || COST_PER_KG;
    const p = i.cost != null && i.cost !== '' ? +i.cost : table[i.name];
    if (p == null || p === '' || isNaN(p)) { unknown = true; return; }

  });
  return { cost: Math.round(cost), unknown };
}
const payLabel = p => p === 'クレジットカード' ? 'クレジットカード' : (p === '現金' || p === '当日現金') ? '現金' : p === '振込' ? '銀行振込' : (p || '');
/* 自動メール：送信前に内容を見せて確認してから送る */
async function mailFlow(opt) {
  const kindName = opt.kind === 'receipt' ? '領収書メール' : '発送メール';
  openSheet(`<div class="hd"><button class="x" onclick="closeSheet()">✕</button><div class="t">${kindName}の確認</div></div><div class="bd"><div class="loading">メールを準備しています…</div></div>`);

  catch (e) { closeSheet(); toast(e.message, true); if (opt.onCancel) opt.onCancel(); return; }
  window._mailOpt = opt;
  openSheet(`<div class="hd"><button class="x" onclick="mailFlowCancel()">✕</button><div class="t">${kindName}の確認</div></div>
    <div class="bd">${m.hasEmail ? `<div class="okbox">この内容で <b>${h(m.to)}</b> に、<b>info@naturekobe.com</b> から送信します。</div>` : '<div class="warnbox">この注文にはメールアドレスが登録されていないため、送信できません。</div>'}
    <div class="card"><div class="sm mut">件名</div><div class="b" style="margin-bottom:10px">${h(m.subject)}</div>
    ${m.attach ? `<div class="sm mut">添付</div><div style="margin-bottom:10px">📄 ${h(m.attach)}</div>` : ''}
    <div class="sm mut">本文</div><div style="white-space:pre-wrap;font-size:14px;background:#faf9f5;border:1px solid var(--line);border-radius:8px;padding:10px">${h(m.body)}</div></div></div>
    <div class="ft">${m.hasEmail ? `<button class="btn gold" style="flex:1" id="mailsend" onclick="mailFlowSend()">この内容で送信する</button>` : ''}<button class="btn" onclick="mailFlowCancel()">${m.hasEmail ? '送信しない' : '閉じる'}</button></div>`);
}
async function mailFlowSend() {

  catch (e) { toast(e.message, true); if (b) { b.disabled = false; b.textContent = 'この内容で送信する'; } }

/* ===================================================================
   多言語（お客さんの画面の言語切替）
   ・画面の固定の文言を切り替えます。商品名・部位名も翻訳します。金額・日付は書式だけ変えます。
   ・翻訳は「その国で自然に読める言い方」を優先し、直訳はしていません。
   ・dict … 文言そのまま一致で置き換え（商品名・部位名・ボタンなど）
   ・rx   … 数字や金額が入る文言を正規表現で置き換え
   ・html … data-i18n を付けた要素の中身を丸ごと置き換え（{0}{1} に元の太字などの値が入る）

  init() { this.lang = this.get(); document.documentElement.lang = this.lang; },
  get() { const l = ls.get('nk-lang'); return LANGS.some(x => x[0] === l) ? l : 'ja'; },
  set(l) { this.lang = l; ls.set('nk-lang', l); document.documentElement.lang = l; if (/^(activity|story|info)$/.test(new URLSearchParams(location.search).get('page') || '')) { Activity.init(); return; } this.apply(); render_lang_bar(); },
  /* 1行の文言を翻訳。訳がなければ null */
  t(src) {
    if (this.lang === 'ja') return null;
    const d = this.dict[this.lang] || {}, rx = this.rx[this.lang] || [];
    const s = String(src).trim(); if (!s) return null;
    if (s in d) return d[s];
    for (const [re, fn] of rx) { const m = s.match(re); if (m) return fn(...m); }
    // 「1. 商品を選ぶ」「スライス 赤身」のように、部分ごとに訳があるときは全部そろえば訳す
    const parts = s.split(/(\s+)/); if (parts.length > 1) { const out = parts.map(p => /^\s+$/.test(p) || /^\d+\.$/.test(p) ? p : (d[p] ?? null)); if (!out.includes(null)) return out.join(''); }
    return null;
  },
  apply() {
    const root = document.getElementById('app'); if (!root) return;
    this._orig = this._orig || new WeakMap();
    // data-i18n 要素（中身を丸ごと）
    root.querySelectorAll('[data-i18n]').forEach(el => {
      if (!this._orig.has(el)) this._orig.set(el, el.innerHTML);
      const o = this._orig.get(el), tpl = (this.html[this.lang] || {})[el.dataset.i18n];
      if (!tpl) { if (el.innerHTML !== o) el.innerHTML = o; return; }
      const tmp = document.createElement('div'); tmp.innerHTML = o; const vs = [...tmp.querySelectorAll('[data-v]')].map(v => { const t = this.t(v.textContent); return t == null ? v.innerHTML : h(t); });
      el.innerHTML = tpl.replace(/\{(\d+)\}/g, (m, i) => vs[+i] ?? '');
    });
    // テキストノード
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
    while (w.nextNode()) { const n = w.currentNode; if (!n.parentElement.closest('[data-i18n]')) nodes.push(n); }
    nodes.forEach(n => {
      if (!this._orig.has(n)) this._orig.set(n, n.nodeValue);
      const src = this._orig.get(n), tr = this.t(src);
      n.nodeValue = tr == null ? src : src.replace(src.trim(), tr);
    });
    // placeholder
    root.querySelectorAll('[placeholder]').forEach(el => {
      if (!this._orig.has(el)) this._orig.set(el, el.placeholder);
      const o = this._orig.get(el), d = this.dict[this.lang] || {};
      el.placeholder = ('PH:' + o) in d ? d['PH:' + o] : o;
    });
  },
};
function langButtons() { return LANGS.map(([c, n]) => `<button type="button" class="${I18N.lang === c ? 'on' : ''}" onclick="I18N.set('${c}')">${n}</button>`).join(''); }
function render_lang_bar() { const el = document.getElementById('langbar'); if (el) el.innerHTML = langButtons(); }
function langBar() { return `<div class="langbar" id="langbar">${langButtons()}</div>`; }

  members: [
    { name: '碓永（神戸うすなが牧場）', role: '生産／但馬牛・神戸ビーフ', photo: 'img/story/m-usunaga.jpg', bio: 'うすなが牧場は、兵庫県神戸市を拠点に、但馬牛・神戸ビーフの繁殖、育成、肥育から販売、飲食まで一貫して取り組む畜産グループです。\n神戸でできる、自給飼料や地域未活用資源を生かした循環型農業にも挑戦。\n「牛を育てるだけでなく、牛から生まれる価値を最後まで届ける」を理念に、生産者・料理人・消費者をつなぎ、関わるすべての人が幸せになれる畜産を神戸から世界へ発信しています。' },
    { name: '牛尾（株式会社エクステージ）', role: '販売／お客さまとのご縁をつなぐ', photo: 'img/story/m-ushio.jpg', bio: '株式会社エクステージ（建設業）に携わる一方、自身も繁殖牛のオーナーとして牧場に関わり、畜産の現場や牛舎設備への理解を深めてきました。その経験を通じて、生産者の想いや畜産を取り巻く課題に触れ、農業と畜産が支え合う循環型農業の大切さを実感しています。人と人とのつながりを大切にしながら、但馬牛の魅力やNATURE KOBEが目指す未来を伝え、一度つながったご縁を大切に、食の背景まで届ける販売を目指しています。' },
    { name: '栗原（丹匠グループ）', role: '堆肥・飼料／土づくりと循環の設計', photo: 'img/story/m-kurihara.jpg', bio: '丹波で農業を始めて約10年。牧草、堆肥、丹波栗、お米と事業を拡大していく中で、すべての真ん中に「土」があることに気づきました。自社でも但馬牛100頭を育て、その牛ふんを年間約1,000トンの堆肥に変えて田畑に還し、そこで育った作物をまた牛へ。この循環を地域に根づかせることに情熱を注いでいます。\nNATURE KOBEでは堆肥と自給飼料の循環を担当。兵庫の土と牛をつなぎ、いい肉といい食が巡り続ける仕組みを、仲間とともにつくっています。' },
  ],
  i18n: {
    en: {
      tagline: 'Raise the cattle. Build the soil. Grow the food. A new kind of farming that keeps life in motion.',
      definition: 'NATURE KOBE is a circular-agriculture company from Kobe, Japan. We do more than deliver Tajima and Kobe Beef: we keep life moving in a circle.\nCattle manure becomes rich compost; the compost builds the soil; that soil grows rice and vegetables; and the crops and rice straw go back to feed the cattle. The Tajima and Kobe Beef (NATURE BEEF), rice (NATURE RICE) and vegetables (NATURE LEAF) born in this cycle reach your table together with the story of the people who made them.\nThe three of us — Ushio, Usunaga and Kurihara — founded the company in Kobe in October 2026.',
      why: 'Good beef comes from good cattle, and good cattle come from good feed and good soil.\nJapanese livestock farming relies heavily on imported feed and is shaken by every swing in currency and climate. Manure is not waste to be disposed of; it is a resource that makes soil rich. Return it to the fields, feed the resulting rice and straw back to the cattle, and the region becomes self-sufficient and resilient to bad weather.\nWe do not believe that "A5 and heavy marbling" is the only measure of quality. We pursue beef with moderate marbling, a long finish and deep-red lean meat — beef you want to eat again.\nAnd we do not want to simply sell; we want to pass on the story behind the food, support prices and a future that producers can be proud of, and spread a sustainable Wagyu model from Kobe to the rest of Japan. That is why NATURE KOBE exists.',
      members: {
        '碓永（神戸うすなが牧場）': { name: 'Usunaga (Usunaga Farm, Kobe)', role: 'Producer · Tajima and Kobe Beef', bio: 'Usunaga Farm is a livestock group based in Kobe, Hyogo, that handles every stage of Tajima and Kobe Beef — breeding, raising and finishing the cattle, then sales and its own restaurants.\nIt is also pursuing circular farming that can be done in Kobe, using home-grown feed and the region\'s unused resources.\nGuided by the belief that "we don\'t just raise cattle — we deliver the full value they create, all the way to the end," the farm connects producers, chefs and consumers, and shares from Kobe to the world a kind of livestock farming that makes everyone involved happy.' },
        '牛尾（株式会社エクステージ）': { name: 'Ushio (Extage Co.)', role: 'Sales · building lasting relationships', bio: 'Alongside his work at the construction company Extage, Ushio is himself the owner of breeding cattle and involved in the farm, which has given him a close understanding of livestock work and barn facilities. Through that experience he has come to know the hopes of producers and the challenges facing livestock farming, and the importance of circular agriculture in which crops and cattle support each other. Valuing the connections between people, he conveys the appeal of Tajima Beef and the future NATURE KOBE is working toward, aiming for sales that cherish every relationship and deliver the story behind the food.' },
        '栗原（丹匠グループ）': { name: 'Kurihara (Tansho Group)', role: 'Compost and feed · designing the cycle', bio: 'About ten years into farming in Tamba. As he expanded his business from forage to compost, Tamba chestnuts and rice, he realised that soil sits at the centre of everything. His own farm raises 100 Tajima cattle; he turns their manure into about 1,000 tons of compost a year, returns it to the fields, and feeds the crops grown there back to the cattle — and he is passionate about rooting this cycle in the region.\nAt NATURE KOBE he is in charge of the cycle of compost and home-grown feed, linking the soil and the cattle of Hyogo to build, together with his partners, a system in which good beef and good food keep circulating.' },
      },
    },
    'zh-CN': {
      tagline: '养牛，养土，养出好食物。',
      definition: 'NATURE KOBE 是一家来自日本神户的循环型农业公司。我们不只是销售但马牛・神户牛，而是让生命在循环中流转。\n牛的粪便做成优质堆肥，堆肥培育土壤，土壤种出大米和蔬菜，作物和稻草又回到牛的饲料中。在这个循环里诞生的但马牛・神户牛（NATURE BEEF）、大米（NATURE RICE）和蔬菜（NATURE LEAF），连同生产者的心意，一起送到您的餐桌。\n牛尾、碓永、栗原三人于 2026 年 10 月在神户创立。',
      why: '好牛肉来自好牛，好牛来自好饲料和好土壤。\n日本的畜牧业大量依赖进口饲料，汇率和气候的变化都会带来冲击。牛粪不是需要处理的废物，而是让土壤肥沃的资源。把它还给田地，再把田里的大米和稻草喂给牛，地区内的资源就能循环，生产者靠自给变强，作物也更能抵御天气变化。\n我们不认为“A5・雪花多”就是唯一的好。我们追求的是油花适中、余韵悠长、瘦肉呈红豆色、吃了还想再吃的真正美味。\n我们不只是卖肉，更想传递食物背后的故事，支撑生产者引以为傲的价格和未来，把可持续的和牛模式从神户推广到全日本。这就是 NATURE KOBE 存在的理由。',
      members: {
        '碓永（神戸うすなが牧場）': { name: '碓永（神户碓永牧场）', role: '生产・但马牛・神户牛', bio: '碓永牧场以兵库县神户市为据点，是一家从但马牛・神户牛的繁殖、育成、育肥到销售、餐饮一条龙经营的畜产集团。\n同时挑战在神户就能实现的循环型农业，活用自给饲料和地区未利用资源。\n以“不只是养牛，更要把牛所创造的价值送到最后”为理念，连接生产者、厨师与消费者，从神户向世界传递让所有参与者都幸福的畜产。' },
        '牛尾（株式会社エクステージ）': { name: '牛尾（Extage 株式会社）', role: '销售・珍惜每一段缘分', bio: '在从事建筑公司 Extage 工作的同时，自己也是繁殖牛的牛主，参与牧场工作，对畜产现场和牛舍设备有深入了解。通过这些经历，他接触到生产者的心愿和畜产面临的课题，深切体会到农业与畜产相互支撑的循环型农业的重要性。他珍视人与人之间的联系，传递但马牛的魅力和 NATURE KOBE 所追求的未来，珍惜每一段缘分，致力于把食物背后的故事一并送到顾客手中。' },
        '栗原（丹匠グループ）': { name: '栗原（丹匠集团）', role: '堆肥・饲料・循环的设计', bio: '在丹波务农约十年。从牧草、堆肥到丹波栗、大米，在不断拓展事业的过程中，他发现一切的中心都是“土壤”。他自家也饲养 100 头但马牛，把牛粪变成每年约 1,000 吨堆肥，还给田地，再把田里长出的作物喂给牛——并倾注热情，让这个循环在地区扎根。\n在 NATURE KOBE 负责堆肥与自给饲料的循环，连接兵库的土壤与牛，与伙伴一起打造让好肉与好食物持续循环的机制。' },
      },
    },
    'zh-TW': {
      tagline: '養牛，養土，養出好食物。',
      definition: 'NATURE KOBE 是一家來自日本神戶的循環型農業公司。我們不只是販售但馬牛・神戶牛，而是讓生命在循環中流轉。\n牛的糞便做成優質堆肥，堆肥培育土壤，土壤種出稻米與蔬菜，作物與稻草再回到牛的飼料中。在這個循環裡誕生的但馬牛・神戶牛（NATURE BEEF）、稻米（NATURE RICE）與蔬菜（NATURE LEAF），連同生產者的心意，一起送到您的餐桌。\n牛尾、碓永、栗原三人於 2026 年 10 月在神戶創立。',
      why: '好牛肉來自好牛，好牛來自好飼料與好土壤。\n日本的畜牧業大量仰賴進口飼料，匯率與氣候的變化都會帶來衝擊。牛糞不是需要處理的廢棄物，而是讓土壤肥沃的資源。把它還給田地，再把田裡的稻米與稻草餵給牛，地區內的資源就能循環，生產者靠自給變強，作物也更能抵抗天候變化。\n我們不認為「A5・油花多」就是唯一的好。我們追求的是油花適中、餘韻悠長、瘦肉呈紅豆色、吃了還想再吃的真正美味。\n我們不只是賣肉，更想傳遞食物背後的故事，支撐生產者引以為傲的價格與未來，把永續的和牛模式從神戶推廣到全日本。這就是 NATURE KOBE 存在的理由。',
      members: {
        '碓永（神戸うすなが牧場）': { name: '碓永（神戶碓永牧場）', role: '生產・但馬牛・神戶牛', bio: '碓永牧場以兵庫縣神戶市為據點，是一家從但馬牛・神戶牛的繁殖、育成、育肥到銷售、餐飲一條龍經營的畜產集團。\n同時挑戰在神戶就能實現的循環型農業，活用自給飼料與地區未利用資源。\n以「不只是養牛，更要把牛所創造的價值送到最後」為理念，連結生產者、廚師與消費者，從神戶向世界傳遞讓所有參與者都幸福的畜產。' },
        '牛尾（株式会社エクステージ）': { name: '牛尾（Extage 株式會社）', role: '銷售・珍惜每一段緣分', bio: '在從事建築公司 Extage 工作的同時，自己也是繁殖牛的牛主，參與牧場工作，對畜產現場與牛舍設備有深入了解。透過這些經歷，他接觸到生產者的心願與畜產面臨的課題，深切體會到農業與畜產相互支撐的循環型農業的重要性。他珍視人與人之間的連結，傳遞但馬牛的魅力與 NATURE KOBE 所追求的未來，珍惜每一段緣分，致力於把食物背後的故事一併送到顧客手中。' },
        '栗原（丹匠グループ）': { name: '栗原（丹匠集團）', role: '堆肥・飼料・循環的設計', bio: '在丹波務農約十年。從牧草、堆肥到丹波栗、稻米，在不斷拓展事業的過程中，他發現一切的中心都是「土壤」。他自家也飼養 100 頭但馬牛，把牛糞變成每年約 1,000 噸堆肥，還給田地，再把田裡長出的作物餵給牛——並傾注熱情，讓這個循環在地區扎根。\n在 NATURE KOBE 負責堆肥與自給飼料的循環，連結兵庫的土壤與牛，與夥伴一起打造讓好肉與好食物持續循環的機制。' },
      },
    },
    ko: {
      tagline: '소를 키우고, 흙을 키우고, 먹거리를 키웁니다.',
      definition: 'NATURE KOBE는 일본 고베의 순환형 농업 회사입니다. 타지마규・고베규를 전하는 데서 끝나지 않고, 생명을 순환시킵니다.\n소의 분뇨를 좋은 퇴비로 만들고, 그 퇴비로 흙을 키우고, 그 흙에서 쌀과 채소를 기르고, 그 작물과 볏짚이 다시 소의 먹이가 됩니다. 이 순환 속에서 태어난 타지마규・고베규(NATURE BEEF), 쌀(NATURE RICE), 채소(NATURE LEAF)를 생산자의 마음과 함께 식탁으로 전합니다.\n우시오, 우스나가, 구리하라 세 사람이 2026년 10월 고베에서 설립했습니다.',
      why: '좋은 고기는 좋은 소에서, 좋은 소는 좋은 먹이와 좋은 흙에서 나옵니다.\n일본의 축산은 사료의 대부분을 수입에 의존해 환율과 기후 변화에 흔들리고 있습니다. 소의 분뇨는 처리할 쓰레기가 아니라 흙을 살리는 자원입니다. 이를 논밭에 돌려주고 거기서 난 쌀과 볏짚을 다시 소에게 먹이면, 지역 안에서 자원이 돌고 생산자는 자급으로 강해지며 작물은 날씨 변화에도 잘 견딥니다.\n우리는 "A5・마블링이 많은 것"만을 좋다고 보지 않습니다. 적당한 마블링과 긴 여운, 팥색의 살코기, 또 먹고 싶어지는 진짜 맛있는 고기를 추구합니다.\n그리고 그저 파는 것이 아니라 먹거리의 배경까지 전하고 싶습니다. 생산자가 자부심을 가질 수 있는 가격과 미래를 지키고, 고베에서 일본 전역으로 지속 가능한 와규 모델을 넓혀 가는 것. 그래서 NATURE KOBE가 필요합니다.',
      members: {
        '碓永（神戸うすなが牧場）': { name: '우스나가 (고베 우스나가 목장)', role: '생산 · 타지마규・고베규', bio: '우스나가 목장은 효고현 고베시를 거점으로, 타지마규・고베규의 번식・육성・비육부터 판매, 외식까지 일관되게 다루는 축산 그룹입니다.\n고베에서 할 수 있는, 자급 사료와 지역의 미활용 자원을 살린 순환형 농업에도 도전하고 있습니다.\n"소를 키우는 데 그치지 않고, 소가 낳는 가치를 끝까지 전한다"를 이념으로, 생산자・요리사・소비자를 잇고, 관계된 모든 사람이 행복해지는 축산을 고베에서 세계로 발신하고 있습니다.' },
        '牛尾（株式会社エクステージ）': { name: '우시오 (주식회사 엑스테이지)', role: '판매 · 인연을 잇는 사람', bio: '건설회사 엑스테이지에서 일하는 한편, 스스로도 번식우의 오너로서 목장에 관여하며 축산 현장과 축사 설비에 대한 이해를 깊이 해 왔습니다. 그 경험을 통해 생산자의 마음과 축산을 둘러싼 과제를 접하고, 농업과 축산이 서로를 받쳐 주는 순환형 농업의 소중함을 실감하고 있습니다. 사람과 사람의 이어짐을 소중히 하며 타지마규의 매력과 NATURE KOBE가 지향하는 미래를 전하고, 한 번 맺은 인연을 소중히 하며 먹거리의 배경까지 전하는 판매를 지향합니다.' },
        '栗原（丹匠グループ）': { name: '구리하라 (단쇼 그룹)', role: '퇴비・사료 · 순환의 설계', bio: '단바에서 농업을 시작한 지 약 10년. 목초, 퇴비, 단바 밤, 쌀로 사업을 확대해 가는 가운데, 모든 것의 한가운데에 "흙"이 있음을 깨달았습니다. 자신의 농장에서도 타지마규 100마리를 키우며, 그 분뇨를 연간 약 1,000톤의 퇴비로 바꿔 논밭에 돌려주고, 거기서 자란 작물을 다시 소에게. 이 순환을 지역에 뿌리내리게 하는 데 열정을 쏟고 있습니다.\nNATURE KOBE에서는 퇴비와 자급 사료의 순환을 담당. 효고의 흙과 소를 이어, 좋은 고기와 좋은 먹거리가 계속 순환하는 구조를 동료들과 함께 만들고 있습니다.' },
      },
    },
    fr: {
      tagline: 'Élever le bétail. Nourrir le sol. Cultiver la nourriture.',
      definition: 'NATURE KOBE est une entreprise d’agriculture circulaire de Kobe, au Japon. Nous ne nous contentons pas de livrer du bœuf de Tajima et de Kobe : nous faisons tourner le cycle du vivant.\nLe fumier des bovins devient un compost riche ; le compost nourrit le sol ; ce sol donne du riz et des légumes ; et les récoltes, avec la paille de riz, retournent nourrir les bêtes. Le bœuf de Tajima et de Kobe (NATURE BEEF), le riz (NATURE RICE) et les légumes (NATURE LEAF) nés de ce cycle arrivent sur votre table avec l’histoire de ceux qui les ont produits.\nNous trois — Ushio, Usunaga et Kurihara — avons fondé la société à Kobe en octobre 2026.',
      why: 'Un bon bœuf vient d’un bon animal, et un bon animal vient d’une bonne alimentation et d’un bon sol.\nL’élevage japonais dépend largement d’aliments importés et subit chaque variation des changes et du climat. Le fumier n’est pas un déchet à éliminer : c’est une ressource qui enrichit la terre. Rendu aux champs, puis revenu au bétail sous forme de riz et de paille, il fait tourner les ressources dans le territoire, rend les producteurs autonomes et les cultures plus résistantes aux aléas.\nNous ne pensons pas que « A5 et très persillé » soit la seule mesure de la qualité. Nous recherchons un bœuf au persillage mesuré, à la longue finale, à la chair d’un rouge profond — une viande dont on a envie de reprendre.\nEt nous ne voulons pas seulement vendre : nous voulons transmettre l’histoire derrière chaque morceau, soutenir des prix et un avenir dont les éleveurs soient fiers, et diffuser depuis Kobe un modèle de wagyu durable. C’est pour cela que NATURE KOBE existe.',
      members: {

    '神戸の風土で育つ但馬牛・神戸ビーフ。ほどよいサシと長い余韻、小豆色の赤身。「A5・サシが多い」だけを良しとせず、食べておいしく、また食べたくなるお肉を目指しています。': 'Tajima and Kobe Beef raised in the terroir of Kobe: moderate marbling, a long finish, deep-red lean meat. We do not believe A5 and heavy marbling are the only measure — we aim for beef you want to eat again.',
    '国産の餌を中心に、酒粕・おから・大豆粕・米ぬか・稲わらを配合。乳酸菌・酵母菌・納豆菌も取り入れ、季節や体調に合わせて丁寧に与えています。': 'Mostly domestic feed — sake lees, okara, soybean meal, rice bran and straw — with lactic acid bacteria, yeast and natto bacteria, adjusted carefully to the season and each animal.',
    '牛の堆肥を田んぼに還し、その土で育てたお米です。毎年しっかり土づくりを重ねることで、天候の変化に負けにくい稲が育ち、粒立ちのよい、やさしい甘みのお米になります。': 'Rice grown in paddies where cattle compost has been returned to the soil. Year after year of soil building gives rice that stands up to the weather, with distinct grains and a gentle sweetness.',
    'ご注文に合わせて精米したてをお届けします。産地は神戸・丹波・但馬など、季節によって変わりますが、その都度、単一原料米を選んでお届けします。': 'Milled to order and shipped fresh. The growing region — Kobe, Tamba or Tajima — changes with the season, but every shipment is a single-origin rice.',
    '同じ良質な堆肥で育てた野菜を「NATURE LEAF」としてお届けしていきます。但馬牛の堆肥で育てた兵庫県朝来市産の丹波黒大豆枝豆は、大粒で深いコクと甘みが特徴。冬は朝来の岩津ネギもお届けします。': 'Vegetables grown with the same rich compost, delivered as NATURE LEAF. Tamba black-soybean edamame from Asago, Hyogo, grown with Tajima cattle compost — large beans, deep and sweet. In winter we also deliver Iwatsu leeks, Asago’s famous winter leek.',

    '国産の餌を中心に、酒粕・おから・大豆粕・米ぬか・稲わらを配合。乳酸菌・酵母菌・納豆菌も取り入れ、季節や体調に合わせて丁寧に与えています。': '以国产饲料为主，配合酒粕、豆渣、大豆粕、米糠、稻草，并加入乳酸菌、酵母菌、纳豆菌，根据季节和牛的状态精心喂养。',

    'ご注文に合わせて精米したてをお届けします。産地は神戸・丹波・但馬など、季節によって変わりますが、その都度、単一原料米を選んでお届けします。': '接单后碾米，新鲜送达。产地随季节在神户、丹波、但马之间变化，每次都选用单一产地米。',

    '牛の堆肥を田んぼに還し、その土で育てたお米です。毎年しっかり土づくりを重ねることで、天候の変化に負けにくい稲が育ち、粒立ちのよい、やさしい甘みのお米になります。': 'Un riz cultivé dans des rizières où le compost des bovins retourne à la terre. Année après année, ce travail du sol donne un riz résistant aux aléas, aux grains bien détachés et à la douceur délicate.',
    'ご注文に合わせて精米したてをお届けします。産地は神戸・丹波・但馬など、季節によって変わりますが、その都度、単一原料米を選んでお届けします。': 'Poli à la commande et expédié aussitôt. L’origine — Kobe, Tamba, Tajima — varie selon la saison ; nous choisissons chaque fois un riz d’origine unique.',
    '同じ良質な堆肥で育てた野菜を「NATURE LEAF」としてお届けしていきます。但馬牛の堆肥で育てた兵庫県朝来市産の丹波黒大豆枝豆は、大粒で深いコクと甘みが特徴。冬は朝来の岩津ネギもお届けします。': 'Des légumes cultivés avec ce même compost, livrés sous le nom NATURE LEAF. Des edamame de soja noir de Tamba (Asago, Hyōgo), cultivés avec le compost de nos bovins — de gros grains, riches et doux. En hiver, nous livrons aussi le poireau d’Iwatsu, spécialité d’Asago.',

function route() {
  const q = new URLSearchParams(location.search);
  I18N.init();
  if (/^(activity|story|info)$/.test(q.get('page') || '')) return Activity.init();
  document.title = 'NATURE KOBE ご注文';
  if (q.get('e')) return Customer.init(q.get('e'));
  const hs = location.hash.slice(1);
  if (hs.startsWith('shop')) return Shop.init();
  if (hs.startsWith('admin')) return Admin.init();
  $('#app').innerHTML = `${DEMO ? '<div class="demo">プレビュー（デモデータ）</div>' : ''}<div class="brand"><div class="logo">NATURE <span>KOBE</span></div><div class="sub">但馬牛・神戸ビーフ</div></div>
  <div class="wrap"><div class="card"><h3>画面を選んでください</h3>
  ${DEMO ? `<p><a class="btn block pri" href="?e=e-demo-open">① お客さんの注文画面（QRコードの先）</a></p>` : ''}
  <p><a class="btn block" href="#admin">${DEMO ? '② ' : ''}管理画面（栗原さん・牛尾さん）</a></p>
  <p><a class="btn block" href="#shop">${DEMO ? '③ ' : ''}精肉店の発送画面</a></p>
  ${DEMO ? '<p class="hint">デモのパスワード：管理 <b>demo</b>／精肉店 <b>demo-shop</b></p>' : ''}</div></div>`;
}
window.addEventListener('hashchange', route);

/* ===================================================================
   お客さんの注文画面
   =================================================================== */
const Customer = {
  C: null,
  async init(eid) {
    $('#app').innerHTML = '<div class="loading">読み込み中…</div>';
    try {
      const r = await api('public', { e: eid });
      const draft = (() => { try { return JSON.parse(ls.get('nk-draft-' + eid) || 'null'); } catch (e) { return null; } })();
      this.C = { eid, ev: r.event, products: r.products, S: r.settings, step: 1, cart: {}, err: '', sending: false,
        info: { name: '', email: '', phone: '', zip: '', address: '', storage: '', payment: '', receipt: false, receiptTo: '', shipOn: false, shipName: '', shipPhone: '', shipZip: '', shipAddress: '', note: '', clientKey: 'c' + Date.now() + Math.random().toString(36).slice(2, 7) } };
      if (draft) { this.C.cart = draft.cart || {}; Object.assign(this.C.info, draft.info || {}); }
      Object.keys(this.C.cart).forEach(pid => { const pr = r.products.find(x => x.id === pid); if (!pr) { delete this.C.cart[pid]; return; } this.C.cart[pid].forEach(l => { if (!gOk(pr, +l.g)) l.g = gOpts(pr).find(g => g >= +l.g) || gOpts(pr).slice(-1)[0]; }); });
      this.render();
    } catch (e) {
      $('#app').innerHTML = `<div class="brand"><div class="logo">NATURE <span>KOBE</span></div></div><div class="wrap"><div class="errbox">${h(e.message)}</div></div>`;
    }
  },
  sellerLine() { const S = this.C.S; return h('販売者：' + (S.sellerName || 'NATURE KOBE') + (S.processorName ? '　加工元：' + S.processorName : '')); },
  save() { const C = this.C; ls.set('nk-draft-' + C.eid, JSON.stringify({ cart: C.cart, info: C.info })); },
  items() {
    const C = this.C, out = [];
    C.products.forEach(p => (C.cart[p.id] || []).forEach(l => { if (+l.g > 0 && +l.count > 0) out.push({ pid: p.id, p, g: +l.g, count: +l.count, amount: lineAmt(p.price, l.g, l.count) }); }));
    return out;
  },
  totals() {
    const S = this.C.S, its = this.items();
    const sub = its.reduce((a, b) => a + b.amount, 0), ship = +S.shippingFee || 0, rate = +S.taxRate || 10, srate = +S.shipTaxRate || 10;
    const taxFood = Math.floor(sub * rate / 100), taxShip = Math.floor(ship * srate / 100), tax = taxFood + taxShip;
    return { sub, ship, rate, srate, taxFood, taxShip, tax, total: sub + ship + tax, count: its.length, variable: its.some(i => i.p.variable) };
  },
  render() { this._render(); I18N.apply(); },
  _render() {
    document.body.classList.toggle('net', !!this.C.ev.net);
    const C = this.C;
    const steps = ['商品を選ぶ', 'お客様情報', '確認'];
    let body = '';
    if (C.step === 4) return this.renderDone();
    if (!C.ev.open) {
      $('#app').innerHTML = this.head() + `<div class="wrap"><div class="card" data-i18n="closed"><p class="b">このイベントのご注文受付は終了しました。</p><p class="mut sm">ご不明な点はスタッフまでお声がけください。</p></div></div>`;
      return;
    }
    if (C.step === 1) body = this.renderItems();
    if (C.step === 2) body = this.renderInfo();
    if (C.step === 3) body = this.renderConfirm();
    $('#app').innerHTML = this.head() + `<div class="wrap"><div class="steps">${steps.map((s, i) => `<div class="${i + 1 === C.step ? 'on' : i + 1 < C.step ? 'done' : ''}">${i + 1}. ${s}</div>`).join('')}</div>${body}</div>${this.bar()}`;
  },
  head() {
    const ev = this.C.ev;
    return `${DEMO ? '<div class="demo">プレビュー（デモデータ）：ここでの注文は保存されません</div>' : ''}${ev.net ? '<div class="netbar">🛒 ネット販売　※お振込みでのご注文</div>' : ''}<div class="brand"><div class="logo">NATURE <span>KOBE</span></div><div class="sub">但馬牛・神戸ビーフ ご注文</div></div>
    <div class="wrap">${langBar()}<p class="news-link"><a href="?page=info&e=${encodeURIComponent(this.C.eid)}">📰 NATURE KOBEについて</a></p><h1 class="serif">${h(ev.name)}</h1><div class="mut sm"><span>${h(jdate(ev.date))}</span>${ev.venue ? '　' + h(ev.venue) : ''}　<span>${ev.net ? 'ネットでのご注文' : 'ご参加の皆さま限定'}</span></div></div>`;
  },
  renderItems() {
    const C = this.C, cats = [];
    C.products.forEach(p => { if (!cats.includes(p.cat)) cats.push(p.cat); });
    return `<p class="sm mut" style="margin:12px 0 0" data-i18n="intro">量（g）と個数を選ぶと金額が自動で計算されます。表示価格は<b>税抜・1kgあたり</b>です。<br>お肉は<b>300g以上、100g単位</b>でお選びいただけます。</p>${parsePerks(C.ev.perks).length ? `<div class="card" style="background:var(--goldl);border-color:#e6d3a8;margin-top:10px"><div data-i18n="perks"><b>🍷 ご購入特典（税抜のお肉代の合計）</b></div><div class="sm">${parsePerks(C.ev.perks).map(p => `${yen(p.min)}以上 → ${yen(p.val)}相当のワイン`).join('<br>')}</div><div class="xs mut" data-i18n="perksNote">ワインは発送完了後、店頭でお渡しします。</div></div>` : ''}` +
      cats.map(cat => `<div class="cat"><h3>${h(cat)}</h3>${C.products.filter(p => p.cat === cat).map(p => this.prodHtml(p)).join('')}</div>`).join('') +
      `<p class="xs mut">${Customer.sellerLine()}<br>${+C.S.shippingFee ? '※送料は1回のご注文につき ' + yen(C.S.shippingFee) + '（税別）です。<br>' : ''}<span data-i18n="varNote">※<span class="var">価格変動</span>の商品は、部位・入荷状況により価格が変わる場合があります。確定額はメールでご連絡します。</span><br>※${h(C.S.deliveryNote || '')}</p>`;
  },
  prodHtml(p) {
    const lines = this.C.cart[p.id] || [];
    return `<div class="prod ${lines.length ? 'has' : ''}" id="prod-${p.id}">
      <div class="prow">${PHOTOS[p.id] ? `<img class="pimg" src="${PHOTOS[p.id]}" alt="${h(p.cat + ' ' + p.name)}" loading="lazy" onclick="showPhoto('${p.id}')">` : ''}<div class="grow"><div class="nm">${h(p.name)}${p.variable ? '<span class="var">価格変動</span>' : ''}</div><div class="pr"><b>${yen(p.price)}${p.variable ? '〜' : ''}</b> / kg（100gあたり ${yen(p.price / 10)}）</div></div>
      ${lines.length ? '' : `<button class="btn sm pri" onclick="Customer.add('${p.id}')">＋ 追加</button>`}</div>
      ${lines.map((l, i) => this.lineHtml(p, l, i)).join('')}
      ${lines.length ? `<button class="addmore" onclick="Customer.add('${p.id}')">＋ 別の量でも追加</button>` : ''}</div>`;
  },
  lineHtml(p, l, i) {
    return `<div class="line">
      <select aria-label="量" onchange="Customer.setG('${p.id}',${i},this.value)">${gOpts(p).map(g => `<option value="${g}" ${+l.g === g ? 'selected' : ''}>${gl(g)}</option>`).join('')}</select>
      <span class="mut">×</span>
      <span class="stepper"><button onclick="Customer.cnt('${p.id}',${i},-1)" aria-label="減らす">−</button><span>${l.count}</span><button onclick="Customer.cnt('${p.id}',${i},1)" aria-label="増やす">＋</button></span>
      <span class="amt num" id="amt-${p.id}-${i}">${yen(lineAmt(p.price, l.g, l.count))}</span>
      <button class="del" onclick="Customer.del('${p.id}',${i})">削除</button></div>`;
  },
  rerenderProd(pid) {
    const p = this.C.products.find(x => x.id === pid);
    const el = document.getElementById('prod-' + pid);
    if (el) el.outerHTML = this.prodHtml(p);
    this.updateBar(); this.save();
  },
  add(pid) { const C = this.C, p = C.products.find(x => x.id === pid); (C.cart[pid] = C.cart[pid] || []).push({ g: isCut(p) ? 600 : 300, count: 1 }); this.rerenderProd(pid); },
  del(pid, i) { const C = this.C; C.cart[pid].splice(i, 1); if (!C.cart[pid].length) delete C.cart[pid]; this.rerenderProd(pid); },
  setG(pid, i, v) { const l = this.C.cart[pid][i]; if (v === 'custom') { l.custom = true; } else { l.custom = false; l.g = +v; } this.rerenderProd(pid); },
  setCustomG(pid, i, v) {
    const l = this.C.cart[pid][i], p = this.C.products.find(x => x.id === pid);
    l.g = Math.max(0, Math.round(+v || 0)); l.custom = true;
    const a = document.getElementById(`amt-${pid}-${i}`); if (a) a.textContent = yen(lineAmt(p.price, l.g, l.count));
    this.updateBar(); this.save();
  },
  cnt(pid, i, d) { const l = this.C.cart[pid][i]; l.count = Math.max(1, Math.min(99, l.count + d)); this.rerenderProd(pid); },
  bar() {
    const C = this.C, t = this.totals();
    const next = C.step === 1 ? `<button class="btn pri" id="nextbtn" onclick="Customer.go(2)" ${t.count ? '' : 'disabled'}>次へ</button>`
      : C.step === 2 ? `<button class="btn" onclick="Customer.go(1)">戻る</button><button class="btn pri" onclick="Customer.toConfirm()">確認へ</button>`
        : `<button class="btn" onclick="Customer.go(2)">戻る</button><button class="btn gold" id="sendbtn" onclick="Customer.submit()" ${C.sending ? 'disabled' : ''}>${C.sending ? '送信中…' : '注文する'}</button>`;
    return `<div class="bar" id="bar"><div class="wrap in2"><div class="grow"><div class="xs mut" id="bar-sub">${t.count ? `${t.count}点　税抜 ${yen(t.sub)}${t.ship ? '＋送料 ' + yen(t.ship) : ''}` : '商品を選んでください'}</div><div class="tot num" id="bar-tot">${yen(t.total)}<small> 税込</small></div><div class="xs" id="bar-perk" style="color:var(--amb)">${t.count ? perkText(parsePerks(C.ev.perks), t.sub) : ''}</div></div>${next}</div></div>`;
  },
  updateBar() {
    const t = this.totals();
    const s = $('#bar-sub'), tt = $('#bar-tot'), nb = $('#nextbtn');
    if (s) s.textContent = t.count ? `${t.count}点　税抜 ${yen(t.sub)}${t.ship ? '＋送料 ' + yen(t.ship) : ''}` : '商品を選んでください';
    if (tt) tt.innerHTML = `${yen(t.total)}<small> 税込</small>`;
    const pk = $('#bar-perk'); if (pk) pk.textContent = t.count ? perkText(parsePerks(this.C.ev.perks), t.sub) : '';
    if (nb) nb.disabled = !t.count;
    I18N.apply();
  },
  go(step) {
    if (step === 2 && this.items().some(i => !gOk(i.p, i.g))) { toast('お肉は100g単位（300g以上）で選んでください', true); return; }

const CARRIERS = ['ヤマト運輸', '佐川急便', '日本郵便', 'その他'];
function trackUrl(carrier, no) {
  const n = String(no || '').replace(/[^0-9A-Za-z]/g, '');
  if (!n) return '';
  if (carrier === 'ヤマト運輸') return 'https://jizen.kuronekoyamato.co.jp/jizen/servlet/crjz.b.NQ0010?id=' + n;
  if (carrier === '佐川急便') return 'https://k2k.sagawa-exp.co.jp/p/web/okurijosearch.do?okurijoNo=' + n;
  if (carrier === '日本郵便') return 'https://trackings.post.japanpost.jp/services/srv/search/direct?reqCodeNo1=' + n + '&locale=ja';
  return '';
}
function aggregate(orders) {
  const m = {};
  orders.forEach(o => (o.items || []).forEach(i => {
    const k = i.name; m[k] = m[k] || { name: k, total: 0, packs: {} };
    m[k].total += i.g * i.count; m[k].packs[i.g] = (m[k].packs[i.g] || 0) + i.count;
  }));
  return Object.values(m).map(x => Object.assign(x, { packStr: Object.keys(x.packs).sort((a, b) => a - b).map(g => `${gl(g)}×${x.packs[g]}`).join('、') }));
}
function aggTable(orders) {
  const a = aggregate(orders);
  const ex = []; orders.forEach(o => (o.extras || []).forEach(x => ex.push(x.name + '（' + o.name + '様）')));
  return `<table class="agg"><tr><th>商品</th><th>パック内訳</th><th class="right">合計</th></tr>${a.map(x => `<tr><td>${h(x.name)}</td><td>${h(x.packStr)}</td><td class="n">${gl(x.total)}</td></tr>`).join('')}</table>${ex.length ? `<p class="sm">その他：${h(ex.join('／'))}</p>` : ''}`;
}
function shipName(o) { return o.shipTo && o.shipTo.on ? (o.shipTo.name || '（お名前未記入）') : o.name; }
function shipAddr(o) { return o.shipTo && o.shipTo.on ? `〒${o.shipTo.zip || ''} ${o.shipTo.address || ''}` : `〒${o.zip || '（未記入）'} ${o.address || ''}`; }
function shipTel(o) { return o.shipTo && o.shipTo.on ? (o.shipTo.phone || o.phone) : o.phone; }

  copyBack(id) {

  /* ---- 商品・設定 ---- */

        <td style="width:120px;white-space:nowrap" class="num">${COST_PER_KG[(p.cat || '') + ' ' + (p.name || '')] != null ? yen(COST_PER_KG[(p.cat || '') + ' ' + (p.name || '')]) : '—'}</td>
        <td style="width:80px;text-align:center"><input type="checkbox" style="width:20px;height:20px;min-height:0" ${p.variable ? 'checked' : ''} onchange="Admin._P[${i}].variable=this.checked"></td><td style="width:70px;text-align:center"><input type="checkbox" style="width:20px;height:20px;min-height:0" ${p.active !== false ? 'checked' : ''} onchange="Admin._P[${i}].active=this.checked"></td>
        <td style="width:96px;white-space:nowrap"><button class="x" onclick="Admin.mvP(${i},-1)">↑</button><button class="x" onclick="Admin.mvP(${i},1)">↓</button></td></tr>`).join('')}</table></div>

      ${sf('sellerName', '販売者名（領収書・メールに表示）')}${sf('sellerAddress', '販売者の住所（領収書に表示）')}

/* ===================================================================
   精肉店の発送画面
   =================================================================== */
const Shop = {
  D: null,
  pass() { return ls.get('nk-shop-pass') || ''; },
  async init() {
    if (!this.pass()) return this.login();
    $('#app').innerHTML = brandBar('発送管理') + '<div class="loading">読み込み中…</div>';
    try {
      const r = await api('shop', { pass: this.pass() });
      this.D = Object.assign(this.D || { f: '未発送', ev: 'all' }, { orders: r.orders, events: r.events, settings: r.settings || {} });
      this.render();
    } catch (e) { ls.del('nk-shop-pass'); this.login(e.message); }
  },
  login(err) {
    $('#app').innerHTML = brandBar('発送管理') + `<div class="wrap" style="max-width:420px"><div class="card"><h3>精肉店用ログイン</h3>
      ${err ? `<div class="errbox">${h(err)}</div>` : ''}<label class="f">パスワード</label><input class="in" id="pw" type="password" onkeydown="if(event.key==='Enter')Shop.doLogin()">
      <p><button class="btn pri block" onclick="Shop.doLogin()">ログイン</button></p>${DEMO ? '<p class="hint">デモのパスワード：demo-shop（先に管理画面で「発注済」にした注文が表示されます）</p>' : ''}</div></div>`;
  },
  doLogin() { ls.set('nk-shop-pass', $('#pw').value.trim()); this.init(); },
  render() {
    const D = this.D;
    const inEv = D.orders.filter(o => D.ev === 'all' || o.eventId === D.ev);
    const pending = inEv.filter(o => o.status === '発注済');
    const list = inEv.filter(o => D.f === 'すべて' || (D.f === '未発送' ? o.status === '発注済' : o.status === '発送済')).sort((a, b) => a.id < b.id ? -1 : 1);
    const evName = id => (D.events.find(e => e.id === id) || {}).name || '';
    $('#app').innerHTML = brandBar('発送管理' + (D.settings.shopName ? '（' + D.settings.shopName + '）' : ''), `<button class="btn sm" onclick="Shop.init()">更新</button>`) + `
    <div class="wrap wide">
      <div class="filters"><select onchange="Shop.D.ev=this.value;Shop.render()"><option value="all">すべてのイベント</option>${D.events.map(e => `<option value="${h(e.id)}" ${D.ev === e.id ? 'selected' : ''}>${h(e.date)} ${h(e.name)}</option>`).join('')}</select></div>
      <div class="chips" style="margin-top:8px">${['未発送', '発送済', 'すべて'].map(f => `<button class="${D.f === f ? 'on' : ''}" onclick="Shop.D.f='${f}';Shop.render()">${f} ${f === '未発送' ? pending.length : f === '発送済' ? inEv.length - pending.length : inEv.length}</button>`).join('')}</div>
      ${pending.length ? `<details class="card" ${D.f === '未発送' ? 'open' : ''}><summary class="b" style="cursor:pointer">未発送の合計（${pending.length}件）</summary>${aggTable(pending)}</details>` : ''}
      <p class="sm mut">発送したら「発送日」と「伝票番号」を入れて「発送完了」を押してください。確認画面のあと、お客様に発送のお知らせメールが届きます。</p>
      ${list.length ? list.map(o => this.card(o, evName(o.eventId))).join('') : '<p class="mut">該当する注文はありません</p>'}
    </div>`;
  },
  card(o, evn) {
    return `<div class="card" id="sc-${o.id}"><div class="row wrapf"><b style="font-size:17px">${h(shipName(o))} 様</b><span class="store ${o.storage || 'none'}">${h(o.storage || '保存状態 未定')}</span><span class="chip c-${o.status}">${o.status === '発注済' ? '未発送' : '発送済'}</span>${o.shipMailSent ? '<span class="chip c-paid">発送メール送信済</span>' : ''}</div>
      <div class="xs mut">${h(o.id)}　${h(evn)}${o.shipTo && o.shipTo.on ? `　（ご注文者：${h(o.name)} 様）` : ''}</div>
      <div style="margin:8px 0" class="sm">${h(shipAddr(o))}<br>TEL ${h(shipTel(o) || '（なし）')}</div>
      <table class="agg">${o.items.map(i => `<tr><td>${h(i.name)}${i.note ? `<div class="xs mut">${h(i.note)}</div>` : ''}</td><td class="n">${gl(i.g)} × ${i.count}</td></tr>`).join('')}${(o.extras || []).map(x => `<tr><td colspan="2">${h(x.name)}</td></tr>`).join('')}</table>
      ${o.note ? `<div class="warnbox">備考：${h(o.note)}</div>` : ''}
      <div class="g2" style="margin-top:6px"><div><label class="f">発送日</label><input class="in" type="date" id="sd-${o.id}" value="${h(o.shipDate)}"></div>
      <div><label class="f">配送業者</label><select class="in" id="sca-${o.id}">${CARRIERS.map(c => `<option ${(o.carrier || 'ヤマト運輸') === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div></div>
      <label class="f">伝票番号</label><input class="in" id="st-${o.id}" inputmode="numeric" value="${h(o.tracking)}" placeholder="例）1234-5678-9012">
      <p><button class="btn ${o.status === '発送済' ? '' : 'pri'} block" onclick="Shop.save('${o.id}')">${o.status === '発送済' ? '修正して保存' : '発送完了'}</button></p>
      ${o.status === '発送済' && o.hasEmail && !o.shipMailSent ? `<p><button class="btn gold block" onclick="Shop.mail('${o.id}')">お客様に発送メールを送る</button></p>` : ''}
      ${!o.hasEmail ? '<p class="xs mut">この注文はメールアドレスがないため、お客様への連絡はNATURE KOBEから行います。</p>' : ''}</div>`;
  },
  mail(id) { mailFlow({ pass: this.pass(), id, kind: 'ship', onSent: o => { const i = this.D.orders.findIndex(x => x.id === id); this.D.orders[i] = o; this.render(); } }); },
  async save(id) {
    const shipDate = $('#sd-' + id).value, carrier = $('#sca-' + id).value, tracking = $('#st-' + id).value.trim();
    if (!shipDate || !tracking) { toast('発送日と伝票番号を入力してください', true); return; }
    try {
      const r = await api('shopUpdate', { pass: this.pass(), id, shipDate, carrier, tracking });
      const i = this.D.orders.findIndex(o => o.id === id); this.D.orders[i] = r.order;
      toast('保存しました'); this.render();
      if (r.order.hasEmail && !r.order.shipMailSent) this.mail(id);
    } catch (e) { toast(e.message, true); }
  }
};

route();
</script>
</body>
</html>
