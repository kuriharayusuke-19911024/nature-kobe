<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>うすなが牧場 卸台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
/* 冷蔵庫の鋼板のような冷たい灰色の地に、赤身の色をひとつだけ。上にタブ、中は一覧→詳細はシートで開く */
:root{
  --bg:#eef0f2; --surface:#ffffff; --sunk:#f6f7f8; --ink:#1c2128; --sub:#5d6670; --line:#d9dde2;
  --accent:#9e1b32; --accent-soft:#f6e3e6; --on-accent:#ffffff;
  --ok:#2e7149; --ok-soft:#e1f0e6; --warn:#9a5b00; --warn-soft:#fbeed6; --info:#2c5a87; --info-soft:#e2ecf6;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171b; --surface:#1d2127; --sunk:#181b20; --ink:#e7e9ec; --sub:#9aa2ac; --line:#2e343c;
  --accent:#e2576c; --accent-soft:#3a1d23; --on-accent:#1a0a0d;
  --ok:#62c08a; --ok-soft:#1c3226; --warn:#e3a54a; --warn-soft:#3a2c14; --info:#7eaedb; --info-soft:#1b2a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b; --surface:#1d2127; --sunk:#181b20; --ink:#e7e9ec; --sub:#9aa2ac; --line:#2e343c;
  --accent:#e2576c; --accent-soft:#3a1d23; --on-accent:#1a0a0d;
  --ok:#62c08a; --ok-soft:#1c3226; --warn:#e3a54a; --warn-soft:#3a2c14; --info:#7eaedb; --info-soft:#1b2a3a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font:700 20px/1.2 var(--f-display);margin:0;letter-spacing:.02em}
.brand .co{color:var(--sub);font-size:13px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;color:var(--sub);font:700 14px var(--f-body);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
h2{font:700 18px/1.3 var(--f-display);margin:0}
h3{font:700 15px/1.4 var(--f-body);margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px var(--f-body);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--sub)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--sub)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:700 13px var(--f-body);color:var(--sub);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-new{background:var(--warn-soft);color:var(--warn)}
.st-alloc{background:var(--info-soft);color:var(--info)}
.st-shipped{background:var(--ok-soft);color:var(--ok)}
.st-cancel{background:var(--sunk);color:var(--sub)}
.st-exp{background:var(--accent-soft);color:var(--accent)}
.st-in{background:var(--ok-soft);color:var(--ok)}
.st-reserved{background:var(--info-soft);color:var(--info)}
.st-out{background:var(--sunk);color:var(--sub)}
.sh{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--line)}
.sh-in{background:#fff;color:#333}.sh-sold{background:#ffff00;color:#333;border-color:#d4d400}.sh-partial{background:#ff9900;color:#222;border-color:#d97f00}
.sh-done{background:#666;color:#fff;border-color:#555}.sh-other{background:repeating-linear-gradient(45deg,#e6f7ff,#e6f7ff 4px,#cfe9ff 4px,#cfe9ff 8px);color:#124;border-color:#9cc}
tr.row-done td{color:var(--sub)}
.nextstep{display:inline-block;font-size:12px;font-weight:700;color:var(--accent)}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0}
.flow li{list-style:none;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--sub)}
.flow li.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.flow li.now{border-color:var(--accent);color:var(--accent);font-weight:700}
.certgrid{display:grid;gap:8px}
.certrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tablewrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--sub);font-weight:700;white-space:nowrap}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.muted{color:var(--sub);font-size:13px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--sub);text-align:center;font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font:500 20px var(--f-num);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.steps{display:grid;gap:8px;counter-reset:s}
.steps li{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--f-num);background:var(--sunk);color:var(--sub);flex:none}
.steps li.done::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.steps li span{flex:1;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub);font-weight:700;min-width:0}
input,select,textarea{font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input.num{text-align:right}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.ordercard{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.ordercard:hover{border-color:var(--sub)}
.ordercard .no{font:500 13px var(--f-num);color:var(--sub)}
.ordercard .who{font-weight:700;font-size:16px;min-width:0}
.ordercard .amt{font:500 16px var(--f-num);text-align:right}
.ordercard .sub{grid-column:1/-1;color:var(--sub);font-size:13px}
.lot{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.lothead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.lothead b{font:700 16px var(--f-num)}
.lothead .m{font-size:13px;color:var(--sub)}
.bar{height:8px;border-radius:4px;background:var(--accent);opacity:.8}
/* sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:14px;width:min(820px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,12,15,.45)}
.sh{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.shhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.shbody{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.shfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.line{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pick label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;cursor:pointer}
.pick input{width:auto}
.totals{display:grid;grid-template-columns:1fr auto;gap:2px 16px;justify-content:end;font-size:14px;margin-left:auto;min-width:240px}
.totals .num{text-align:right}
.totals .big{font-size:18px;font-weight:700}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:50}
.docprev{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:auto;max-height:55vh}
@media (max-width:560px){ .ordercard{grid-template-columns:1fr auto} .ordercard .no{grid-column:1/-1} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<header class="top"><div class="topin">
  <div class="brand"><h1>卸台帳</h1><span class="co" id="coName"></span><span class="muted" id="conn">読み込み中…</span></div>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-t="orders" aria-selected="true">受注・出荷</button>
    <button role="tab" data-t="stock">在庫</button>
    <button role="tab" data-t="certs">証明書</button>
    <button role="tab" data-t="customers">取引先</button>
    <button role="tab" data-t="billing">請求</button>
    <button role="tab" data-t="analysis">分析</button>
    <button role="tab" data-t="settings">設定</button>
  </nav>
</div></header>
<main id="main"><div class="empty">データを読み込んでいます。</div></main>
<dialog id="sheet"><div class="sh" id="sheetIn"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== 状態 ===================== */
const S = {parts:[], lots:[], stock:[], customers:[], agents:[], orders:[], settings:{}};
const COLS = ['parts','lots','stock','customers','agents','orders'];
const V = {tab:'orders', ofilter:'open', month: ymNow(), loaded:false};
let sample = null, readOnly = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yen = n => '¥' + Math.round(n || 0).toLocaleString('ja-JP');
const kgf = n => (Math.round((n || 0) * 100) / 100).toLocaleString('ja-JP', {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = n => isFinite(n) ? (Math.round(n * 1000) / 10).toFixed(1) + '%' : '—';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function ymNow(){ return today().slice(0,7); }
function ymShift(ym, k){ let [y,m] = ym.split('-').map(Number); m += k; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return y + '-' + String(m).padStart(2,'0'); }
const jdate = d => d ? d.replace(/^(\d{4})-(\d{2})-(\d{2})$/, (_,y,m,dd)=>`${+m}/${+dd}`) : '—';
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(()=> t.hidden = true, 2600); }

const byId = (c, id) => S[c].find(x => x.id === id);
const partName = id => byId('parts', id)?.name || '（部位未設定）';
const custName = id => byId('customers', id)?.name || '（取引先なし）';
const taxRate = () => (S.settings.taxRate ?? 8) / 100;
const STATUS = {new:'受注', alloc:'引当済', shipped:'出荷済', cancel:'取消'};
const SSTATUS = {in:'在庫', reserved:'引当中', out:'出荷済'};

/* ===================== 計算 ===================== */
function lotTotalKg(lotId){ return S.stock.filter(s => s.lotId === lotId).reduce((a,s)=>a + (+s.kg||0), 0); }
function expDate(t){ const m = String(t||'').match(/(\d{1,2})\/(\d{1,2})/); if(!m) return null;
  const now = new Date(); let d = new Date(now.getFullYear(), +m[1]-1, +m[2]); if(d - now < -90*864e5) d = new Date(now.getFullYear()+1, +m[1]-1, +m[2]); return d; }
function daysLeft(t){ const d = expDate(t); if(!d) return null; const n = new Date(); n.setHours(0,0,0,0); return Math.round((d - n) / 864e5); }
function expPill(t){ const k = daysLeft(t); if(k == null) return ''; return k < 0 ? `<span class="pill st-exp">期限切れ ${esc(t)}</span>` : k <= 7 ? `<span class="pill st-new">期限 ${esc(t)}（あと${k}日）</span>` : `<span class="muted">期限 ${esc(t)}</span>`; }
function stockCostKg(s){ return s && s.costKg != null && s.costKg !== '' ? +s.costKg : lotCostPerKg(s?.lotId); }
function lotCostPerKg(lotId){ const l = byId('lots', lotId); const t = lotTotalKg(lotId); return l && t > 0 ? (+l.cost||0) / t : 0; }
function lineCalc(line){
  const items = (line.stockIds||[]).map(id => byId('stock', id)).filter(Boolean);
  const kg = items.reduce((a,s)=>a + (+s.kg||0), 0);
  const amount = Math.round(kg * (+line.price||0));
  const cost = items.reduce((a,s)=>a + (+s.kg||0) * stockCostKg(s), 0);
  return {items, kg, amount, cost};
}
function orderCalc(o){
  let kg=0, sub=0, cost=0, qty=0;
  (o.lines||[]).forEach(l => { const c = lineCalc(l); kg += c.kg; sub += c.amount; cost += c.cost; qty += (+l.qty||0); });
  const disc = Math.round(+o.disc || 0);
  const net = sub - disc;
  const tax = Math.floor(net * taxRate());
  return {kg, sub, disc, net, tax, total: net + tax, cost, gp: net - cost, qty};
}
function suggestDisc(o){
  const c = byId('customers', o.customerId); if(!c || !c.discQty || !c.discYen) return 0;
  const qty = (o.lines||[]).reduce((a,l)=>a + (+l.qty||0), 0);
  return qty > +c.discQty ? qty * (+c.discYen) : 0;
}
function nextOrderNo(date){
  const pre = (date||today()).replace(/-/g,'').slice(2);
  const n = S.orders.filter(o => (o.no||'').startsWith(pre)).length + 1;
  return pre + '-' + String(n).padStart(2,'0');
}
function nextLotNo(){ return S.lots.reduce((a,l)=>Math.max(a, +l.no||0), 0) + 1; }

/* ===================== 保存（端末内＋Googleスプレッドシート） ===================== */
const SS_URL = 'https://script.google.com/macros/s/AKfycbyI1zRrzoJLlQqpqQwqFp95Sp5PQti_DhGvx6-k8s7MuhbPc1GSaEBC5Vcshn3m7qnYyQ/exec';
const LS_DATA = 'usunaga-oroshi-data-v1', LS_CFG = 'usunaga-oroshi-cfg', LS_Q = 'usunaga-oroshi-queue';
const ALL = [...COLS, 'config'];
const Store = { data: {}, cfg: {url:'', pass:''}, queue: [], online: null, lastPull: 0 };
ALL.forEach(c => Store.data[c] = {});
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(_){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }
function rebuild(){
  COLS.forEach(c => S[c] = Object.values(Store.data[c]).filter(d => !d._d));
  const st = Store.data.config.settings; S.settings = st && !st._d ? st : {};
}
function saveLocal(){ lsSet(LS_DATA, Store.data); lsSet(LS_Q, Store.queue); }
function syncLabel(){
  const el = $('#conn'); if(!el) return;
  if(!Store.cfg.url || !Store.cfg.pass) el.innerHTML = 'この端末だけに保存中（<a href="javascript:void 0" onclick="go(\'settings\')">設定で合言葉を入れると全員で共有できます</a>）';
  else if(Store.queue.length) el.textContent = `未送信 ${Store.queue.length}件（通信が戻ると自動で送ります）`;
  else if(Store.online === false) el.textContent = '保存先につながりません';
  else el.textContent = '';
}
async function gas(body){
  const r = await fetch(Store.cfg.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...body, pass: Store.cfg.pass})});
  const j = await r.json(); if(!j.ok) throw new Error(j.error || 'error'); return j;
}
async function flush(){
  if(!Store.cfg.url || !Store.cfg.pass || !Store.queue.length || flush.busy) return;
  flush.busy = true;
  try{
    while(Store.queue.length){
      const batch = Store.queue.slice(0, 50);
      await gas({op:'put', docs: batch});
      Store.queue.splice(0, batch.length); saveLocal();
    }
    Store.online = true;
  }catch(e){ Store.online = false; if(String(e.message).includes('pass')) toast('合言葉が違います。設定を確認してください'); }
  flush.busy = false; syncLabel();
}
async function pull(){
  if(!Store.cfg.url || !Store.cfg.pass) return;
  try{
    const j = await gas({op:'get'});
    let changed = false;
    (j.docs || []).forEach(x => {
      if(!Store.data[x.col]) return;
      const cur = Store.data[x.col][x.id];
      if(!cur || (x.doc._u || 0) > (cur._u || 0)){
        if(Store.queue.some(q => q.col === x.col && q.id === x.id)) return;
        Store.data[x.col][x.id] = x.doc; changed = true;
      }
    });
    Store.online = true;
    if(changed){ saveLocal(); rebuild(); render(); }
  }catch(e){ Store.online = false; }
  syncLabel();
}
function writeDoc(c, doc){
  doc._u = Date.now();
  Store.data[c][doc.id] = doc;
  Store.queue = Store.queue.filter(q => !(q.col === c && q.id === doc.id));
  Store.queue.push({col: c, id: doc.id, doc});
  saveLocal(); rebuild(); syncLabel(); flush();
}
async function put(c, obj){ writeDoc(c, structuredClone(obj)); }
async function patch(c, id, obj){ const cur = Store.data[c][id] || {id}; writeDoc(c, {...structuredClone(cur), ...structuredClone(obj)}); }
async function del(c, id){ writeDoc(c, {id, _d: 1}); }

/* 在庫管理表（梅本さんのスプレッドシート）を、枝番×部位の在庫に変換する */
function ssNum(v){ v = String(v ?? '').replace(/[¥,円\s]/g, '').replace(/kg$/i, ''); if(v === '' || v === '-' ) return null; const n = Number(v); return isFinite(n) ? n : null; }
function ssClean(v){ return String(v ?? '').replace(/\s+/g, ' ').trim(); }
function ssIsPart(name){ name = ssClean(name); return !!name && name !== '部位' && !/^[\d.,¥%#\-]+$/.test(name) && !/^【/.test(name); }
/* 1頭分を縦に並べた形（【チルド】但馬・神戸） */
function ssParseBlocks(sheet, R){
  const out = []; let cur = null, group = '';
  const LABELS = ['格付', '認定', '血統', '枝重量', '枝単価', '枝価格', '正肉重量', '歩留', 'セット単価', '単品'];
  for(let i = 0; i < R.length; i++){
    const r = R[i].map(x => String(x ?? ''));
    const c0 = ssClean(r[0]), part = ssClean(r[2]);
    if(/^【/.test(c0)){ group = c0; cur = null; continue; }
    if(c0 && ssIsPart(part) && !/^枝番|^在庫管理表/.test(c0)){
      const ed = c0.split(/[\n ]/)[0].replace(/[（(].*$/, '').trim() || c0;
      cur = { sheet, kind: 'チルド', group, edaban: ed, edabanRaw: c0, info: {}, rows: [], exp: '', month: '' };
      out.push(cur);
      const m = ssClean(r[12]).match(/(\d{1,2})\/(\d{1,2})/); cur.exp = m ? m[0] : ssClean(r[12]).replace(/^期限：?/, '');
      cur.month = ssClean(r[13]);
    }
    if(!cur) continue;
    if(!part){ cur = null; continue; }            // 合計の行・空行でその頭は終わり
    if(!ssIsPart(part)) continue;
    // 左の列のラベルと値（「枝重量」の次の行が値）
    const lab = ssClean(r[1]); const nxt = ssClean((R[i + 1] || [])[1]);
    if(LABELS.includes(lab) && nxt && !LABELS.includes(nxt)) cur.info[lab] = nxt;
    const L = ssNum(r[3]), Rr = ssNum(r[4]), tot = ssNum(r[5]), stock = ssNum(r[6]), cost = ssNum(r[7]);
    cur.rows.push({ part, left: L, right: Rr, total: tot, kg: stock != null ? stock : (tot != null ? tot : (L || 0) + (Rr || 0)), costKg: cost, note: ssClean(r[14]), ri: i, cL: 3, cR: 4, cS: 6 });
  }
  return out.map(b => ({ ...b, grade: b.info['格付'] && b.info['格付'] !== '単品' ? b.info['格付'] : '', cert: b.info['認定'] || '', blood: b.info['血統'] || '', carcassKg: ssNum(b.info['枝重量']), unitPrice: ssNum(b.info['枝単価']) }));
}
/* 1行1品の形（【冷凍】） — 表が横に2つ並ぶこともある */
function ssHeadIdx(R){ for(let i = 0; i < Math.min(8, R.length); i++){ if((R[i] || []).some(x => ssClean(x) === '部位')) return i; } return 0; }
function ssParseRows(sheet, R){
  const out = []; const hi = ssHeadIdx(R); const head = (R[hi] || []).map(ssClean);
  const offs = []; head.forEach((h, j) => { if(h === '部位' && j >= 2) offs.push(j - 2); });
  if(!offs.length) offs.push(0);
  offs.forEach(o => {
    const noteCol = head.findIndex((h, j) => j > o + 4 && h === '備考' && (offs.find(x => x > o) ?? 1e9) > j);
    let ed = '', group = ssClean(head[o]).replace(/^枝番\s*/, '');
    const byEd = {};
    for(let i = hi + 1; i < R.length; i++){
      const r = R[i].map(x => String(x ?? ''));
      const c0 = ssClean(r[o]), part = ssClean(r[o + 2]);
      if(/^【/.test(c0)){ group = c0; ed = ''; continue; }
      if(c0 === '枝番'){ ed = ''; continue; }
      if(!ssIsPart(part)) continue;
      if(c0) ed = c0;
      const L = ssNum(r[o + 3]), Rr = ssNum(r[o + 4]), cost = ssNum(r[o + 5]);
      const kg = (L || 0) + (Rr || 0); if(!(kg > 0)) continue;
      const key = (ed || '（枝番なし）') + '|' + group;
      const b = byEd[key] ||= { sheet, kind: '冷凍', edaban: ed || '（枝番なし）', edabanRaw: ed, group, breed: ssClean(r[o + 1]), info: {}, rows: [], exp: '', month: '' };
      if(!byEd[key]._pushed){ out.push(b); b._pushed = true; }
      b.rows.push({ part, left: L, right: Rr, total: kg, kg, costKg: cost, note: noteCol > 0 && ssNum(r[noteCol]) == null ? ssClean(r[noteCol]) : '', ri: i, cL: o + 3, cR: o + 4, cS: o + 3 });
    }
  });
  return out.map(({ _pushed, ...b }) => b);
}
function ssParseAll(sheets){
  const lots = [];
  Object.entries(sheets || {}).forEach(([name, R]) => {
    if(!R || !R.length) return;
    const head = (R[ssHeadIdx(R)] || []).map(ssClean).join('|');
    const blocks = /格付/.test(head) && /血統/.test(head) ? ssParseBlocks(name, R) : ssParseRows(name, R);
    blocks.forEach(b => lots.push(b));
  });
  return lots;
}

/* 在庫表の色：白＝在庫、黄＝売約、オレンジ＝一部売約、グレー＝納品済（梅本さんの決まり） */
const SHEET_ST = {in:'在庫（白）', sold:'売約（黄）', partial:'一部売約（橙）', done:'納品済（灰）', other:'色を確認'};
function ssColorSt(hex){
  if(!hex) return 'in';
  const m = String(hex).match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i); if(!m) return 'in';
  const [r, g, b] = [m[1], m[2], m[3]].map(x => parseInt(x, 16));
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  if(mx - mn <= 20) return mx >= 235 ? 'in' : 'done';          // 白っぽい＝在庫、灰色〜黒＝納品済
  if(r >= 200 && g >= 200 && b <= 140) return 'sold';         // 黄色
  if(r >= 200 && g >= 90 && g < 200 && b <= 120) return 'partial'; // オレンジ
  return 'other';                                             // 水色・青など（意味を確認中）
}
const shPill = st => st ? `<span class="sh sh-${st}">${SHEET_ST[st] || st}</span>` : '';
/* 引き当てに使える在庫か（アプリで空き、かつ在庫表で白かオレンジ） */
const isAvail = s => s.status === 'in' && (!s.sheetSt || s.sheetSt === 'in' || s.sheetSt === 'partial');
/* 在庫表として読むシート（「枝単価〇円」などの計算用シートは読まない） */
const SS_OK = n => ['但馬・神戸', '冷凍・神戸', '冷凍・和牛'].includes(n) || (/冷凍|チルド/.test(n) && !/枝単価|加工賃|リスト/.test(n));

function ssHash(t){ let h = 2166136261; for(let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const r2 = n => n == null ? null : Math.round(n * 100) / 100;
const ssInfo = () => (Store.data.config.sheetsync && !Store.data.config.sheetsync._d) ? Store.data.config.sheetsync : null;
async function ssSync(quiet){
  if(ssSync.busy) return; if(readOnly) return;
  if(!Store.cfg.pass){ if(!quiet) toast('先に設定で合言葉を入れてください'); return; }
  ssSync.busy = true; const btn = document.getElementById('ssBtn'); if(btn){ btn.disabled = true; btn.textContent = '読み込み中…'; }
  try{
    const r = await fetch(SS_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({op:'srcsheet', pass: Store.cfg.pass})});
    const j = await r.json(); if(!j.ok) throw new Error(j.error || 'error');
    const sheets = {}; Object.entries(j.sheets || {}).forEach(([n, R]) => { if(SS_OK(n)) sheets[n] = R; });
    const res = ssApply(ssParseAll(sheets), j.bgs || {});
    await put('config', {id:'sheetsync', at: Date.now(), name: j.name || '', ...res});
    if(!quiet || res.add || res.upd || res.del) toast(`在庫表を読み込みました（追加 ${res.add}・更新 ${res.upd}・削除 ${res.del}）`);
  }catch(e){ if(!quiet) toast(String(e.message).includes('pass') ? '合言葉が違います' : '在庫表を読み込めませんでした。通信を確認してください'); }
  ssSync.busy = false; render();
}
function ssApply(blocks, bgs){
  bgs = bgs || {};
  let add = 0, upd = 0, del_ = 0, k = S.parts.reduce((a,p)=>Math.max(a,p.sort??0),0);
  const partId = name => { let p = S.parts.find(x => x.name === name); if(!p){ p = {id: uid(), name, sort: ++k}; writeDoc('parts', structuredClone(p)); } return p.id; };
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const seenLot = new Set(), seenStock = new Set();
  blocks.forEach(b => {
    const key = b.sheet + '|' + (b.group || '') + '|' + b.edaban;
    const lotId = 'ss_' + ssHash(key); seenLot.add(lotId);
    const cur = byId('lots', lotId);
    const cnt = {}; let costSum = 0, kgSum = 0;
    const colorAt = (ri, c) => (bgs[b.sheet] || {})[ri + ',' + c] || '';
    b.rows.forEach(row => {
      const n = cnt[row.part] = (cnt[row.part] || 0) + 1;
      const base = key + '|' + row.part + '#' + n;
      const costKg = row.costKg;
      // 左右に分ける（左右の重量が無い行は1つのまま）
      const sides = [];
      if(row.left > 0) sides.push({side: 'L', kg: row.left, color: colorAt(row.ri, row.cL)});
      if(row.right > 0) sides.push({side: 'R', kg: row.right, color: colorAt(row.ri, row.cR)});
      if(!sides.length && row.kg > 0) sides.push({side: '', kg: row.kg, color: colorAt(row.ri, row.cS)});
      sides.forEach(sd => {
        const sk = base + (sd.side ? '|' + sd.side : ''); seenStock.add(sk);
        const kg = r2(sd.kg) || 0, sheetSt = ssColorSt(sd.color), color = sd.color || '';
        const mine = S.stock.filter(x => x.ssKey === sk);
        // アプリで引当中の分は差し引く
        const resKg = mine.filter(x => x.status === 'reserved').reduce((a, x) => a + (+x.kg || 0), 0);
        const avail = r2(kg - resKg);
        mine.filter(x => x.status !== 'in' && (x.costKg !== costKg || x.sheetSt !== sheetSt || x.color !== color)).forEach(x => { writeDoc('stock', {...structuredClone(x), costKg, sheetSt, color}); });
        const ins = mine.filter(x => x.status === 'in');
        ins.slice(1).forEach(x => { writeDoc('stock', {id: x.id, _d: 1}); del_++; });
        const ex = ins[0];
        if(ex){
          if(!(avail > 0)){ writeDoc('stock', {id: ex.id, _d: 1}); del_++; }
          else { const nx = {...ex, kg: avail, costKg, expiry: b.exp, side: sd.side, sheetSt, color}; if(!same(nx, ex)){ writeDoc('stock', structuredClone(nx)); upd++; } }
        }else if(avail > 0){
          writeDoc('stock', {id: 'ss_' + ssHash(sk + '|' + uid()), lotId, partId: partId(row.part), kg: avail, costKg, branch: b.edaban, status: 'in', src: 'sheet', ssKey: sk, side: sd.side, sheetSt, color, expiry: b.exp, note: row.note || ''}); add++;
        }
      });
      if(row.kg > 0 && costKg != null){ costSum += row.kg * costKg; kgSum += row.kg; }
    });
    const lot = {...(cur || {id: lotId, no: nextLotNo(), date: today()}), src: 'sheet', sheetKey: key, sheet: b.sheet, group: b.group || '', kind: b.kind,
      edaban: b.edaban, edabanRaw: b.edabanRaw || b.edaban, grade: b.grade || cur?.grade || '', breed: b.blood || b.breed || cur?.breed || '', origin: b.cert || cur?.origin || '',
      carcassKg: b.carcassKg ?? cur?.carcassKg ?? null, expiry: b.exp || '', month: b.month || ''};
    if(!same(lot, cur || null)){ writeDoc('lots', structuredClone(lot)); if(cur) upd++; }
  });
  // 在庫表から消えたもの（まだ引当てていない分だけ消す。左右に分ける前の古い形もここで消える）
  S.stock.filter(x => x.src === 'sheet' && !seenStock.has(x.ssKey) && x.status === 'in').forEach(x => { writeDoc('stock', {id: x.id, _d: 1}); del_++; });
  S.lots.filter(l => l.src === 'sheet' && !seenLot.has(l.id) && !S.stock.some(x => x.lotId === l.id)).forEach(l => writeDoc('lots', {id: l.id, _d: 1}));
  return {add, upd, del: del_, lots: blocks.length};
}
/* 在庫表とアプリのずれ（色の塗り漏れなど） */
function ssGaps(){
  const g = {needYellow: [], needGray: [], sheetOnly: [], other: []};
  S.stock.filter(s => s.src === 'sheet').forEach(s => {
    if(s.status === 'reserved' && s.sheetSt === 'in') g.needYellow.push(s);
    else if(s.status === 'out' && s.sheetSt && s.sheetSt !== 'done') g.needGray.push(s);
    else if(s.status === 'in' && (s.sheetSt === 'sold' || s.sheetSt === 'partial')) g.sheetOnly.push(s);
    if(s.sheetSt === 'other') g.other.push(s);
  });
  return g;
}

/* 注文ごとの流れ：引当 → 確定 → 在庫表を黄色 → 納品書 → 証明書 → 送り状 → 発送 → 在庫表をグレー */
function orderItems(o){ return (o.lines||[]).flatMap(l => (l.stockIds||[]).map(id => byId('stock', id)).filter(Boolean)); }
function orderFlow(o){
  const its = orderItems(o), sheetIts = its.filter(s => s.src === 'sheet'), d = o.done || {};
  const allSt = st => sheetIts.length > 0 && sheetIts.every(s => st.includes(s.sheetSt));
  const f = [
    {k:'alloc', t:'在庫を引き当てる', ok: its.length > 0},
    {k:'fix', t:'引当を確定', ok: o.status === 'alloc' || o.status === 'shipped'},
    {k:'yellow', t:'在庫表を黄色に', ok: !sheetIts.length || allSt(['sold','partial','done']), auto:true},
    {k:'delivery', t:'納品書', ok: !!d.delivery},
    {k:'cert', t:'証明書を印刷', ok: !!d.cert},
    {k:'okuri', t:'佐川の送り状', ok: !!d.okuri, manual:true},
    {k:'ship', t:'発送（出荷済にする）', ok: o.status === 'shipped'},
    {k:'gray', t:'在庫表をグレーに', ok: !sheetIts.length || allSt(['done']), auto:true},
  ];
  return f;
}
function nextStep(o){
  if(o.status === 'cancel') return null;
  const f = orderFlow(o); const n = f.find(x => !x.ok);
  return n || null;
}
async function markDone(oid, key, on){
  const o = byId('orders', oid); if(!o) return;
  const done = {...(o.done || {})}; if(on === false) delete done[key]; else done[key] = Date.now();
  o.done = done; await patch('orders', oid, {done});
}
function flowHtml(o){
  if(o.status === 'cancel') return '';
  const f = orderFlow(o); const n = f.find(x => !x.ok);
  return `<div><ol class="flow">${f.map(x => `<li class="${x.ok?'done':x===n?'now':''}">${x.ok?'✓ ':''}${x.t}${x.manual && !readOnly && o.status!=='new' ? ` <input type="checkbox" ${x.ok?'checked':''} onchange="markDone('${o.id}','${x.k}',this.checked).then(()=>openOrder('${o.id}'))" aria-label="${x.t}を済にする">` : ''}</li>`).join('')}</ol>
    ${n ? `<p style="margin:6px 0 0"><span class="nextstep">次にやること：${n.t}</span>${n.auto?`<span class="muted">（在庫表で色を塗ると、次に読み込んだときに自動で✓になります）</span>`:''}</p>` : `<p class="muted" style="margin:6px 0 0">この注文の作業はすべて終わっています。</p>`}</div>`;
}

function openOrder(id){

async function setPrice(oid, i, v){ const o = byId('orders', oid); const lines = structuredClone(o.lines); lines[i].price = +v||0; o.lines = lines; await patch('orders', oid, {lines}); openOrder(oid); }
async function setDisc(oid, v){ const o = byId('orders', oid); o.disc = +v||0; await patch('orders', oid, {disc:o.disc}); openOrder(oid); }
async function setKg(sid, v, oid){ const s = byId('stock', sid); s.kg = +v||0; await patch('stock', sid, {kg:s.kg}); if(oid) openOrder(oid); else render(); }
async function allocPicked(oid, i){
  const ids = [...document.querySelectorAll(`.pickbox[data-line="${i}"]:checked`)].map(x=>x.value);
  if(!ids.length) return toast('引き当てる在庫を選んでください');
  const o = byId('orders', oid); const lines = structuredClone(o.lines);
  lines[i].stockIds = [...new Set([...(lines[i].stockIds||[]), ...ids])]; o.lines = lines;
  await patch('orders', oid, {lines});
  for(const id of ids){ const s = byId('stock', id); s.status='reserved'; s.orderId=oid; await patch('stock', id, {status:'reserved', orderId:oid}); }
  toast(ids.length + '件を引き当てました'); openOrder(oid);
}
async function unalloc(oid, i, sid){
  const o = byId('orders', oid); const lines = structuredClone(o.lines);
  lines[i].stockIds = (lines[i].stockIds||[]).filter(x=>x!==sid); o.lines = lines;
  await patch('orders', oid, {lines});
  const s = byId('stock', sid); if(s){ s.status='in'; s.orderId=''; await patch('stock', sid, {status:'in', orderId:''}); }
  openOrder(oid);
}
async function setStatus(oid, st){ const o = byId('orders', oid); o.status = st; await patch('orders', oid, {status:st}); toast(st==='alloc'?'引当を確定しました。ラベル・証明書・納品書を出せます':'受注に戻しました'); openOrder(oid); }
async function ship(oid){
  const o = byId('orders', oid); const d = today();
  o.status='shipped'; o.shipDate = o.deliver || d;
  await patch('orders', oid, {status:'shipped', shipDate:o.shipDate});
  for(const l of o.lines) for(const id of (l.stockIds||[])){ const s = byId('stock', id); if(s){ s.status='out'; await patch('stock', id, {status:'out'}); } }
  toast('出荷済にしました（在庫から引き落とし済み）'); openOrder(oid);
}
async function unship(oid){
  const o = byId('orders', oid); o.status='alloc'; await patch('orders', oid, {status:'alloc', shipDate:''});
  for(const l of o.lines) for(const id of (l.stockIds||[])){ const s = byId('stock', id); if(s){ s.status='reserved'; await patch('stock', id, {status:'reserved'}); } }
  toast('引当済に戻しました'); openOrder(oid);
}
async function cancelOrder(oid){
  if(!confirmTwice('cancel'+oid, '取消すにはもう一度押してください')) return;
  const o = byId('orders', oid);
  for(const l of o.lines) for(const id of (l.stockIds||[])){ const s = byId('stock', id); if(s){ s.status='in'; s.orderId=''; await patch('stock', id, {status:'in', orderId:''}); } }
  const lines = o.lines.map(l=>({...l, stockIds:[]})); o.lines = lines; o.status='cancel';
  await patch('orders', oid, {status:'cancel', lines}); toast('取消しました'); closeSheet(); render();
}
const armed = {};
function confirmTwice(key, msg){ if(armed[key] && Date.now()-armed[key] < 4000){ delete armed[key]; return true; } armed[key] = Date.now(); toast(msg); return false; }

async function saveLot(id){
  const no = +$('#l_no').value || nextLotNo();
  const lot = {id: id || uid(), no, kojin: $('#l_kojin').value.trim(), date: $('#l_date').value, breed: $('#l_breed').value.trim(), grade: $('#l_grade').value.trim(),
    origin: $('#l_origin').value.trim(), carcassKg: +$('#l_ckg').value || 0, cost: +$('#l_cost').value || 0};
  const rows = [...document.querySelectorAll('#l_rows .lrow')].map(r=>({sid:r.dataset.sid, partId:r.querySelector('.r_part').value, kg:+r.querySelector('.r_kg').value||0, branch:r.querySelector('.r_br').value.trim()})).filter(r=>r.kg>0);
  await put('lots', {...(id ? (byId('lots', id) || {}) : {}), ...lot});
  const used = new Set(S.stock.filter(s=>s.lotId===lot.id).map(s=>String(s.branch)));
  let n = 1;
  for(const r of rows){
    let branch = r.branch;
    if(!branch){ while(used.has(`${no}-${n}`)) n++; branch = `${no}-${n}`; }
    used.add(branch);
    if(r.sid){ const s = byId('stock', r.sid); await patch('stock', r.sid, {partId:r.partId, kg:r.kg, branch}); Object.assign(s, {partId:r.partId, kg:r.kg, branch}); }
    else { const s = {id: uid(), lotId: lot.id, partId: r.partId, kg: r.kg, branch, status:'in', orderId:''}; await put('stock', s); }
  }
  toast('保存しました'); closeSheet(); render();
}
async function deleteLot(id){
  if(S.stock.some(s=>s.lotId===id && s.status!=='in')) return toast('引当・出荷済の部位がある個体は削除できません');
  if(!confirmTwice('lot'+id, '削除するにはもう一度押してください')) return;

async function doSplit(sid){
  const s = byId('stock', sid); const k = +$('#sp_kg').value || 0;
  if(k <= 0 || k >= s.kg) return toast('元の重量より小さい重量を入れてください');
  const ns = {id: uid(), lotId: s.lotId, partId: s.partId, kg: Math.round(k*100)/100, branch: $('#sp_br').value.trim() || s.branch+'-A', status:'in', orderId:''};
  await put('stock', ns);
  const rest = Math.round((s.kg - k)*100)/100; s.kg = rest; await patch('stock', sid, {kg: rest});
  toast('分けました'); closeSheet(); render();
}
async function ocr(input){
  const f = input.files?.[0]; if(!f || !sample) return;
  const msg = $('#ocrMsg'); msg.textContent = '写真を読み取っています…';
  try{
    const names = S.parts.map(p=>p.name);
    const r = await sample.json(`この画像は食肉の入荷伝票または部位ごとの計量表です。書かれている内容だけを読み取り、JSONで返してください。推測で値を作らないこと。読めない値は null。
形式: {"kojin": 個体識別番号の文字列 or null, "carcassKg": 枝肉重量の数値 or null, "items": [{"part": 部位名, "kg": 重量の数値, "branch": 枝番があれば文字列 or null}]}
部位名は、次の登録済みの名前に当てはまるものはその表記に合わせてください: ${JSON.stringify(names)}`, {images:[f], modelTier:'default'});
    if(r?.kojin && !$('#l_kojin').value) $('#l_kojin').value = r.kojin;
    if(r?.carcassKg && !$('#l_ckg').value) $('#l_ckg').value = r.carcassKg;
    const items = (r?.items||[]).filter(x => x && +x.kg > 0);
    const unknown = [];
    const html = items.map(x => { const p = S.parts.find(p=>p.name===x.part); if(!p) unknown.push(x.part); return lotRow({partId:p?.id, kg:+x.kg, branch:x.branch||''}); }).join('');
    const box = $('#l_rows');
    if([...box.querySelectorAll('.r_kg')].every(i=>!i.value)) box.innerHTML = '';
    box.insertAdjacentHTML('beforeend', html);
    msg.textContent = `${items.length}行を読み取りました。数字が伝票と合っているか確認してから保存してください。` + (unknown.length ? `登録にない部位名：${unknown.join('、')}（部位を選び直してください）` : '');
  }catch(e){ msg.textContent = e?.code==='not_granted' ? '写真の読み取りが許可されていません。' : '読み取れませんでした。手で入力してください。'; }
  input.value = '';
}

/* ---------- 分析 ---------- */
function linesIn(ym){
  const out = [];
  shippedIn(ym).forEach(o => {
    const c = byId('customers', o.customerId); const oc = orderCalc(o);
    (o.lines||[]).forEach(l => { const lc = lineCalc(l); const share = oc.sub ? lc.amount/oc.sub : 0; const net = lc.amount - oc.disc*share;
      out.push({part: l.partId, cust: o.customerId, area: c?.area || '未設定', kg: lc.kg, net, cost: lc.cost}); });
  });
  return out;
}
function groupTable(rows, key, label, nameFn){
  const g = {}; rows.forEach(r => { const k = r[key]; (g[k] ||= {kg:0,net:0,cost:0}); g[k].kg+=r.kg; g[k].net+=r.net; g[k].cost+=r.cost; });
  const arr = Object.entries(g).sort((a,b)=>b[1].net-a[1].net);
  if(!arr.length) return `<div class="panel"><h3>${label}</h3><div class="muted">データなし</div></div>`;
  const max = Math.max(...arr.map(x=>x[1].net), 1);
  return `<div class="panel"><h3>${label}</h3><div class="tablewrap"><table><tr><th>${label.replace('別','')}</th><th class="r">kg</th><th class="r">売上（税抜）</th><th class="r">粗利</th><th class="r">粗利率</th></tr>
  ${arr.map(([k,x])=>`<tr><td>${esc(nameFn(k))}<div class="bar" style="width:${x.net/max*100}%;margin-top:4px"></div></td><td class="r num">${kgf(x.kg)}</td><td class="r num">${yen(x.net)}</td><td class="r num">${yen(x.net-x.cost)}</td><td class="r num">${pct(x.net?(x.net-x.cost)/x.net:NaN)}</td></tr>`).join('')}</table></div></div>`;
}
function vAnalysis(){
  const rows = linesIn(V.month);
  const net = rows.reduce((a,r)=>a+r.net,0), cost = rows.reduce((a,r)=>a+r.cost,0), kg = rows.reduce((a,r)=>a+r.kg,0);
  const months = Array.from({length:12}, (_,i)=> ymShift(V.month, i-11));
  const series = months.map(m => { const r = linesIn(m); const n = r.reduce((a,x)=>a+x.net,0); return {m, net:n, gp: n - r.reduce((a,x)=>a+x.cost,0)}; });
  const mx = Math.max(1, ...series.map(s=>s.net));
  const W = 720, H = 180, pad = 26, bw = (W - pad*2) / 12;
  const chart = `<svg viewBox="0 0 ${W} ${H+28}" width="100%" role="img" aria-label="直近12か月の売上と粗利">
    <line x1="${pad}" x2="${W-pad}" y1="${H}" y2="${H}" stroke="var(--line)"/>
    ${series.map((s,i)=>{const x=pad+i*bw; const h=s.net/mx*(H-20); const g=Math.max(0,s.gp)/mx*(H-20);
      return `<rect x="${x+bw*.15}" y="${H-h}" width="${bw*.7}" height="${h}" rx="3" fill="var(--accent)" opacity=".28"><title>${s.m} 売上 ${yen(s.net)}</title></rect>
      <rect x="${x+bw*.15}" y="${H-g}" width="${bw*.7}" height="${g}" rx="3" fill="var(--accent)"><title>${s.m} 粗利 ${yen(s.gp)}</title></rect>
      <text x="${x+bw/2}" y="${H+18}" text-anchor="middle" font-size="11" fill="${s.m===V.month?'var(--ink)':'var(--sub)'}">${+s.m.slice(5)}月</text>`}).join('')}
  </svg>`;
  return `<div class="spread"><h2>分析</h2>${monthPicker()}</div>
  <div class="kpis"><div class="kpi"><span>売上（税抜）</span><b>${yen(net)}</b></div><div class="kpi"><span>粗利</span><b>${yen(net-cost)}</b></div>
  <div class="kpi"><span>粗利率</span><b>${pct(net?(net-cost)/net:NaN)}</b></div><div class="kpi"><span>出荷重量</span><b>${kgf(kg)} kg</b></div></div>
  <div class="panel"><div class="spread"><h3>直近12か月</h3><span class="muted">薄い棒＝売上、濃い棒＝粗利</span></div><div class="tablewrap">${chart}</div></div>
  <div class="grid2">${groupTable(rows,'part','部位別',partName)}${groupTable(rows,'cust','取引先別',custName)}${groupTable(rows,'area','エリア別',x=>x)}</div>
  <p class="muted" style="margin:0">原価は、個体の仕入額をその個体の部位の合計重量で割った金額（円/kg）で計算しています。値引きは注文の中の金額の割合で各部位に配分しています。</p>`;
}

/* ---------- 証明書（梅本さんのPDFを読み込んで、枝番ごとに印刷） ---------- */
const CERT_KINDS = ['購買証明書・子牛登記・遺伝子検査', '神戸肉之証', 'その他'];
V.certs = null; V.certErr = '';
async function certCall(body){
  const r = await fetch(SS_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...body, pass: Store.cfg.pass})});
  const j = await r.json(); if(!j.ok) throw new Error(j.error || 'error'); return j;
}
async function certLoad(force){
  if(!Store.cfg.pass){ V.certErr = '設定で合言葉を入れると使えます'; return; }
  if(V.certs && !force) return;
  try{ const j = await certCall({op:'certlist'}); V.certs = j.files || []; V.certErr = ''; }
  catch(e){ V.certs = null; V.certErr = /unknown op/.test(e.message) ? '証明書の保管場所を準備中です（もうすぐ使えます）' : '証明書の一覧を読めませんでした。通信を確認してください'; }
}
const certGuessEd = name => (String(name).match(/\d{3,6}/) || [''])[0];
const certGuessKind = name => /チケット|神戸肉|之証/.test(name) ? '神戸肉之証' : /証明|登記|遺伝|\d{3,6}\.pdf$/i.test(name) ? '購買証明書・子牛登記・遺伝子検査' : 'その他';
function vCerts(){
  if(!V.certs && !V.certErr){ certLoad().then(render); }
  const list = (V.certs || []).slice().sort((a,b)=>String(b.edaban).localeCompare(String(a.edaban),'ja',{numeric:true}) || a.name.localeCompare(b.name));
  const byEd = {}; list.forEach(f => (byEd[f.edaban || '（枝番なし）'] ||= []).push(f));
  const Q = (V.cq || '').trim();
  const eds = Object.keys(byEd).filter(e => !Q || e.includes(Q));
  return `<div class="spread"><h2>証明書</h2></div>
  <div class="panel"><h3>PDFを読み込む</h3>
    <p class="muted" style="margin:0">購買証明書・子牛登記・遺伝子検査・神戸肉之証のPDFを選ぶと、ファイル名の数字を枝番として登録します（例：9769.pdf、9769チケット.pdf）。枝番が違うときは、読み込んだあとに直せます。受注の「証明書」ボタンから、その注文の枝番の証明書をまとめて印刷できます。</p>
    <div class="row"><label class="btn pri" style="cursor:pointer">PDFを選ぶ<input type="file" accept="application/pdf,.pdf" multiple hidden onchange="certUpload(this)" ${wr()}></label><span class="muted" id="certMsg"></span></div></div>
  ${V.certErr ? `<div class="empty">${esc(V.certErr)}</div>` : !V.certs ? `<div class="empty">読み込み中…</div>` : `
  <div class="panel"><div class="row"><label class="f" style="flex-direction:row;align-items:center;gap:6px;flex:1"><span style="white-space:nowrap">枝番で探す</span><input value="${esc(Q)}" inputmode="numeric" onchange="V.cq=this.value;render()"></label><span class="muted">${eds.length}頭分・${list.length}ファイル</span></div></div>
  ${eds.length ? `<div class="certgrid">${eds.map(e => `<div class="certrow"><b class="num" style="min-width:60px">枝番 ${esc(e)}</b>
      <span style="flex:1;display:flex;flex-wrap:wrap;gap:6px">${byEd[e].map(f=>`<span class="pill st-cancel" title="${esc(f.name)}">${esc(f.kind||'—')}：${esc(f.name)} <a href="javascript:void 0" onclick="certEdit('${f.id}')" style="font-weight:400">直す</a></span>`).join('')}</span>
      <button class="btn sm pri" onclick="certPrint(${esc(JSON.stringify(byEd[e].map(f=>f.id)))})">印刷</button></div>`).join('')}</div>`
    : `<div class="empty">${list.length ? '該当する枝番はありません。' : 'まだ証明書はありません。「PDFを選ぶ」から読み込みます。'}</div>`}`}`;
}
async function certUpload(input){
  const files = [...(input.files || [])]; input.value = ''; if(!files.length) return;
  const msg = $('#certMsg'); let ok = 0;
  for(const f of files){
    if(msg) msg.textContent = `読み込み中… ${f.name}`;
    const buf = new Uint8Array(await f.arrayBuffer()); let bin = ''; for(let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    const ed = certGuessEd(f.name) || prompt(`「${f.name}」の枝番を入れてください`) || '';
    if(!ed){ toast('枝番が分からないので読み込みませんでした：' + f.name); continue; }
    try{ await certCall({op:'certput', name: f.name, mime: f.type || 'application/pdf', edaban: ed, kind: certGuessKind(f.name), data: btoa(bin)}); ok++; }
    catch(e){ toast('読み込めませんでした：' + f.name); }
  }
  await certLoad(true); render(); toast(`${ok}件の証明書を読み込みました`);
}
function certEdit(id){
  const f = (V.certs || []).find(x => x.id === id); if(!f) return;
  openSheet(`<div class="shhead"><h2>証明書を直す</h2><button class="btn ghost" onclick="closeSheet()">閉じる</button></div>
  <div class="shbody"><p class="muted" style="margin:0">${esc(f.name)}</p><div class="fgrid">
    <label class="f">枝番<input id="ce_ed" class="num" value="${esc(f.edaban)}" inputmode="numeric"></label>
    <label class="f">種類<select id="ce_kind">${CERT_KINDS.map(k=>`<option ${k===f.kind?'selected':''}>${k}</option>`).join('')}</select></label></div></div>
  <div class="shfoot"><button class="btn" onclick="certDel('${id}')" ${wr()}>削除</button><button class="btn" onclick="certPrint(['${id}'])">このファイルだけ印刷</button><button class="btn pri" onclick="certSave('${id}')" ${wr()}>保存</button></div>`);
}

async function certDel(id){
  if(!confirmTwice('cdel'+id, '削除するにはもう一度押してください')) return;
  try{ await certCall({op:'certdel', id}); await certLoad(true); closeSheet(); render(); toast('削除しました（ドライブのゴミ箱に移しました）'); }
  catch(e){ toast('削除できませんでした'); }
}
let pdfLibP = null;
function loadPdfLib(){ return pdfLibP ||= new Promise((ok, ng) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js'; sc.onload = () => ok(window.PDFLib); sc.onerror = ng; document.head.appendChild(sc); }); }
async function certPrint(ids, oid){
  if(!ids || !ids.length) return toast('印刷する証明書がありません');
  toast('証明書を準備しています…');
  try{
    const lib = await loadPdfLib();
    const out = await lib.PDFDocument.create();
    for(const id of ids){
      const j = await certCall({op:'certget', id});
      const bytes = Uint8Array.from(atob(j.data), c => c.charCodeAt(0));
      if(!/pdf/.test(j.mime || 'pdf')){ continue; }
      const src = await lib.PDFDocument.load(bytes, {ignoreEncryption: true});
      (await out.copyPages(src, src.getPageIndices())).forEach(pg => out.addPage(pg));
    }
    const url = URL.createObjectURL(new Blob([await out.save()], {type:'application/pdf'}));
    if(oid) markDone(oid, 'cert');
    const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; f.src = url;
    f.onload = () => { setTimeout(() => { try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(_){ window.open(url, '_blank'); } }, 300); };
    document.body.appendChild(f); setTimeout(() => f.remove(), 120000);
  }catch(e){ toast('証明書を印刷できませんでした。通信を確認してください'); }
}
async function openCertPrint(oid){
  const o = byId('orders', oid); V.backTo = oid;
  const eds = [...new Set(orderItems(o).map(s => String(byId('lots', s.lotId)?.edaban || s.branch)))];
  openSheet(`<div class="shhead"><h2>証明書</h2><button class="btn ghost" onclick="closeSheet()">閉じる</button></div><div class="shbody"><p class="muted">読み込み中…</p></div>`);
  await certLoad(true);
  const files = (V.certs || []).filter(f => eds.includes(String(f.edaban)));
  const missing = eds.filter(e => !files.some(f => String(f.edaban) === e));
  openSheet(`<div class="shhead"><h2>証明書（No.${esc(o.no)}）</h2><button class="btn ghost" onclick="closeSheet()">閉じる</button></div>
  <div class="shbody">
    ${V.certErr ? `<div class="empty">${esc(V.certErr)}</div>` : ''}
    <p style="margin:0">この注文の枝番：<b class="num">${eds.map(esc).join('、') || '—'}</b></p>
    ${files.length ? `<div class="certgrid">${files.map(f=>`<label class="certrow"><input type="checkbox" class="cpick" value="${f.id}" checked><b class="num">枝番 ${esc(f.edaban)}</b><span>${esc(f.kind||'')}</span><span class="muted">${esc(f.name)}</span></label>`).join('')}</div>` : ''}
    ${missing.length ? `<p class="muted" style="margin:0">証明書が見つからない枝番：${missing.map(esc).join('、')}（「証明書」タブで読み込めます）</p>` : ''}
  </div>
  <div class="shfoot"><button class="btn" onclick="openOrder('${oid}')">受注に戻る</button><button class="btn" onclick="docCert('${oid}')">アプリで作る証明書</button>
    ${files.length ? `<button class="btn pri" onclick="certPrint([...document.querySelectorAll('.cpick:checked')].map(x=>x.value),'${oid}')">選んだ証明書を印刷</button>` : ''}</div>`);

function printHtml(html){
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const d = f.contentDocument; d.open(); d.write(html); d.close();
  setTimeout(() => { try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(_){ toast('印刷できませんでした。「ファイルを保存」から開いて印刷してください'); } setTimeout(() => f.remove(), 3000); }, 400);
}
async function saveCfg(){
  Store.cfg = {url: $('#c_url').value.trim(), pass: $('#c_pass').value};
  lsSet(LS_CFG, Store.cfg); Store.online = null;
  if(Store.cfg.url){
    Object.keys(Store.data).forEach(c => Object.values(Store.data[c]).forEach(d => { if(!Store.queue.some(q=>q.col===c&&q.id===d.id)) Store.queue.push({col:c, id:d.id, doc:d}); }));
    saveLocal(); await pull(); await flush();
    toast(Store.online ? 'つながりました' : 'つながりませんでした。URLと合言葉を確認してください');
  }
  render();
}
function exportAll(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({app:'usunaga-oroshi', at:new Date().toISOString(), data:Store.data})], {type:'application/json'}));
  a.download = `卸台帳_バックアップ_${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function importAll(input){
  const f = input.files?.[0]; if(!f) return;
  f.text().then(t => {
    const j = JSON.parse(t); if(j.app !== 'usunaga-oroshi') throw new Error();
    Object.entries(j.data||{}).forEach(([c, docs]) => { if(!Store.data[c]) return; Object.values(docs).forEach(d => writeDoc(c, d)); });
    render(); toast('読み込みました');
  }).catch(() => toast('このファイルは読み込めません'));
  input.value = '';
}
(function boot(){
  Store.cfg = lsGet(LS_CFG, {url:'', pass:''}); if(!Store.cfg.url) Store.cfg.url = SS_URL;
  const saved = lsGet(LS_DATA, null); if(saved) ALL.forEach(c => Store.data[c] = saved[c] || {});
  Store.queue = lsGet(LS_Q, []);
  rebuild(); V.loaded = true; syncLabel(); render();
  pull().then(flush);
  setInterval(() => { if(document.visibilityState === 'visible'){ pull(); flush(); } }, 20000);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ pull(); flush(); } });
  window.addEventListener('online', () => { pull(); flush(); });
})();
</script>
</body></html>
